[project]
name = "yt3-python-tooling"
version = "0.1.0"
description = "Reproducible Python runtime used by YT3 production audits"
requires-python = ">=3.11,<3.14"
dependencies = [
  "huggingface-hub>=0.30.0",
  "librosa>=0.10.2",
  "numpy>=1.26.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "requests>=2.0",
  "speechbrain>=1.0.0",
  "torch>=2.5.0",
]

[dependency-groups]
dev = [
    "pyrefly>=0.26",
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
    "node_modules",
    "data",
    "db",
    "runs",
    "sbg-nav-audit/reports",
    "sbg-nav-audit/snapshots",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyrefly]
preset = "basic"
project-includes = [
	"scripts/check_python.py",

    "sbg-nav-audit/scripts",
    "src/scripts/voice_forensic_audit.py",
]
project-excludes = [
    "**/.git/**",
    "**/.venv/**",
    "**/__pycache__/**",
    "**/node_modules/**",
]
search-path = [".", "sbg-nav-audit/scripts"]
python-platform = "linux"
python-version = "3.11"
ignore-missing-imports = [
    "librosa",
    "numpy",
    "requests",
	"speechbrain.*",
    "torch",
    "yaml",
]
