version: '3'

tasks:
  default:
    cmds: ["task --list"]
    silent: true

  setup:
    desc: "Install Bun and production-audit Python dependencies from committed lockfiles"
    cmds:
      - bun run setup
      - uv sync --frozen
      - uv run --frozen python src/scripts/production_runtime_preflight.py --mode setup

  byosan:runtime-smoke:
    desc: "Verify the Byosan production Python runtime and model cache without publishing"
    cmds:
      - uv run --frozen python src/scripts/production_runtime_preflight.py --mode full
      - BYOSAN_RUNTIME_MODE=smoke bun src/scripts/verify_byosan_runtime.ts

  loop:
    desc: "Run the daily production loop and audit"
    cmds:
      - task byosan:publish-daily
      - PROFILE=humanity task run
      - bun src/scripts/audit_today.ts --gate

  run:
    desc: "Run the canonical workflow (PROFILE=byosan|humanity; default byosan)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE=${PROFILE:-byosan} bun src/index.ts {{.CLI_ARGS}}"]

  humanity:music:
    desc: "Humanity music archive: generate | rate <id> <score> [note] | report | playlist | preflight (local only, never publishes)"
    cmds: ["bun src/scripts/humanity_music.ts {{.CLI_ARGS}}"]

  humanity:music-prepare:
    desc: "Prepare one 人類観測所 music video through the product release gate (DATE=YYYY-MM-DD required; SLOT optional; HUMANITY_BRIEF sets the subject)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - bun src/scripts/humanity_music.ts prepare {{.DATE}} {{.SLOT}}
      - task release:check PROFILE=humanity -- humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}
      - |
        echo "PUBLISH_READY_RUN=humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"
        echo "PUBLISH_COMMAND=task publish PROFILE=humanity -- humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"

  humanity:music-daily:
    desc: "Prepare, publish, and add to the YouTube playlist one 人類観測所 music video (DATE=YYYY-MM-DD required; SLOT=<alnum> optional)"
    cmds:
      - task humanity:music-prepare DATE={{.DATE}} SLOT={{.SLOT}}
      - task publish PROFILE=humanity -- humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}
      - bun src/scripts/humanity_music.ts youtube-playlist {{.DATE}} {{.SLOT}}

  yawa:prepare:
    desc: "Prepare one 夜話アーカイブ ASMR episode through the product release gate without publishing (DATE=YYYY-MM-DD required; SLOT=<alnum> optional for a second episode on the same date)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - bun src/scripts/yawa_daily.ts prepare {{.DATE}} {{.SLOT}}
      - task release:check PROFILE=yawa -- yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}
      - |
        echo "PUBLISH_READY_RUN=yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"
        echo "PUBLISH_COMMAND=task publish PROFILE=yawa -- yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"

  yawa:validate:
    desc: "Validate one 夜話アーカイブ episode end to end (DATE=YYYY-MM-DD required; SLOT optional; read-only)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - bun src/scripts/yawa_validate.ts {{.DATE}} {{.SLOT}}

  yawa:metadata:
    desc: "Rewrite the title, description and tags of one published 夜話アーカイブ episode to the current rules, then read back and record it (RUN=yawa-YYYY-MM-DD[-slot])"
    cmds:
      - bun src/scripts/yawa_metadata.ts {{.RUN}}

  byosan:metadata:
    desc: "Rewrite the description (chapters and primary sources) of one published 秒算マネー video from its run, then read back and record it (RUN=byosan_money/YYYY-MM-DD-slot; -- --dry prints the description without writing; -- --title=TEXT also sets the title)"
    cmds:
      - bun src/scripts/byosan_metadata.ts {{.RUN}} {{.CLI_ARGS}}

  byosan:thumbnail:
    desc: "Generate a gpt-image-2 thumbnail with the question text and set it on one published 秒算マネー video, then read back (RUN=byosan_money/YYYY-MM-DD-slot; -- --text=QUESTION; add --dry to only build the files)"
    cmds:
      - bun src/scripts/byosan_thumbnail.ts {{.RUN}} {{.CLI_ARGS}}

  yawa:daily:
    desc: "Prepare and publish one 夜話アーカイブ ASMR episode (DATE=YYYY-MM-DD required; SLOT optional for another episode; publishes only after the release gate passes)"
    cmds:
      - task yawa:prepare DATE={{.DATE}} SLOT={{.SLOT}}
      - task publish PROFILE=yawa -- yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}

  byosan:daily:
    desc: "Research, produce, and audit one 秒算マネー feature without publishing"
    cmds:
      - ENV_FILE=config/.env.byosan YOUTUBE_CHANNEL_PROFILE=byosan bun --env-file=config/.env.byosan src/scripts/byosan_daily.ts {{.CLI_ARGS}}

  sync:deps:
    desc: "Install Bun dependencies from the committed lockfile into node_modules (fails when bun.lock is stale)"
    cmds: ["bun install --frozen-lockfile"]

  byosan:prepare:
    desc: "Prepare one 秒算マネー run through the product release gate without publishing (DATE=YYYY-MM-DD required)"
    deps: [sync:deps]
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - BYOSAN_DATE={{.DATE}} task byosan:daily
      - task release:check PROFILE=byosan -- byosan_money/{{.DATE}}-daily${BYOSAN_SUFFIX}
      - |
        echo "PUBLISH_READY_RUN=byosan_money/{{.DATE}}-daily${BYOSAN_SUFFIX}"
        echo "PUBLISH_COMMAND=task publish PROFILE=byosan -- byosan_money/{{.DATE}}-daily${BYOSAN_SUFFIX}"

  byosan:repair:
    desc: "Repair one failed 秒算マネー daily run from its failure_trace with codex (DATE=YYYY-MM-DD required)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - BYOSAN_DATE={{.DATE}} bun src/scripts/byosan_repair.ts

  byosan:auto:
    desc: "Prepare one 秒算マネー run; on failure repair with codex and re-prepare up to auto.max_prepare_attempts, stopping before publish (DATE=YYYY-MM-DD required)"
    deps: [sync:deps]
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - BYOSAN_DATE={{.DATE}} bun src/scripts/byosan_auto.ts

  byosan:publish-daily:
    desc: "Prepare today's 秒算マネー run through the release gate and publish it only when publish_approved (no backfill before resume_date)"
    deps: [sync:deps]
    cmds: ["bun src/scripts/byosan_publish_daily.ts"]

  byosan:runtime-verify:
    desc: "Verify Byosan prepare + probe + digest + release runtime without publishing (DATE=YYYY-MM-DD PERIOD=week|month; ANALYTICS=true optional)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
        if [ "{{.PERIOD}}" != "week" ] && [ "{{.PERIOD}}" != "month" ]; then
          echo "PERIOD=week|month is required" >&2
          exit 2
        fi
      - BYOSAN_RUNTIME_MODE=full BYOSAN_DATE={{.DATE}} PERIOD={{.PERIOD}} WITH_ANALYTICS={{.ANALYTICS}} bun src/scripts/verify_byosan_runtime.ts

  byosan:probe:
    desc: "Run an explicitly authorized 秒算マネー evidence probe (SPEC=...; paid API probes require BYOSAN_PROBE_ALLOW_PAID=true)"
    cmds:
      - |
        if [ -z "{{.SPEC}}" ]; then
          echo "SPEC=<probe request json> is required" >&2
          exit 2
        fi
      - SPEC={{.SPEC}} OUT={{.OUT}} bun src/scripts/run_byosan_probe.ts

  byosan:digest:
    desc: "Build a verified-run weekly/monthly 秒算マネー digest and pass the release gate (PERIOD=week|month END=YYYY-MM-DD)"
    cmds:
      - |
        if [ "{{.PERIOD}}" != "week" ] && [ "{{.PERIOD}}" != "month" ]; then
          echo "PERIOD=week|month is required" >&2
          exit 2
        fi
        if ! printf '%s' "{{.END}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "END=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - ENV_FILE=config/.env.byosan YOUTUBE_CHANNEL_PROFILE=byosan PERIOD={{.PERIOD}} END={{.END}} bun --env-file=config/.env.byosan src/scripts/build_byosan_digest.ts
      - |
        if [ "{{.PERIOD}}" = "week" ]; then
          RUN_ID="byosan_money/{{.END}}-weekly-digest"
        else
          RUN_ID="byosan_money/{{.END}}-monthly-digest"
        fi
        task release:check PROFILE=byosan -- "$RUN_ID"
        echo "PUBLISH_READY_RUN=$RUN_ID"
        echo "PUBLISH_COMMAND=task publish PROFILE=byosan -- $RUN_ID"

  release:check:
    desc: "Check run-specific product release conditions without external publication (PROFILE required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/check_product_release.ts {{.CLI_ARGS}}"]

  publish:
    desc: "Publish to YouTube after the product release gate (PROFILE=byosan|yawa|humanity; required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/publish_youtube.ts {{.CLI_ARGS}}"]

  auth:
    desc: "YouTube OAuth (PROFILE=byosan|yawa|humanity; required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/youtube_oauth.ts {{.CLI_ARGS}}"]

  movie:generate:
    desc: "Generate and concatenate scene videos from a JSON plan (PLAN=...)"
    cmds:
      - |
        if [ -z "{{.PLAN}}" ]; then
          echo "PLAN is required" >&2
          exit 2
        fi
        bun src/scripts/generate_movie.ts --plan "{{.PLAN}}" {{.CLI_ARGS}}

  episode:compile:
    desc: "Compile canonical episode.json into script, metadata, timeline, subtitles, short, locale strings, and Remotion inputs (EPISODE=... OUT=...)"
    cmds:
      - |
        if [ -z "{{.EPISODE}}" ] || [ -z "{{.OUT}}" ]; then
          echo "EPISODE and OUT are required" >&2
          exit 2
        fi
        bun src/scripts/compile_episode.ts --episode "{{.EPISODE}}" --out "{{.OUT}}" {{.CLI_ARGS}}

  episode:render:
    desc: "Render a compiled episode through its isolated pinned Remotion workspace (COMPILED=... OUTPUT=... KIND=main|short)"
    cmds:
      - |
        if [ -z "{{.COMPILED}}" ] || [ -z "{{.OUTPUT}}" ]; then
          echo "COMPILED and OUTPUT are required" >&2
          exit 2
        fi
        bun src/scripts/render_episode.ts --compiled "{{.COMPILED}}" --output "{{.OUTPUT}}" --kind "{{default "main" .KIND}}" {{.CLI_ARGS}}

  episode:render:motion-canvas:
    desc: "Render the same compiled renderer-neutral input in an isolated Motion Canvas workspace (COMPILED=... OUTPUT=... KIND=main|short)"
    cmds:
      - |
        if [ -z "{{.COMPILED}}" ] || [ -z "{{.OUTPUT}}" ]; then
          echo "COMPILED and OUTPUT are required" >&2
          exit 2
        fi
        MOTION_CANVAS_CHROMIUM="{{.CHROMIUM}}" bun src/scripts/render_episode_motion_canvas.ts --compiled "{{.COMPILED}}" --output "{{.OUTPUT}}" --kind "{{default "main" .KIND}}" {{.CLI_ARGS}}

  experience:audit:
    desc: "Audit a byosan episode against the Experience Contract (EPISODE=...; LANE=LIGHT|EXPLAIN|DEEP optional)"
    cmds:
      - |
        if [ -z "{{.EPISODE}}" ]; then
          echo "EPISODE is required" >&2
          exit 2
        fi
        bun src/scripts/audit_experience_contract.ts --episode "{{.EPISODE}}" {{if .LANE}}--lane "{{.LANE}}" {{end}}{{.CLI_ARGS}}

  experience:baseline:
    desc: "Compile and render an audited episode through the existing Remotion baseline (EPISODE=... OUT=...)"
    cmds:
      - |
        if [ -z "{{.EPISODE}}" ] || [ -z "{{.OUT}}" ]; then
          echo "EPISODE and OUT are required" >&2
          exit 2
        fi
        bun src/scripts/benchmark_experience_baseline.ts --episode "{{.EPISODE}}" --out "{{.OUT}}" {{.CLI_ARGS}}

  experience:render-light:
    desc: "Audit and render a prepared LIGHT episode as a Short without DEEP research or main render (EPISODE=... COMPILED=... OUTPUT=...)"
    cmds:
      - |
        if [ -z "{{.EPISODE}}" ] || [ -z "{{.COMPILED}}" ] || [ -z "{{.OUTPUT}}" ]; then
          echo "EPISODE, COMPILED, and OUTPUT are required" >&2
          exit 2
        fi
      - task experience:audit EPISODE="{{.EPISODE}}" LANE=LIGHT
      - task episode:compile EPISODE="{{.EPISODE}}" OUT="{{.COMPILED}}"
      - task episode:render COMPILED="{{.COMPILED}}" OUTPUT="{{.OUTPUT}}" KIND=short

  experience:benchmark:
    desc: "Render the fixed five-scene fixture through Remotion and Motion Canvas and write measured metrics (OUT=... optional)"
    cmds:
      - bun src/scripts/benchmark_experience.ts --out "{{default "artifacts/benchmarks/experience-os" .OUT}}" {{.CLI_ARGS}}

  experience:oss:audit:
    desc: "Audit OSS evaluation, license, commercial-use states, and final adoption evidence"
    cmds: ["bun src/scripts/audit_experience_oss_candidates.ts"]

  experience:cost-report:
    desc: "Aggregate validated renderer and TTS generation wall-time by Experience lane (ROOT=... OUT=...)"
    cmds:
      - |
        if [ -z "{{.ROOT}}" ] || [ -z "{{.OUT}}" ]; then
          echo "ROOT and OUT are required" >&2
          exit 2
        fi
        bun src/scripts/report_experience_cost.ts --root "{{.ROOT}}" --out "{{.OUT}}" {{.CLI_ARGS}}

  experience:evidence:record:
    desc: "Append one validated Experience evidence claim to db/evolution.db (INPUT=record.json)"
    cmds:
      - |
        if [ -z "{{.INPUT}}" ]; then
          echo "INPUT is required (path to an Experience evidence JSON record)" >&2
          exit 2
        fi
        bun src/scripts/record_experience_evidence.ts --input "{{.INPUT}}" {{.CLI_ARGS}}

  experience:review:template:
    desc: "Create a blank five-scene human review template bound to benchmark artifact hashes (RUN=... OUT=...)"
    cmds:
      - |
        if [ -z "{{.RUN}}" ] || [ -z "{{.OUT}}" ]; then
          echo "RUN and OUT are required" >&2
          exit 2
        fi
        bun src/scripts/experience_review.ts template --run "{{.RUN}}" --out "{{.OUT}}" {{.CLI_ARGS}}

  experience:review:audit:
    desc: "Validate a completed human review against one benchmark run without overwriting artifacts (RUN=... REVIEW=... OUT=...)"
    cmds:
      - |
        if [ -z "{{.RUN}}" ] || [ -z "{{.REVIEW}}" ] || [ -z "{{.OUT}}" ]; then
          echo "RUN, REVIEW, and OUT are required" >&2
          exit 2
        fi
        bun src/scripts/experience_review.ts audit --run "{{.RUN}}" --review "{{.REVIEW}}" --out "{{.OUT}}" {{.CLI_ARGS}}

  publish:visibility-audit:
    desc: "Audit published video visibility"
    cmds: ["bun src/scripts/public_visibility_audit.ts"]

  analytics:refresh:
    desc: "Refresh authorized YouTube Analytics and purge data past the 30-day authorization boundary"
    cmds: ["bun src/scripts/refresh_youtube_analytics.ts"]

  analytics:reach:setup:
    desc: "Create or verify the YouTube Reporting API channel-reach job (PROFILE=byosan|yawa|humanity; creates remote job state when missing)"
    cmds:
      - |
        if [ -z "{{.PROFILE}}" ]; then
          echo "PROFILE is required (byosan, yawa, or humanity)" >&2
          exit 2
        fi
        bun src/scripts/ingest_youtube_reporting_reach.ts setup "{{.PROFILE}}" {{.CLI_ARGS}}

  analytics:reach:
    desc: "Ingest recent channel-reach reports and link metrics to published episodes (PROFILE=byosan|yawa|humanity)"
    cmds:
      - |
        if [ -z "{{.PROFILE}}" ]; then
          echo "PROFILE is required (byosan, yawa, or humanity)" >&2
          exit 2
        fi
        bun src/scripts/ingest_youtube_reporting_reach.ts ingest "{{.PROFILE}}" {{.CLI_ARGS}}

  asmr:ops:
    desc: "Run ASMR archive/index operations"
    cmds: ["bun --env-file=config/.env src/scripts/asmr_ops.ts"]


  up:
    desc: "Start local services"
    cmds:
      - docker rm -f voicevox-nemo || true
      - docker run -d --name voicevox-nemo --restart unless-stopped -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
      - systemctl --user start yt3-aim.service
      - systemctl --user start yt3-discord.service

  down:
    desc: "Stop local services"
    cmds:
      - docker stop voicevox-nemo || true
      - systemctl --user stop yt3-aim.service || true
      - systemctl --user stop yt3-discord.service || true

  serve:
    desc: "Start the dashboard and API server"
    cmds: ["bun src/server.ts"]

  asr:
    desc: "Transcribe audio (FILE=... OUT=...)"
    cmds:
      - uv run --no-project --with faster-whisper python3 scripts/run_asr.py --input-wav "{{.FILE}}" --output-dir "{{.OUT}}" --model base

  lint:
    desc: "Run the canonical Biome lint/format owner"
    cmds: ["bun run lint"]

  test:
    desc: "Run unit tests"
    cmds: ["SKIP_LLM=true DRY_RUN=true bun test"]

  check:merge:fast:
    desc: "Run the fast deterministic PR merge gate"
    cmds: ["bun run check:merge:fast"]

  check:merge:
    desc: "Run the full PR merge gate used by CI"
    cmds: ["bun run check:merge"]

  design:preview:
    desc: "Render the canonical Visual Design System v1 preview artifacts"
    cmds: ["bun run design:preview"]

  clean:
    desc: "Reset logs and temporary artifacts"
    cmds:
      - rm -rf logs/*
      - touch logs/.gitkeep

  systemd:setup:
    desc: "Install systemd service and timer"
    cmds: ["bun src/io/utils/infra/setup_systemd.ts"]

  audit:today:
    desc: "Audit today's production status"
    cmds: ["bun src/scripts/audit_today.ts"]

  audit:publish-routing:
    desc: "Audit YouTube routing and profile identity"
    cmds: ["bun src/scripts/audit_publish_routing.ts"]

  audit:byosan-authenticity:
    desc: "Audit one 秒算マネー run for authenticity and write audit/authenticity.json (RUN=byosan_money/<run> required)"
    cmds: ["bun src/scripts/audit_byosan_authenticity.ts --run \"{{.RUN}}\""]

  stability:report:
    desc: "Regenerate the canonical cross-run stability report"
    cmds: ["bun src/scripts/stability_summary.ts"]

  improve:report:
    desc: "Generate the improvement report directly from run evidence"
    cmds: ["bun src/scripts/improve_report.ts"]
