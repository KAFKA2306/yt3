version: '3'

tasks:
  setup:
    desc: "Install Bun and production-audit Python dependencies from committed lockfiles"
    cmds:
      - bun run setup
      - uv sync --frozen
      - uv run --frozen python src/scripts/production_runtime_preflight.py --mode setup

  setup:openmontage:
    desc: "Clone OpenMontage outside the repository at the pinned ref and install its Remotion composer (the byosan visual renderer)"
    cmds: ["bun src/scripts/setup_openmontage.ts"]

  lexicon:report:
    desc: "Report vocabulary distribution (MATTR, pairwise Jaccard, document frequency) of generated scripts (CLI_ARGS: humanity|yawa|byosan)"
    cmds: ["uv run --no-project scripts/lexicon_report.py {{.CLI_ARGS}}"]

  sync:deps:
    desc: "Install Bun dependencies from the committed lockfile into node_modules (fails when bun.lock is stale)"
    cmds: ["bun install --frozen-lockfile"]

  loop:
    desc: "Run the daily production loop and audit"
    cmds:
      - task byosan:publish-daily
      - PROFILE=humanity task run
      - bun src/scripts/audit_today.ts

  run:
    desc: "Run the canonical workflow (PROFILE=byosan|humanity; default byosan)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE=${PROFILE:-byosan} bun src/index.ts {{.CLI_ARGS}}"]

  humanity:music-prepare:
    desc: "Prepare one 人類観測所 music video without publishing (DATE=YYYY-MM-DD required; SLOT optional; HUMANITY_BRIEF sets the subject)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - bun src/scripts/humanity_music.ts prepare {{.DATE}} {{.SLOT}}
      - |
        echo "PUBLISH_READY_RUN=humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"
        echo "PUBLISH_COMMAND=task publish PROFILE=humanity -- humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"

  humanity:music-daily:
    desc: "Prepare, publish, and add to the YouTube playlist one 人類観測所 music video (DATE=YYYY-MM-DD required; SLOT=<alnum> optional)"
    cmds:
      - task humanity:music-prepare DATE={{.DATE}} SLOT={{.SLOT}}
      - task publish PROFILE=humanity -- humanity_observatory/music-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}
      - bun src/scripts/humanity_music.ts youtube-playlist {{.DATE}} {{.SLOT}}

  humanity:music-binaural-prepare:
    desc: "Create a headphone binaural derivative of an existing Humanity song (SOURCE=<generation-id>, DATE=YYYY-MM-DD, SLOT=<alnum>)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || ! printf '%s' "{{.SLOT}}" | grep -Eq '^[A-Za-z0-9]+$' || [ -z "{{.SOURCE}}" ]; then
          echo "SOURCE, DATE=YYYY-MM-DD, and SLOT=<alnum> are required" >&2
          exit 2
        fi
      - bun src/scripts/humanity_music.ts prepare-binaural {{.SOURCE}} {{.DATE}} {{.SLOT}}
      - |
        echo "PUBLISH_READY_RUN=humanity_observatory/music-{{.DATE}}-{{.SLOT}}"
        echo "PUBLISH_COMMAND=task publish PROFILE=humanity -- humanity_observatory/music-{{.DATE}}-{{.SLOT}}"

  humanity:music-binaural-daily:
    desc: "Prepare, publish, and add a headphone binaural music video to the YouTube playlist (SOURCE=<generation-id>, DATE=YYYY-MM-DD, SLOT=<alnum>)"
    cmds:
      - task humanity:music-binaural-prepare SOURCE={{.SOURCE}} DATE={{.DATE}} SLOT={{.SLOT}}
      - task publish PROFILE=humanity -- humanity_observatory/music-{{.DATE}}-{{.SLOT}}
      - bun src/scripts/humanity_music.ts youtube-playlist {{.DATE}} {{.SLOT}}

  yawa:prepare:
    desc: "Prepare one 夜話アーカイブ ASMR episode without publishing (DATE=YYYY-MM-DD required; SLOT=<alnum> optional for a second episode on the same date)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - bun src/scripts/yawa_daily.ts prepare {{.DATE}} {{.SLOT}}
      - |
        echo "PUBLISH_READY_RUN=yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"
        echo "PUBLISH_COMMAND=task publish PROFILE=yawa -- yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}"

  yawa:validate:
    desc: "Validate one 夜話アーカイブ episode end to end (DATE=YYYY-MM-DD required; SLOT optional; read-only)"
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - bun src/scripts/yawa_validate.ts {{.DATE}} {{.SLOT}}

  yawa:diversity-audit:
    desc: "Compare completed Yawa runs independently (CLI args: [--listening observations.json] <run-name> <run-name> [...])"
    cmds: ["bun src/scripts/yawa_diversity_audit.ts {{.CLI_ARGS}}"]

  yawa:metadata:
    desc: "Apply saved metadata to one published 夜話アーカイブ episode, then read back and record it (RUN=yawa-YYYY-MM-DD[-slot])"
    cmds:
      - bun src/scripts/yawa_metadata.ts {{.RUN}}

  byosan:metadata:
    desc: "Rewrite the description (chapters and primary sources) of one published 秒算マネー video from its run, then read back and record it (RUN=byosan_money/YYYY-MM-DD-slot; -- --dry prints the description without writing; -- --title=TEXT also sets the title)"
    cmds:
      - bun src/scripts/byosan_metadata.ts {{.RUN}} {{.CLI_ARGS}}

  byosan:thumbnail:
    desc: "Generate a gpt-image-2 thumbnail with the question text and set it on one published 秒算マネー video, then read back (RUN=byosan_money/YYYY-MM-DD-slot; -- --text=QUESTION; add --dry to only build the files)"
    cmds:
      - bun src/scripts/byosan_thumbnail.ts {{.RUN}} {{.CLI_ARGS}}

  yawa:daily:
    desc: "Prepare and publish one 夜話アーカイブ ASMR episode (DATE=YYYY-MM-DD required; SLOT optional for another episode)"
    cmds:
      - task yawa:prepare DATE={{.DATE}} SLOT={{.SLOT}}
      - task publish PROFILE=yawa -- yawa_archive/yawa-{{.DATE}}{{if .SLOT}}-{{.SLOT}}{{end}}

  byosan:daily:
    desc: "Research, produce, and audit one 秒算マネー feature without publishing"
    cmds:
      - ENV_FILE=config/.env.byosan YOUTUBE_CHANNEL_PROFILE=byosan bun --env-file=config/.env.byosan src/scripts/byosan_daily.ts {{.CLI_ARGS}}

  byosan:prepare:
    desc: "Prepare one 秒算マネー run without publishing (DATE=YYYY-MM-DD required; optional FACT_SHEET=<verified fact sheet .json|.yaml> with BYOSAN_SUFFIX=-<name> replaces discovery)"
    deps: [sync:deps]
    cmds:
      - |
        if ! printf '%s' "{{.DATE}}" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
          echo "DATE=YYYY-MM-DD is required" >&2
          exit 2
        fi
      - BYOSAN_FACT_SHEET={{.FACT_SHEET}} BYOSAN_DATE={{.DATE}} task byosan:daily
      - |
        echo "PUBLISH_READY_RUN=byosan_money/{{.DATE}}-daily${BYOSAN_SUFFIX}"
        echo "PUBLISH_COMMAND=task publish PROFILE=byosan -- byosan_money/{{.DATE}}-daily${BYOSAN_SUFFIX}"

  byosan:publish-daily:
    desc: "Prepare today's 秒算マネー run and publish it only when publish_approved (no backfill before resume_date)"
    deps: [sync:deps]
    cmds: ["bun src/scripts/byosan_publish_daily.ts"]

  publish:
    desc: "Publish to YouTube (PROFILE=byosan|yawa|humanity; required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/publish_youtube.ts {{.CLI_ARGS}}"]

  auth:
    desc: "YouTube OAuth (PROFILE=byosan|yawa|humanity; required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/youtube_oauth.ts {{.CLI_ARGS}}"]

  movie:generate:
    desc: "Generate and concatenate scene videos from a JSON plan (PLAN=...)"
    cmds:
      - |
        if [ -z "{{.PLAN}}" ]; then
          echo "PLAN is required" >&2
          exit 2
        fi
        bun src/scripts/generate_movie.ts --plan "{{.PLAN}}" {{.CLI_ARGS}}

  episode:compile:
    desc: "Compile canonical episode.json into script, metadata, timeline, subtitles, short, locale strings, and Remotion inputs (EPISODE=... OUT=...)"
    cmds:
      - |
        if [ -z "{{.EPISODE}}" ] || [ -z "{{.OUT}}" ]; then
          echo "EPISODE and OUT are required" >&2
          exit 2
        fi
        bun src/scripts/compile_episode.ts --episode "{{.EPISODE}}" --out "{{.OUT}}" {{.CLI_ARGS}}

  episode:render:
    desc: "Render a compiled episode through its isolated pinned Remotion workspace (COMPILED=... OUTPUT=... KIND=main|short)"
    cmds:
      - |
        if [ -z "{{.COMPILED}}" ] || [ -z "{{.OUTPUT}}" ]; then
          echo "COMPILED and OUTPUT are required" >&2
          exit 2
        fi
        bun src/scripts/render_episode.ts --compiled "{{.COMPILED}}" --output "{{.OUTPUT}}" --kind "{{default "main" .KIND}}" {{.CLI_ARGS}}

  publish:visibility-audit:
    desc: "Audit published video visibility"
    cmds: ["bun src/scripts/public_visibility_audit.ts"]

  analytics:refresh:
    desc: "Refresh authorized YouTube Analytics and purge data past the 30-day authorization boundary"
    cmds: ["bun src/scripts/refresh_youtube_analytics.ts"]

  analytics:build:
    desc: "Build and test the dbt analytical star schema and channel growth KPI marts over db/evolution.db"
    cmds:
      - mkdir -p data/analytics
      - uvx --from dbt-core --with dbt-duckdb dbt build --project-dir analytics --profiles-dir analytics

  bench:byosan:
    desc: "Run Layer 1 deterministic benchmark on recent 秒算マネー runs (CLI_ARGS: [--limit=5] [--run=<name>] [--json] [--with-lexicon] [--strict])"
    cmds: ["bun src/scripts/benchmark_channel.ts byosan {{.CLI_ARGS}}"]

  bench:yawa:
    desc: "Run Layer 1 deterministic benchmark on recent 夜話アーカイブ runs (CLI_ARGS: [--limit=5] [--run=<name>] [--json] [--with-lexicon] [--strict])"
    cmds: ["bun src/scripts/benchmark_channel.ts yawa {{.CLI_ARGS}}"]

  bench:humanity:
    desc: "Run Layer 1 deterministic benchmark on recent 雨晴はうの人類観測所 runs (CLI_ARGS: [--limit=5] [--run=<name>] [--json] [--with-lexicon] [--strict])"
    cmds: ["bun src/scripts/benchmark_channel.ts humanity {{.CLI_ARGS}}"]

  bench:all:
    desc: "Run Layer 1 deterministic benchmarks across all 3 channels (CLI_ARGS: [--limit=5] [--json] [--with-lexicon] [--strict])"
    cmds: ["bun src/scripts/benchmark_channel.ts all {{.CLI_ARGS}}"]

  bench:judge:
    desc: "Run Layer 2 independent blind model judge (CLI_ARGS: single|compare <byosan|yawa|humanity> <run> [candidate-run] [--model=...])"
    cmds: ["bun src/scripts/benchmark_judge.ts {{.CLI_ARGS}}"]

  resident:tick:
    desc: "Run one lock-protected, resumable Kafstyler resident agent tick (benchmarks, dbt sync, service checks, question ledger)"
    cmds: ["bun src/scripts/resident_agent.ts tick {{.CLI_ARGS}}"]

  resident:status:
    desc: "Inspect the resident agent work ledger, question ledger, and latest health snapshot"
    cmds: ["bun src/scripts/resident_agent.ts status"]

  resident:questions:
    desc: "List pending and answered owner questions in the resident agent question ledger"
    cmds: ["bun src/scripts/resident_agent.ts questions"]

  resident:ledger:
    desc: "Render the live owner-required action ledger as Markdown and point to docs/standard/owner-action-ledger.md"
    cmds: ["bun src/scripts/resident_agent.ts ledger"]

  resident:advisories:
    desc: "Show the latest token-minimized supervisor advisories generated only on new anomaly/bias deltas"
    cmds: ["bun src/scripts/resident_agent.ts advisories"]

  resident:answer:
    desc: "Record an owner answer in the question ledger so the next resident tick resumes blocked steps (CLI_ARGS: <question_id> <answer_ref> <summary>)"
    cmds: ["bun src/scripts/resident_agent.ts answer {{.CLI_ARGS}}"]

  analytics:reach:setup:
    desc: "Create or verify the YouTube Reporting API channel-reach job (PROFILE=byosan|yawa|humanity; creates remote job state when missing)"
    cmds:
      - |
        if [ -z "{{.PROFILE}}" ]; then
          echo "PROFILE is required (byosan, yawa, or humanity)" >&2
          exit 2
        fi
        bun src/scripts/ingest_youtube_reporting_reach.ts setup "{{.PROFILE}}" {{.CLI_ARGS}}

  analytics:reach:
    desc: "Ingest recent channel-reach reports and link metrics to published episodes (PROFILE=byosan|yawa|humanity)"
    cmds:
      - |
        if [ -z "{{.PROFILE}}" ]; then
          echo "PROFILE is required (byosan, yawa, or humanity)" >&2
          exit 2
        fi
        bun src/scripts/ingest_youtube_reporting_reach.ts ingest "{{.PROFILE}}" {{.CLI_ARGS}}

  asmr:ops:
    desc: "Run ASMR archive/index operations"
    cmds: ["bun --env-file=config/.env src/scripts/asmr_ops.ts"]

  up:
    desc: "Start local services"
    cmds:
      - docker rm -f voicevox-nemo || true
      - docker run -d --name voicevox-nemo --restart unless-stopped -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
      - systemctl --user start yt3-aim.service
      - systemctl --user start yt3-discord.service

  down:
    desc: "Stop local services"
    cmds:
      - docker stop voicevox-nemo || true
      - systemctl --user stop yt3-aim.service || true
      - systemctl --user stop yt3-discord.service || true

  serve:
    desc: "Start the dashboard and API server"
    cmds: ["bun src/server.ts"]

  check:merge:fast:
    desc: "Run the fast deterministic PR merge gate"
    cmds: ["bun run check:merge:fast"]

  check:merge:
    desc: "Run the full PR merge gate used by CI"
    cmds: ["bun run check:merge"]

  audit:today:
    desc: "Audit today's production status"
    cmds: ["bun src/scripts/audit_today.ts"]

  audit:publish-routing:
    desc: "Audit YouTube routing and profile identity"
    cmds: ["bun src/scripts/audit_publish_routing.ts"]

  stability:report:
    desc: "Regenerate the canonical cross-run stability report"
    cmds: ["bun src/scripts/stability_summary.ts"]

  improve:report:
    desc: "Generate the improvement report directly from run evidence"
    cmds: ["bun src/scripts/improve_report.ts"]

  env:refresh:
    desc: "Run one autonomous dev-environment refresh cycle (DRY_RUN=1 prints the command only)"
    cmds: ["bash scripts/env_refresh.sh"]

  env:refresh:install:
    desc: "Install and enable the hourly environment refresh timer (systemd user)"
    cmds:
      - mkdir -p "$HOME/.config/systemd/user"
      - cp systemd/yt3-env-refresh.service systemd/yt3-env-refresh.timer "$HOME/.config/systemd/user/"
      - systemctl --user daemon-reload
      - systemctl --user enable --now yt3-env-refresh.timer
      - systemctl --user list-timers yt3-env-refresh.timer --no-pager

  systemd:install:
    desc: "Sync YT3 user systemd services and timers (byosan, yawa, humanity, analytics, resident) and reload"
    cmds:
      - mkdir -p "$HOME/.config/systemd/user"
      - cp systemd/yt3-byosan-daily.service systemd/yt3-byosan-daily.timer systemd/yt3-yawa-daily.service systemd/yt3-yawa-daily.timer systemd/yt3-yawa-validate.service systemd/yt3-yawa-validate.timer systemd/yt3-humanity-music.service systemd/yt3-humanity-music.timer systemd/yt3-analytics-refresh.service systemd/yt3-analytics-refresh.timer systemd/yt3-resident-agent.service systemd/yt3-resident-agent.timer "$HOME/.config/systemd/user/"
      - systemctl --user daemon-reload
      - systemctl --user enable --now yt3-byosan-daily.timer yt3-yawa-daily.timer yt3-yawa-validate.timer yt3-humanity-music.timer yt3-analytics-refresh.timer yt3-resident-agent.timer
      - systemctl --user list-timers 'yt3*' --no-pager
