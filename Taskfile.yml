version: '3'

tasks:
  default:
    cmds: ["task --list"]
    silent: true

  setup:
    desc: "Install dependencies from the committed Bun lockfile"
    cmds: ["bun run setup"]

  loop:
    desc: "Run the daily production loop and audit"
    cmds: ["bun src/scripts/agentic_orchestrator.ts"]

  run:
    desc: "Run the full workflow"
    cmds: ["bun --env-file=config/.env src/index.ts {{.CLI_ARGS}}"]

  run:humanity:
    desc: "Run the Humanity Observatory workflow"
    cmds: ["ENV_FILE=config/.env YOUTUBE_CHANNEL_PROFILE=humanity BUCKET=humanity_observatory bun --env-file=config/.env src/index.ts {{.CLI_ARGS}}"]

  byosan:daily:
    desc: "Research, produce, audit, and publish one 秒算マネー feature"
    cmds:
      - ENV_FILE=config/.env.byosan YOUTUBE_CHANNEL_PROFILE=byosan bun --env-file=config/.env.byosan src/scripts/byosan_daily.ts {{.CLI_ARGS}}

  release:check:
    desc: "Check run-specific product release conditions without external publication (PROFILE required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/check_product_release.ts {{.CLI_ARGS}}"]

  publish:
    desc: "Publish to YouTube after the product release gate (PROFILE=byosan|yawa|humanity; required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/publish_youtube.ts {{.CLI_ARGS}}"]

  auth:
    desc: "YouTube OAuth (PROFILE=byosan|yawa|humanity; required)"
    cmds: ["YOUTUBE_CHANNEL_PROFILE={{.PROFILE}} bun src/scripts/youtube_oauth.ts {{.CLI_ARGS}}"]

  movie:generate:
    desc: "Generate and concatenate scene videos from a JSON plan (PLAN=...)"
    cmds:
      - |
        if [ -z "{{.PLAN}}" ]; then
          echo "PLAN is required" >&2
          exit 2
        fi
        bun src/scripts/generate_movie.ts --plan "{{.PLAN}}" {{.CLI_ARGS}}

  movie:status:
    desc: "Report movie receipt status without changing state"
    cmds: ["bun src/scripts/movie_status.ts"]

  publish:visibility-audit:
    desc: "Audit published video visibility"
    cmds: ["bun src/scripts/public_visibility_audit.ts"]

  analytics:refresh:
    desc: "Refresh authorized YouTube Analytics and purge data past the 30-day authorization boundary"
    cmds: ["bun src/scripts/refresh_youtube_analytics.ts"]

  db:backfill:
    desc: "Backfill historic runs into the Evolution Database"
    cmds: ["bun src/scripts/backfill_db.ts"]

  db:evolution:
    desc: "Run Evolution operations"
    cmds: ["bun src/scripts/evolution_ops.ts {{.CLI_ARGS}}"]

  asmr:ops:
    desc: "Run ASMR archive/index operations"
    cmds: ["bun --env-file=config/.env src/scripts/asmr_ops.ts"]

  asmr:publish:
    desc: "Batch publish completed ASMR projects"
    cmds: ["bun src/scripts/publish_batch.ts"]

  up:
    desc: "Start local services"
    cmds:
      - docker rm -f voicevox-nemo || true
      - docker run -d --name voicevox-nemo --restart unless-stopped -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
      - systemctl --user start yt3-aim.service
      - systemctl --user start yt3-discord.service

  down:
    desc: "Stop local services"
    cmds:
      - docker stop voicevox-nemo || true
      - systemctl --user stop yt3-aim.service || true
      - systemctl --user stop yt3-discord.service || true

  serve:
    desc: "Start the dashboard and API server"
    cmds: ["bun src/server.ts"]

  bootstrap:
    desc: "Install dependencies and start services"
    cmds:
      - task setup
      - task up

  nav:fetch:
    desc: "Fetch latest market prices and FX for SBG NAV"
    dir: sbg-nav-audit
    cmds:
      - python3 scripts/fetch_prices.py
      - python3 scripts/fetch_fx.py

  nav:calculate:
    desc: "Calculate SBG NAV and discount"
    dir: sbg-nav-audit
    cmds: ["python3 scripts/calculate_nav.py"]

  nav:audit:
    desc: "Audit SBG NAV data"
    dir: sbg-nav-audit
    cmds: ["python3 scripts/run_audit.py"]

  nav:report:
    desc: "Export SBG NAV audit report"
    dir: sbg-nav-audit
    cmds: ["python3 scripts/export_report.py"]

  asr:
    desc: "Transcribe audio (FILE=... OUT=...)"
    cmds:
      - uv run --no-project --with faster-whisper python3 .claude/skills/audio-production/scripts/run_asr.py --input-wav "{{.FILE}}" --output-dir "{{.OUT}}" --model base

  lint:
    desc: "Run the canonical Biome lint/format owner"
    cmds: ["bun run lint"]

  test:
    desc: "Run unit tests"
    cmds: ["SKIP_LLM=true DRY_RUN=true bun test"]

  check:merge:fast:
    desc: "Run the fast deterministic PR merge gate"
    cmds: ["bun run check:merge:fast"]

  check:merge:
    desc: "Run the full PR merge gate used by CI"
    cmds: ["bun run check:merge"]

  clean:
    desc: "Reset logs and temporary artifacts"
    cmds:
      - rm -rf logs/*
      - touch logs/.gitkeep

  systemd:setup:
    desc: "Install systemd service and timer"
    cmds: ["bun src/io/utils/infra/setup_systemd.ts"]

  audit:today:
    desc: "Audit today's production status"
    cmds: ["bun src/scripts/audit_today.ts"]

  audit:publish-routing:
    desc: "Audit YouTube routing and profile identity"
    cmds: ["bun src/scripts/audit_publish_routing.ts"]

  audit:byosan-money:
    desc: "Run 秒算マネー source-policy audit"
    cmds:
      - bun scripts/audit_byosan_money_zero_trust.ts
      - bun src/scripts/audit_byosan_source_registry.ts
      - bun src/scripts/audit_no_fallback_policy.ts --scope=source

  audit:no-fallback:
    desc: "Audit no-fallback policy (SCOPE=source|runtime|all; default all)"
    cmds: ["bun src/scripts/audit_no_fallback_policy.ts --scope={{.SCOPE}}"]

  audit:repo-contract:
    desc: "Verify Taskfile executables and documented repository entry points"
    cmds: ["bun src/scripts/audit_repository_contract.ts"]

  daily:guarantee-status:
    desc: "Generate the daily guarantee status artifact"
    cmds: ["bun src/scripts/daily_guarantee_status.ts"]

  daily:last3:
    desc: "Show the latest three daily runs"
    cmds: ["DAILY_LAST3=1 bun src/scripts/daily_guarantee_status.ts"]

  daily:report:
    desc: "Regenerate daily audit and stability artifacts"
    cmds:
      - task audit:today
      - bun src/scripts/stability_summary.ts
      - bun src/scripts/daily_guarantee_status.ts

  improve:report:
    desc: "Generate improvement-loop inputs"
    cmds:
      - task daily:report
      - task movie:status
      - task audit:publish-routing
      - task audit:no-fallback
      - bun src/scripts/improve_report.ts
