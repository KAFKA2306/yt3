version: '3'

tasks:
  default:
    cmds: 
      - task --list
      - task up
      - task lint
      - task test
    silent: true

  # ============================================================================
  # MAIN WORKFLOW
  # ============================================================================
  run:
    desc: "Run the full workflow (Production Mode)"
    aliases: [r]
    cmds: ["bun --env-file=config/.env src/index.ts {{.CLI_ARGS}}"]

  run:cognitive:
    desc: "Run the Humanity Observatory workflow"
    cmds: ["BUCKET=cognitive_observation bun --env-file=config/.env src/index.ts {{.CLI_ARGS}}"]

  run:cached:
    desc: "Run full workflow using cached LLM outputs (WARNING: May Publish)"
    cmds: ["SKIP_LLM=true bun --env-file=config/.env src/index.ts {{.CLI_ARGS}}"]

  # ============================================================================
  # UNIT STEPS
  # ============================================================================
  research:
    desc: "Run research step only"
    cmds: ["bun --env-file=config/.env src/step.ts research {{.CLI_ARGS}}"]

  content:
    desc: "Run content step only"
    cmds: ["bun --env-file=config/.env src/step.ts content {{.CLI_ARGS}}"]

  media:
    desc: "Run media step only (TTS & Rendering)"
    aliases: [render]
    cmds: ["bun --env-file=config/.env src/step.ts media {{.CLI_ARGS}}"]

  audit:
    desc: "Run Zero-Trust audit on the latest or specified run"
    cmds: ["bun --env-file=config/.env src/scripts/run_audit.ts {{.CLI_ARGS}}"]

  publish:
    desc: "Run publish step only (requires explicit channel profile env file)"
    cmds:
      - |
        bash -lc '
          if [ -z "${ENV_FILE:-}" ]; then
            echo "Refusing to publish without ENV_FILE. Use config/.env.byosan or config/.env.yawa.";
            exit 1;
          fi
          if [ "$ENV_FILE" = "config/.env" ]; then
            echo "Refusing to publish from config/.env. Use a channel-specific env file.";
            exit 1;
          fi
          bun --env-file="$ENV_FILE" src/step.ts publish "${RUN_ID:-{{.CLI_ARGS}}}"
        '

  publish:byosan:
    desc: "Run publish step with the 秒算マネー profile"
    cmds:
      - ENV_FILE=config/.env.byosan task publish {{.CLI_ARGS}}

  publish:yawa:
    desc: "Run publish step with the 夜話アーカイブ ASMR profile"
    cmds:
      - task publish ENV_FILE=config/.env.yawa RUN_ID={{.CLI_ARGS}}

  publicize:yawa:
    desc: "Make ASMR video public (requires RUN_ID)"
    cmds:
      - ENV_FILE=config/.env.yawa YOUTUBE_ALLOW_PUBLICIZE=true RUN_ID={{.CLI_ARGS}} bun src/io/utils/infra/ensure_public.ts

  auth:yawa:
    desc: "Generate YouTube refresh token for the 夜話アーカイブ ASMR profile"
    cmds:
      - ENV_FILE=config/.env.yawa bun src/scripts/get_youtube_token.ts

  report:
    desc: "Generate full executive report (Macro, Fundamental, Risk, Event, Whale)"
    cmds: ["bun --env-file=config/.env src/report_workflow.ts {{.CLI_ARGS}}"]

  notebooklm:
    desc: "Run NotebookLM workflow: create, generate, download, and publish"
    cmds: ["bun --env-file=config/.env src/notebooklm_workflow.ts {{.CLI_ARGS}}"]

  publish:nlm:
    desc: "Batch publish existing videos in runs-nlm/ to YouTube"
    cmds: ["bun --env-file=config/.env src/scripts/post_nlm_videos.ts"]

  pulse:auto:
    desc: "Run full Daily Pulse to NotebookLM automation"
    cmds: ["bun --env-file=config/.env src/pulse_to_video_workflow.ts"]

  # ============================================================================
  # EVOLUTION & OPS
  # ============================================================================
  db:backfill:
    desc: "Backfill historic runs into the Evolution Database"
    cmds: ["bun src/scripts/backfill_db.ts"]

  db:evolution:
    desc: "Run ACE Evolution operations (evaluate|evolve|acquire)"
    cmds: ["bun src/scripts/evolution_ops.ts {{.CLI_ARGS}}"]

  asmr:ops:
    desc: "Autonomous ASMR Operations (Archive, Symlink, Index)"
    cmds:
      - bun --env-file=config/.env src/scripts/asmr_ops.ts

  asmr:publish:
    desc: "Batch publish all completed ASMR projects"
    cmds:
      - bun src/scripts/publish_batch.ts

  # ============================================================================
  # INFRASTRUCTURE
  # ============================================================================
  up:
    desc: "Start background services (Voicevox, Aim, Discord Bot)"
    cmds:
      - docker rm -f voicevox-nemo || true
      - docker run -d --name voicevox-nemo --restart unless-stopped -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
      - systemctl --user start yt3-aim.service
      - systemctl --user start yt3-discord.service

  down:
    desc: "Stop all background services"
    cmds:
      - docker stop voicevox-nemo || true
      - systemctl --user stop yt3-aim.service || true
      - systemctl --user stop yt3-discord.service || true

  serve:
    desc: "Start the Evolution Dashboard and API Server"
    cmds: ["bun src/server.ts"]

  serve:legacy:
    desc: "Start the Legacy HTMX Dashboard (Deprecated)"
    cmds: ["bun src/dashboard/server.ts"]

  bootstrap:
    desc: "Install dependencies and setup environment"
    cmds:
      - bun install
      - task up

  # ============================================================================
  # UTILITIES
  # ============================================================================
  lint:
    desc: "Type-check and Lint"
    aliases: [l]
    cmds:
      - npx tsc --noEmit
      - bun biome check src

  test:
    desc: "Run unit tests (bun test)"
    aliases: [t]
    cmds: ["SKIP_LLM=true bun test || echo 'No tests found'"]

  clean:
    desc: "Reset logs and temporary artifacts"
    cmds:
      - rm -rf logs/*
      - touch logs/.gitkeep

  systemd:setup:
    desc: "Install Systemd service and timer"
    cmds: ["bun src/io/utils/infra/setup_systemd.ts"]
