name: One-shot remove synthetic generation dynamics

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-synthetic-generation-dynamics
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Remove synthetic dynamics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def must_replace(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          def cut(text: str, start: str, end: str, replacement: str, label: str) -> str:
              if start not in text or end not in text[text.index(start):]:
                  raise SystemExit(f'missing range: {label}')
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          # Canonical workflow: remove all generation-dynamics orchestration.
          p = Path('src/workflow.ts')
          t = p.read_text()
          t = t.replace('import { DynamicsOrchestrator } from "./domain/evolution/dynamics_orchestrator.js";\n', '')
          t = t.replace('\n\tGenerationDynamics,', '')
          t = re.sub(
              r'\n\tconst dynOrch = new DynamicsOrchestrator\(store\);\n\tconst dynPath = path\.join\(store\.runDir, "generation_dynamics\.json"\);\n\tconst dynamicsObj: Partial<GenerationDynamics> = fs\.existsSync\(dynPath\)\n\t\t\? fs\.readJsonSync\(dynPath\)\n\t\t: \{\};\n',
              '\n', t, count=1,
          )
          t = cut(t, '\n\tif (\n\t\tstate.director_data &&\n\t\t(!dynamicsObj.world_state', '\n\tconst metadataJsonPath', '\n', 'workflow research dynamics')
          t = cut(t, '\n\tif (\n\t\tstate.script &&\n\t\tstate.metadata &&\n\t\t(!dynamicsObj.strategy_genome', '\n\tconst videoPath', '\n', 'workflow narrative dynamics')
          t = cut(t, '\n\tstate.generation_dynamics = dynOrch.calculateEvolution(', '\n\tstore.updateState(state);', '\n', 'workflow pre-audit dynamics')
          t = cut(t, '\n\tconst finalDynamics = dynOrch.calculateEvolution(', '\n\tstore.updateState(state);', '\n', 'workflow post-publish dynamics')
          p.write_text(t)

          # Humanity workflow: same removal; keep research/content/media/audit/publish only.
          p = Path('src/humanity_observatory_workflow.ts')
          t = p.read_text()
          t = t.replace('import { DynamicsOrchestrator } from "./domain/evolution/dynamics_orchestrator.js";\n', '')
          t = t.replace('import type { AgentState, GenerationDynamics } from "./domain/types.js";', 'import type { AgentState } from "./domain/types.js";')
          t = re.sub(
              r'\n\tconst dynOrch = new DynamicsOrchestrator\(store\);\n\tconst dynPath = path\.join\(store\.runDir, "generation_dynamics\.json"\);\n\tconst dynamicsObj: Partial<GenerationDynamics> = fs\.existsSync\(dynPath\)\n\t\t\? fs\.readJsonSync\(dynPath\)\n\t\t: \{\};\n',
              '\n', t, count=1,
          )
          t = cut(t, '\n\t// Generate Phase 1 Dynamics:', '\n\t// 2. Scripting', '\n', 'humanity research dynamics')
          t = cut(t, '\n\t// Generate Phase 2 Dynamics:', '\n\t// 3. Media Generation', '\n', 'humanity narrative dynamics')
          t = cut(t, '\n\t// Generate Phase 3 Dynamics:', '\n\t// 4. Humanity Quality Audit', '\n', 'humanity evolution dynamics')
          t = t.replace('\n\tstate.generation_dynamics = dynamicsObj as GenerationDynamics;', '')
          p.write_text(t)

          # Audit: remove the self-referential dynamics/meta gates and implementations.
          p = Path('src/domain/agents/audit.ts')
          t = p.read_text()
          t = t.replace('import { DynamicsOrchestrator } from "../evolution/dynamics_orchestrator.js";\n', '')
          t = t.replace('import { MetaAuditLayer } from "./meta_audit_layer.js";\n', '')
          t = cut(t, '\n\t\t// 5.8 GENERATION DYNAMICS AUDIT', '\n\t\t// 5.10 HUMANITY OBSERVATORY AUDIT', '\n', 'audit dynamics calls')
          t = cut(t, '\n\tprivate auditGenerationDynamics(', '\n\tprivate async auditHumanityObservatory(', '\n', 'audit dynamics methods')
          p.write_text(t)

          # Agent state no longer stores synthetic generation dynamics.
          p = Path('src/domain/types.ts')
          t = p.read_text()
          t = t.replace('\nexport * from "./schemas/generation_dynamics.js";\nimport { GenerationDynamicsSchema } from "./schemas/generation_dynamics.js";\n', '\n')
          t = t.replace('\n\tgeneration_dynamics: GenerationDynamicsSchema.optional(),', '')
          p.write_text(t)

          # Freshness now uses only observed run content, not LLM-generated dynamics.
          Path('src/io/utils/creative_freshness.ts').write_text(r'''import path from "node:path";
import fs from "fs-extra";
import yaml from "js-yaml";
import type { AgentState } from "../../domain/types.js";
import { type AssetStore, ROOT } from "../core.js";

export interface CreativeFreshnessMetrics {
	novelty_score: number;
	diversity_score: number;
	serendipity_score: number;
	coverage_score: number;
	concreteness_score: number;
	freshness_score: number;
	max_similarity: number;
	recent_run_count: number;
	signals: string[];
	pass: boolean;
}

type RunProfile = {
	run_id: string;
	title: string;
	intro: string;
	topic: string;
	category: string;
};

function tokenize(text: string): Set<string> {
	return new Set(
		text
			.toLowerCase()
			.replace(/[^\p{L}\p{N}\s]/gu, " ")
			.split(/\s+/)
			.filter((token) => token.length >= 2),
	);
}

function jaccard(a: string, b: string): number {
	const left = tokenize(a);
	const right = tokenize(b);
	const union = new Set([...left, ...right]);
	if (union.size === 0) return 0;
	let intersection = 0;
	for (const token of left) if (right.has(token)) intersection++;
	return intersection / union.size;
}

function sampleIntro(script: AgentState["script"]): string {
	if (!script?.lines?.length) return "";
	return script.lines
		.slice(0, 12)
		.map((line) => `${line.speaker}: ${line.text}`)
		.join(" ");
}

function extractCategory(
	directorData: Record<string, unknown> | undefined,
	metadata: AgentState["metadata"],
): string {
	const raw =
		typeof directorData?.angle === "string"
			? directorData.angle
			: metadata?.title || "";
	const text = raw.toLowerCase();
	if (text.includes("ai") || text.includes("半導体") || text.includes("tech")) return "tech";
	if (text.includes("金利") || text.includes("インフレ") || text.includes("frb") || text.includes("cpi")) return "macro";
	if (text.includes("人類") || text.includes("humanity") || text.includes("観測")) return "humanity";
	if (text.includes("株") || text.includes("market") || text.includes("決算")) return "market";
	return "other";
}

function getRecentRunProfiles(store: AssetStore, bucket: string): RunProfile[] {
	const runsDir = path.join(ROOT, "runs", bucket);
	if (!fs.existsSync(runsDir)) return [];
	return fs
		.readdirSync(runsDir)
		.map((runId) => path.join(runsDir, runId))
		.filter((runDir) => fs.statSync(runDir).isDirectory())
		.map((runDir) => {
			const statePath = path.join(runDir, "state.json");
			const contentPath = path.join(runDir, "content", "output.yaml");
			const state = fs.existsSync(statePath)
				? (fs.readJsonSync(statePath) as AgentState)
				: undefined;
			const content = fs.existsSync(contentPath)
				? (yaml.load(fs.readFileSync(contentPath, "utf8")) as
						| { script?: AgentState["script"]; metadata?: AgentState["metadata"] }
						| undefined)
				: undefined;
			const title =
				state?.metadata?.title ||
				content?.metadata?.title ||
				state?.script?.title ||
				content?.script?.title ||
				"";
			const intro =
				sampleIntro(state?.script || content?.script) ||
				String((state?.director_data as Record<string, unknown> | undefined)?.title_hook || "");
			const topic =
				typeof state?.director_data?.search_query === "string"
					? state.director_data.search_query
					: title;
			return {
				run_id: path.basename(runDir),
				title,
				intro,
				topic,
				category: extractCategory(
					state?.director_data as Record<string, unknown> | undefined,
					state?.metadata || content?.metadata,
				),
			};
		})
		.filter((profile) => profile.title || profile.intro || profile.topic)
		.sort((a, b) => a.run_id.localeCompare(b.run_id))
		.slice(-12);
}

function countConcreteSignals(text: string): number {
	const numbers = text.match(/\d+(?:\.\d+)?/g)?.length || 0;
	const japaneseUnits = text.match(/[兆億万%]/g)?.length || 0;
	const concreteWords =
		text.match(/(円|ドル|社|件|回|人|日|年|秒|分|時間|駅|国|市場|企業|株|金利|決算|ニュース|動画|字幕|音声)/g)?.length || 0;
	return numbers + japaneseUnits + concreteWords;
}

export function evaluateCreativeFreshness(
	store: AssetStore,
	state: AgentState,
): CreativeFreshnessMetrics {
	const bucket = state.bucket || store.domainId;
	if (!bucket) throw new Error("Creative freshness requires an explicit bucket");
	const currentTitle = state.metadata?.title || state.script?.title || "";
	const currentIntro = sampleIntro(state.script);
	const currentTopic =
		typeof state.director_data?.search_query === "string"
			? state.director_data.search_query
			: currentTitle;
	const currentCategory = extractCategory(
		state.director_data as Record<string, unknown> | undefined,
		state.metadata,
	);
	const currentText = `${currentTitle}\n${currentIntro}\n${currentTopic}`;
	const recent = getRecentRunProfiles(store, bucket).filter(
		(profile) => profile.run_id !== path.basename(store.runDir),
	);

	const similarities = recent.map((profile) =>
		jaccard(currentTitle, profile.title) * 0.45 +
		jaccard(currentIntro, profile.intro) * 0.35 +
		jaccard(currentTopic, profile.topic) * 0.2,
	);
	const maxSimilarity = similarities.length > 0 ? Math.max(...similarities) : 0;
	const noveltyScore = Math.max(0, 100 * (1 - maxSimilarity));

	const signatures = new Set(
		recent.map((profile) =>
			[profile.category, profile.title.trim().toLowerCase(), profile.topic.trim().toLowerCase()].join("|"),
		),
	);
	const diversityScore =
		recent.length === 0 ? 100 : (signatures.size / recent.length) * 100;

	const questionCount = (currentIntro.match(/[?？]/g) || []).length;
	const hookSignal = /(なぜ|どうして|しかし|でも|意外|実は|ただし|ところが|unexpected|surprise|why)/i.test(currentIntro) ? 1 : 0;
	const concreteSignal = countConcreteSignals(currentText);
	const introLength = currentIntro.length;
	const concisionScore =
		introLength === 0 ? 0 : Math.max(0, 100 - Math.max(0, introLength - 420) / 6);
	const concretenessScore = Math.min(
		100,
		concreteSignal * 12 + questionCount * 8 + hookSignal * 20 + concisionScore * 0.2,
	);

	const observedCategories = new Set([currentCategory, ...recent.map((profile) => profile.category)]);
	const coverageScore = Math.min(100, observedCategories.size * 25);
	const serendipityScore = Math.min(noveltyScore, concretenessScore);
	const freshnessScore = Math.min(
		noveltyScore,
		diversityScore,
		serendipityScore,
		coverageScore,
	);

	const signals: string[] = [];
	if (maxSimilarity >= 0.45) signals.push("recent_similarity_high");
	if (diversityScore < 45) signals.push("recent_content_diversity_low");
	if (concretenessScore < 40) signals.push("opening_is_too_abstract");
	if (coverageScore < 45) signals.push("coverage_is_narrow");
	if (serendipityScore < 55) signals.push("novelty_or_concreteness_low");

	const pass =
		noveltyScore >= 60 &&
		diversityScore >= 45 &&
		serendipityScore >= 55 &&
		coverageScore >= 45;

	return {
		novelty_score: Number(noveltyScore.toFixed(2)),
		diversity_score: Number(diversityScore.toFixed(2)),
		serendipity_score: Number(serendipityScore.toFixed(2)),
		coverage_score: Number(coverageScore.toFixed(2)),
		concreteness_score: Number(concretenessScore.toFixed(2)),
		freshness_score: Number(freshnessScore.toFixed(2)),
		max_similarity: Number(maxSimilarity.toFixed(3)),
		recent_run_count: recent.length,
		signals,
		pass,
	};
}
''')

          for name in [
              'src/domain/evolution/dynamics_orchestrator.ts',
              'src/domain/agents/meta_audit_layer.ts',
              'src/domain/schemas/generation_dynamics.ts',
          ]:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f'missing expected synthetic dynamics file: {name}')
              path.unlink()

          # Source/tests must no longer depend on the deleted synthetic subsystem.
          forbidden = [
              'DynamicsOrchestrator', 'MetaAuditLayer', 'GenerationDynamics',
              'generation_dynamics', 'StrategyGenomeSchema', 'AttentionStateSchema',
              'AudienceResponseStateSchema', 'EvolutionStateSchema',
          ]
          for root in [Path('src'), Path('tests')]:
              for file in root.rglob('*'):
                  if not file.is_file() or file.suffix not in {'.ts', '.tsx', '.js', '.json'}:
                      continue
                  text = file.read_text(errors='ignore')
                  hits = [needle for needle in forbidden if needle in text]
                  if hits:
                      raise SystemExit(f'stale dynamics reference in {file}: {hits}')
          PY
          bun x biome format --write src tests
          bun run check:merge:fast
      - name: Commit simplification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: remove synthetic generation dynamics'
          git push origin HEAD:refactor/remove-synthetic-generation-dynamics
