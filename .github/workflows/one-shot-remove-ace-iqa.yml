name: One-shot remove ACE IQA output

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-ace-prompt-injection
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Remove stale ACE IQA output
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/io/utils/qa/iqa_check.ts')
          text = path.read_text()
          start = text.index('\tconst aceDir = cfg.workflow.paths.ace_dir')
          end_marker = '\tconsole.log(`\\n${COLORS.cyan}📊 監査ログ: ${logPath}${COLORS.reset}`);\n\n'
          end = text.index(end_marker, start) + len(end_marker)
          text = text[:start] + text[end:]
          if 'ace_dir' in text or 'data/ace' in text:
              raise SystemExit('stale ACE IQA reference remains')
          path.write_text(text)
          PY
          bun x biome format --write src/io/utils/qa/iqa_check.ts
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: remove stale ACE IQA output'
          git push origin HEAD:refactor/remove-ace-prompt-injection
