name: Refactor - Generate Bun Lockfile

on:
  push:
    branches:
      - refactor/operator-contract-20260821

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor/operator-contract-20260821

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Generate lockfile
        run: bun install

      - name: Commit lockfile
        run: |
          if git diff --quiet -- bun.lock && git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "bun.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "build: add Bun lockfile"
          git push origin HEAD:refactor/operator-contract-20260821
