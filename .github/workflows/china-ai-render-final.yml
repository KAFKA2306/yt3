name: Final China AI render

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Fix thumbnail contract and self-remove
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('config/productions/china_ai_quant_20260816.json')
          data = json.loads(p.read_text())
          data['thumbnail']['lead'] = 'GPU'
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
          bun x biome format --write "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/china-ai-render-final.yml
          git add "$SPEC"
          git commit -m "fix(byosan): satisfy China AI thumbnail contract"
          git push origin HEAD:feat/china-ai-quant-20260816
      - name: Validate
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Produce and audit video
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Record YouTube blocker
        if: success()
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          printf '%s\n' '{"status":"BLOCKED_MISSING_YOUTUBE_SECRETS","channel":"秒算マネー"}' > "runs/$RUN_ID/publish/automation_status.json"
      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-token-supply-20260816-final
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
