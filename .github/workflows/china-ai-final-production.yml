name: Final China AI production

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
      ENV_FILE: config/.env.byosan
      YOUTUBE_CHANNEL_PROFILE: byosan
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Keep every scene under the motion gate
        shell: bash
        run: |
          bun - <<'BUN'
          const p = process.env.SPEC;
          const spec = await Bun.file(p).json();
          const text = {
            1: "順位ではなく供給を見る。Token120兆、算力2185、国産chip56万、AI売上88億元。この4つから始めます。",
            5: "DeepSeek V4-Flashは、100万Tokenでcache miss入力0.14ドル、出力0.28ドルです。",
            10: "Alibaba Cloudは四半期416.26億元なのだ。次にAI製品売上を見るのだ。",
            15: "Atlas 950は1024枚。FP8で1、FP4で2 EFLOPS。統一メモリは256TBです。",
            16: "Baidu Q1はAI事業136億元、AI Cloudは88億元で前年比79%増です。",
          };
          for (const [i, value] of Object.entries(text)) spec.segments[Number(i)].text = value;
          await Bun.write(p, JSON.stringify(spec, null, "\t") + "\n");
          BUN
          bun x biome format --write "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/china-ai-final-production.yml
          git add "$SPEC"
          git commit -m "fix(byosan): keep China AI narration under scene limit"
          git push origin HEAD:feat/china-ai-quant-20260816
      - name: Validate exact tree
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Produce and audit video
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Publish when Byosan credentials exist
        shell: bash
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          if [[ -z "$YOUTUBE_CLIENT_ID" || -z "$YOUTUBE_CLIENT_SECRET" || -z "$YOUTUBE_REFRESH_TOKEN" ]]; then
            printf '%s\n' '{"status":"BLOCKED_MISSING_YOUTUBE_SECRETS","channel":"秒算マネー"}' > "runs/$RUN_ID/publish/automation_status.json"
            exit 0
          fi
          umask 077
          cat > "$ENV_FILE" <<EOF
          ENV_FILE=$ENV_FILE
          YOUTUBE_CHANNEL_PROFILE=byosan
          YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID
          YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET
          YOUTUBE_REFRESH_TOKEN=$YOUTUBE_REFRESH_TOKEN
          EOF
          bun src/scripts/audit_publish_routing.ts
          bun src/scripts/publish_youtube.ts "$RUN_ID"
          bun src/scripts/public_visibility_audit.ts
          rm -f "$ENV_FILE"
      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-token-supply-20260816-final-pass
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
