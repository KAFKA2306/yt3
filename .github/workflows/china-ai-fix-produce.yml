name: Repair and produce China AI feature

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write

jobs:
  repair-produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch headless character fallback and latest MIIT disclosure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          script_path = Path('src/scripts/produce_byosan_feature.ts')
          text = script_path.read_text()
          start = text.index('async function characterBuffer(')
          end = text.index('\nasync function renderScene(', start)
          replacement = r'''function fallbackCharacterSvg(
          	speaker: FeatureSegment["speaker"],
          ): Buffer {
          	const isZundamon = speaker === "ずんだもん";
          	const accent = isZundamon ? "#84CC55" : "#40D9FF";
          	const accent2 = isZundamon ? "#D7F76D" : "#9D7BFF";
          	return Buffer.from(`<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900">
          		<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="${accent}"/><stop offset="1" stop-color="${accent2}"/></linearGradient></defs>
          		<circle cx="360" cy="300" r="220" fill="${accent}" fill-opacity="0.10" stroke="${accent}" stroke-opacity="0.28" stroke-width="4"/>
          		<circle cx="360" cy="292" r="126" fill="url(#g)"/>
          		<circle cx="322" cy="278" r="12" fill="#07111F"/><circle cx="398" cy="278" r="12" fill="#07111F"/>
          		<path d="M326 333 Q360 360 394 333" fill="none" stroke="#07111F" stroke-width="10" stroke-linecap="round"/>
          		<path d="M138 840 Q174 515 360 492 Q546 515 582 840 Z" fill="url(#g)" opacity="0.92"/>
          		<rect x="110" y="730" width="500" height="96" rx="48" fill="#07111F" fill-opacity="0.92" stroke="${accent}" stroke-width="3"/>
          		<text x="360" y="792" text-anchor="middle" font-family="Noto Sans CJK JP, sans-serif" font-size="42" font-weight="800" fill="#F7FBFF">${speaker}</text>
          	</svg>`);
          }

          async function characterSourceBuffer(
          	speaker: FeatureSegment["speaker"],
          ): Promise<Buffer> {
          	const source =
          		speaker === "ずんだもん"
          			? path.join(PROJECT_ROOT, "assets/zundamon.webp")
          			: path.join(
          					PROJECT_ROOT,
          					"assets/春日部つむぎ立ち絵公式_v2.0/春日部つむぎ立ち絵公式_v2.0.png",
          				);
          	if (await fs.pathExists(source)) return fs.readFile(source);
          	console.warn(`[CHARACTER_FALLBACK] ${speaker}: ${source}`);
          	return fallbackCharacterSvg(speaker);
          }

          async function characterBuffer(
          	speaker: FeatureSegment["speaker"],
          ): Promise<Buffer> {
          	return sharp(await characterSourceBuffer(speaker))
          		.trim({ background: { r: 255, g: 255, b: 255, alpha: 0 } })
          		.resize({
          			height: speaker === "ずんだもん" ? 650 : 720,
          			fit: "inside",
          			withoutEnlargement: true,
          		})
          		.png()
          		.toBuffer();
          }
          '''
          text = text[:start] + replacement + text[end:]

          thumb_fn = text.index('async function renderThumbnail(')
          thumb_start = text.index('\tconst character = await sharp(', thumb_fn)
          thumb_end = text.index('\n\tconst thumbnail = spec.thumbnail;', thumb_start)
          thumb_replacement = '''\tconst character = await sharp(\n\t\tawait characterSourceBuffer("春日部つむぎ"),\n\t)\n\t\t.trim({ background: { r: 255, g: 255, b: 255, alpha: 0 } })\n\t\t.resize({ height: 930, fit: "inside", withoutEnlargement: false })\n\t\t.png()\n\t\t.toBuffer();'''
          text = text[:thumb_start] + thumb_replacement + text[thumb_end:]
          script_path.write_text(text)

          spec_path = Path('config/productions/china_ai_quant_20260816.json')
          spec = json.loads(spec_path.read_text())
          source = {
              'id': 'miit_apec_2026',
              'name': '工業和信息化部 2026年APECデジタル・AI閣僚会議記者会見',
              'url': 'https://www.miit.gov.cn/xwfb/bldhd/art/2026/art_d109e2b6dc4844cc902a1f6f49712f67.html',
          }
          if not any(s['id'] == source['id'] for s in spec['sources']):
              spec['sources'].append(source)
          for claim in spec['claims']:
              if claim['claim'].startswith('2025年の中国の智能算力は1590 EFLOPS'):
                  claim['claim'] = '2025年の中国の智能算力は1590 EFLOPS、AI企業は6200社超、AI核心産業規模は1.2兆元を突破'
                  claim['sourceIds'] = ['miit_2025_ai', 'miit_apec_2026']
          for segment in spec['segments']:
              if segment.get('section') == 'AI INDUSTRY':
                  segment['headline'] = '核心産業 1.2兆元突破'
                  segment['subheadline'] = 'AI企業 6200社超'
                  segment['stats'][0] = {'label': 'AI核心産業規模', 'value': '>1.2兆元', 'detail': '2025年', 'color': 'cyan'}
                  segment['stats'][1] = {'label': 'AI企業', 'value': '>6200社', 'detail': '2025年', 'color': 'amber'}
                  segment['source'] = '工業和信息化部 • 2025 / 2026-07'
                  segment['text'] = '2025年について工信部は、AI企業6200社超、AI核心産業規模1.2兆元突破と公表しています。'
          spec_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + '\n')
          PY
          bun x biome format --write src/scripts/produce_byosan_feature.ts "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/china-ai-fix-produce.yml
          git add src/scripts/produce_byosan_feature.ts "$SPEC"
          git commit -m "fix(byosan): support headless feature production"
          git push origin HEAD:feat/china-ai-quant-20260816
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate repository
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Produce and audit video
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Record publish availability
        if: success()
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          printf '%s\n' '{"status":"BLOCKED_MISSING_YOUTUBE_CREDENTIALS_IN_GITHUB_ACTIONS","channel":"秒算マネー","channel_id":"UCYtjO-PYBfdG3MuPLXfhA-Q"}' > "runs/$RUN_ID/publish/automation_status.json"
      - name: Upload audited production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-quant-20260816-v2
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
