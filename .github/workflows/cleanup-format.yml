name: Cleanup format

on:
  push:
    branches:
      - cleanup/remove-all-legacy

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-all-legacy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Fix explicit response type and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/domain/agents/publish.ts')
          text = path.read_text()
          old = '\t\t\tlet response;\n'
          new = '\t\t\tlet response: Awaited<ReturnType<typeof youtube.videos.insert>>;\n'
          if old not in text:
              raise SystemExit('publish response declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          bun biome format --write .
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: apply canonical Biome formatting'
          git push origin HEAD:cleanup/remove-all-legacy
