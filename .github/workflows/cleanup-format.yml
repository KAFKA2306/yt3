name: Cleanup final fix

on:
  push:
    branches:
      - cleanup/remove-all-legacy

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-all-legacy
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Remove dead graph dependencies and old audit bucket
        shell: bash
        run: |
          bun remove @langchain/langgraph @langchain/openai
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/domain/agents/audit.ts')
          text = path.read_text()
          old = '(state.bucket === "humanity_observatory" ||\n\t\t\t\tstate.bucket === "daily_pulse")'
          if old not in text:
              raise SystemExit('legacy audit bucket condition not found')
          path.write_text(text.replace(old, 'state.bucket === "humanity_observatory"', 1))
          PY
          bun biome format --write package.json src/domain/agents/audit.ts
      - name: Commit canonical cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock src/domain/agents/audit.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: remove dead graph dependencies'
          git push origin HEAD:cleanup/remove-all-legacy
