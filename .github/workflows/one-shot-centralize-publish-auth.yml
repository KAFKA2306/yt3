name: One-shot publisher auth simplifier

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  simplify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/centralize-youtube-profile-auth
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - name: Centralize PublishAgent OAuth
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/domain/agents/publish.ts')
          text = path.read_text()
          text = text.replace(
          '''import {
          \tassertYouTubeChannelMatchesProfile,
          \tgetYouTubeProfile,
          \thydrateOAuthCredentials,
          } from "../youtube_profiles.js";''',
          '''import {
          \tassertYouTubeChannelMatchesProfile,
          \tcreateYouTubeOAuthClient,
          \tgetYouTubeProfile,
          } from "../youtube_profiles.js";''')
          text = text.replace(
          '''\t\tconst auth = await this.createYouTubeClient();
          \t\tconst youtube = google.youtube({ version: "v3", auth });
          \t\tawait this.verifyYouTubeChannel(auth);''',
          '''\t\tconst { auth } = await createYouTubeOAuthClient(profile.profileName);
          \t\tconst youtube = google.youtube({ version: "v3", auth });
          \t\tawait assertYouTubeChannelMatchesProfile(auth, profile);''')
          start = text.index('\n\tprivate async verifyYouTubeChannel(')
          end = text.index('\n\tprivate async setYouTubeThumbnail(', start)
          text = text[:start] + text[end:]
          if 'createYouTubeClient' in text or 'hydrateOAuthCredentials' in text:
              raise SystemExit('stale OAuth helper remains in PublishAgent')
          path.write_text(text)
          PY
          bun x biome format --write src/domain/agents/publish.ts
      - name: Commit simplification
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/domain/agents/publish.ts
          git diff --cached --quiet && exit 0
          git commit -m 'refactor: centralize PublishAgent OAuth'
          git push origin HEAD:refactor/centralize-youtube-profile-auth
