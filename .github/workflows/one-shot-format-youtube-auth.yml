name: One-shot YouTube auth formatter
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/centralize-youtube-profile-auth
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun ci
      - run: bun x biome check --write src/scripts/public_visibility_audit.ts
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/scripts/public_visibility_audit.ts
          git diff --cached --quiet && exit 0
          git commit -m 'style: format YouTube auth refactor'
          git push origin HEAD:refactor/centralize-youtube-profile-auth
