name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun run setup

    - name: TypeScript Check
      run: bun run typecheck

    - name: Biome Check
      run: bun run lint

    - name: Publish Safety Audits
      run: |
        bun run audit:publish-routing
        bun run audit:no-fallback

    - name: Run Tests
      run: bun run test
      env:
        SKIP_LLM: true
        DRY_RUN: true
