name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  merge-gate:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        fetch-depth: 2

    - name: Verify Discord token update safety (no secrets)
      run: python3 -m unittest discover -s tests -p 'test_set_discord_token.py' -v

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.4

    - name: Install dependencies from lockfile
      run: bun ci

    - name: PR merge gate
      run: bun run check:merge
