name: CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: fix/remove-humanity-pacing-bypass
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install dependencies from lockfile
      run: bun ci
    - name: Apply bounded migration
      run: python scripts/remove_humanity_pacing_bypass.py
    - name: Format
      run: bun x biome format --write src tests
    - name: Fast merge gate
      run: bun run check:merge:fast
    - name: Commit migration
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add -A
        git diff --cached --quiet && exit 0
        git commit -m 'fix: remove humanity pacing bypass'
        git push origin HEAD:fix/remove-humanity-pacing-bypass
