name: CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  merge-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: refactor/remove-synthetic-generation-dynamics
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - name: Install dependencies from lockfile
      run: bun ci
    - name: Narrow audit migration
      run: |
        python - <<'PY'
        from pathlib import Path
        p = Path('scripts/remove_synthetic_dynamics.py')
        t = p.read_text()
        old = '''t = cut(t, "\\n\\tprivate auditGenerationDynamics(", "\\n\\tprivate async auditHumanityObservatory(", "\\n", "audit dynamics methods")'''
        new = '''t = cut(t, "\\n\\tprivate auditGenerationDynamics(", "\\n\\tprivate async auditMetaEvolution(", "\\n", "audit generation dynamics method")
        t = cut(t, "\\n\\tprivate async auditMetaEvolution(", "\\n\\t/**\\n\\t * ASVS Tier 0/1 Deterministic Retention & Slop Audit.", "\\n", "audit meta evolution method")'''
        if old not in t:
            raise SystemExit('old broad audit cut not found')
        p.write_text(t.replace(old, new, 1))
        PY
    - name: Apply bounded migration
      run: python scripts/remove_synthetic_dynamics.py
    - name: Format
      run: bun x biome format --write src tests
    - name: Fast merge gate
      run: bun run check:merge:fast
    - name: Commit migration
      run: |
        git config user.name github-actions[bot]
        git config user.email 41898282+github-actions[bot]@users.noreply.github.com
        git add -A
        git diff --cached --quiet && exit 0
        git commit -m 'refactor: remove synthetic generation dynamics'
        git push origin HEAD:refactor/remove-synthetic-generation-dynamics
