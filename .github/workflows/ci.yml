name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  merge-gate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - name: Install dependencies from lockfile
      run: bun ci

    - name: PR merge gate
      run: bun run check:merge

    - name: Install media tools for episode render smoke
      run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg zip unzip

    - name: Episode production-quality render smoke
      run: bun src/scripts/smoke_episode_pipeline.ts

    - name: Pack bounded episode render evidence
      run: |
        cd .artifacts/episode-render-smoke
        zip -9 -r ../episode-render-smoke-evidence.zip \
          ja-main.mp4 ja-short.mp4 en-main.mp4 frames evidence
        cd ..
        size=$(stat -c%s episode-render-smoke-evidence.zip)
        echo "episode evidence zip bytes=$size"
        test "$size" -le 26214400
        if unzip -l episode-render-smoke-evidence.zip | grep -q 'node_modules'; then
          echo "node_modules leaked into episode render evidence" >&2
          exit 1
        fi

    - name: Upload episode render smoke evidence
      uses: actions/upload-artifact@v4
      with:
        name: episode-render-smoke
        path: .artifacts/episode-render-smoke-evidence.zip
        if-no-files-found: error

    - name: Byosan Active Probe runtime smoke
      run: bun src/scripts/verify_byosan_runtime.ts
      env:
        BYOSAN_RUNTIME_MODE: smoke

    - name: Upload Byosan runtime smoke evidence
      uses: actions/upload-artifact@v4
      with:
        name: byosan-runtime-smoke
        path: .artifacts/byosan-runtime-smoke/
        if-no-files-found: error
