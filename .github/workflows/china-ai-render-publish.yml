name: Render and publish China AI feature

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write

jobs:
  render-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
      ENV_FILE: config/.env.byosan
      YOUTUBE_CHANNEL_PROFILE: byosan
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Patch encoder fallback and differentiated angle
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          script_path = Path('src/scripts/produce_byosan_feature.ts')
          text = script_path.read_text()
          marker = 'function renderVisualSegment(segment: TimedSegment): void {'
          if 'function videoEncoderArgs()' not in text:
              helper = r'''let cachedVideoEncoderArgs: string[] | null = null;

          function videoEncoderArgs(): string[] {
          	if (cachedVideoEncoderArgs) return cachedVideoEncoderArgs;
          	const nvencProbe = spawnSync(
          		"ffmpeg",
          		[
          			"-hide_banner",
          			"-loglevel",
          			"error",
          			"-f",
          			"lavfi",
          			"-i",
          			"color=c=black:s=64x64:d=0.05",
          			"-frames:v",
          			"1",
          			"-c:v",
          			"h264_nvenc",
          			"-f",
          			"null",
          			"-",
          		],
          		{ stdio: "ignore" },
          	);
          	if (nvencProbe.status === 0) {
          		cachedVideoEncoderArgs = [
          			"-c:v", "h264_nvenc", "-preset", "p5", "-rc", "vbr", "-cq", "15",
          			"-b:v", "16M", "-maxrate", "24M", "-bufsize", "32M",
          		];
          		console.log("[VIDEO_ENCODER] h264_nvenc");
          	} else {
          		cachedVideoEncoderArgs = [
          			"-c:v", "libx264", "-preset", "medium", "-crf", "16",
          			"-maxrate", "24M", "-bufsize", "32M",
          		];
          		console.log("[VIDEO_ENCODER] libx264 (NVENC unavailable)");
          	}
          	return cachedVideoEncoderArgs;
          }

          '''
              text = text.replace(marker, helper + marker, 1)

          old = '''\t\t\t"-c:v",\n\t\t\t"h264_nvenc",\n\t\t\t"-preset",\n\t\t\t"p5",\n\t\t\t"-rc",\n\t\t\t"vbr",\n\t\t\t"-cq",\n\t\t\t"15",\n\t\t\t"-b:v",\n\t\t\t"16M",\n\t\t\t"-maxrate",\n\t\t\t"24M",\n\t\t\t"-bufsize",\n\t\t\t"32M",'''
          if old in text:
              text = text.replace(old, '\t\t\t...videoEncoderArgs(),', 1)
          script_path.write_text(text)

          spec_path = Path('config/productions/china_ai_quant_20260816.json')
          spec = json.loads(spec_path.read_text())
          spec['angle'] = 'NVIDIAの最先端GPUに勝てるかではなく、安いTokenを大量かつ継続的に供給できるかを、算力・token/day・価格・国産accelerator出荷/配備・AI売上の一次公開値だけで検証する'
          spec['searchQuery'] = '中国AI NVIDIA Token 120兆 算力 国産AIチップ AI売上 2026 一次資料'
          spec['title'] = '中国AIはNVIDIAに勝つ必要がない――安いTokenを大量生産できる国は、もう負けているのか？'
          spec['thumbnailTitle'] = 'NVIDIA不要？\n120兆Token/日'
          spec['thumbnail'].update({
              'eyebrow': '中国AI 2026',
              'lead': 'NVIDIA',
              'accent': '不要？',
              'reaction': '!',
              'secondLine': '120兆Token/日',
              'calloutTop': '智能算力 2185 EFLOPS',
              'calloutBottom': 'Zhenwu 56万個超',
          })
          spec['descriptionLead'] = '中国AIはNVIDIAの最先端GPUに追いつかなければ失敗するのか。2026年8月16日時点の一次資料から、算力・Token使用量・価格・国産accelerator・実導入・AI売上を同じ軸で確認します。評価・スコア・将来予測は置きません。'
          monitor = '生データ: https://kafka2306.github.io/semiconductor-earnings-model/china-ai/'
          if monitor not in spec['descriptionBullets']:
              spec['descriptionBullets'].append(monitor)

          s = spec['segments']
          s[0]['chapter'] = '中国AIはNVIDIAに勝つ必要がない？'
          s[0]['section'] = 'THE QUESTION'
          s[0]['headline'] = 'NVIDIAに勝つ必要はない？'
          s[0]['subheadline'] = 'まず 120兆Token/日を見る'
          s[0]['text'] = '中国AIはNVIDIAの最先端GPUに勝たなければ失敗する。本当にそうでしょうか。今日は性能ランキングではなく、安いTokenを大量に供給できているかを公開数字だけで見ます。'
          s[1]['chapter'] = '成功条件を数量へ落とす'
          s[1]['section'] = 'THE OBSERVABLES'
          s[1]['headline'] = '56万個と88億元まで追う'
          s[1]['subheadline'] = 'chip出荷・実導入・AI売上'
          s[1]['text'] = '見るのはモデル順位ではありません。Tokenの使用量と価格、国内算力、国産chipの出荷と配備、そしてAI売上です。冒頭の公開値は120兆、2185、56万、88億元です。'
          s[2]['chapter'] = '論評ではなく観測する'
          s[2]['section'] = 'METHOD'
          s[2]['headline'] = '勝敗ではなく反証する'
          s[2]['subheadline'] = '同じ指標を次回も取り直す'
          s[2]['stats'] = [
              {'label':'観測軸','value':'6系統','detail':'算力→Token→価格→chip→導入→売上','color':'cyan'},
              {'label':'データ','value':'一次資料','detail':'推定で欠損を埋めない','color':'muted'},
          ]
          s[2]['source'] = 'China AI Quantitative Monitor'
          s[2]['text'] = '目的は今日の勝者を決めることではないのだ。同じ指標を次回も取り直して、この仮説を反証できる状態にするのだ。'
          s[-1]['chapter'] = '同じ数字をまた取りに行く'
          s[-1]['section'] = 'MONITOR'
          s[-1]['headline'] = '次回も同じ6軸を見る'
          s[-1]['subheadline'] = 'China AI Quantitative Monitor'
          s[-1]['stats'] = [
              {'label':'今回','value':'2026-08-16','detail':'一次資料snapshot','color':'cyan'},
              {'label':'次回','value':'同じ指標','detail':'増減だけを追記','color':'amber'},
          ]
          s[-1]['source'] = 'kafka2306.github.io/semiconductor-earnings-model/china-ai/'
          s[-1]['text'] = '結論を固定せず、同じ数字を取り直します。算力、Token、価格、国産chip、実導入、AI売上。この6軸を同じ公開ページへ積み上げます。'
          spec_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + '\n')
          PY
          bun x biome format --write src/scripts/produce_byosan_feature.ts "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/china-ai-render-publish.yml
          git add src/scripts/produce_byosan_feature.ts "$SPEC"
          git commit -m "fix(byosan): render China AI feature without CUDA"
          git push origin HEAD:feat/china-ai-quant-20260816
      - name: Validate
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Produce and audit video
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Publish to Byosan when credentials are configured
        id: publish
        shell: bash
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          if [[ -z "$YOUTUBE_CLIENT_ID" || -z "$YOUTUBE_CLIENT_SECRET" || -z "$YOUTUBE_REFRESH_TOKEN" ]]; then
            printf '%s\n' '{"status":"BLOCKED_MISSING_YOUTUBE_SECRETS","channel":"秒算マネー"}' > "runs/$RUN_ID/publish/automation_status.json"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          cat > "$ENV_FILE" <<EOF
          ENV_FILE=$ENV_FILE
          YOUTUBE_CHANNEL_PROFILE=byosan
          YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID
          YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET
          YOUTUBE_REFRESH_TOKEN=$YOUTUBE_REFRESH_TOKEN
          EOF
          bun src/scripts/publish_youtube.ts "$RUN_ID"
          bun src/scripts/public_visibility_audit.ts
          echo "published=true" >> "$GITHUB_OUTPUT"
          rm -f "$ENV_FILE"
      - name: Upload production artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-token-supply-20260816
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
