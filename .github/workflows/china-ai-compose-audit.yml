name: Compose and audit China AI feature

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write
  actions: read

jobs:
  compose-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Fix final encoder and truthful thumbnail
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          feature = Path('src/domain/byosan/feature_spec.ts')
          text = feature.read_text()
          text = text.replace('lead: z.string().min(1).max(5),', 'lead: z.string().min(1).max(8),')
          feature.write_text(text)

          producer = Path('src/scripts/produce_byosan_feature.ts')
          text = producer.read_text()
          old = '''\t\t\t"-c:v",\n\t\t\t"h264_nvenc",\n\t\t\t"-preset",\n\t\t\t"p6",\n\t\t\t"-rc",\n\t\t\t"cbr",\n\t\t\t"-b:v",\n\t\t\t"8M",\n\t\t\t"-maxrate",\n\t\t\t"8M",\n\t\t\t"-bufsize",\n\t\t\t"16M",'''
          if old not in text:
              raise SystemExit('composeFinal encoder block not found')
          text = text.replace(old, '\t\t\t...videoEncoderArgs(),', 1)
          text = text.replace('"-preset", "medium", "-crf", "16",', '"-preset", "fast", "-crf", "16",')
          text = text.replace('asset: "official 春日部つむぎ standing art with extended pointing arm",', 'asset: "speaker-specific standing art; neutral SVG fallback when local assets are absent",')
          producer.write_text(text)

          spec_path = Path('config/productions/china_ai_quant_20260816.json')
          spec = json.loads(spec_path.read_text())
          spec['thumbnail']['lead'] = 'NVIDIA'
          spec_path.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + '\n')
          PY
          bun x biome format --write src/domain/byosan/feature_spec.ts src/scripts/produce_byosan_feature.ts "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/china-ai-compose-audit.yml
          git add src/domain/byosan/feature_spec.ts src/scripts/produce_byosan_feature.ts "$SPEC"
          git commit -m "fix(byosan): make China AI production portable"
          git push origin HEAD:feat/china-ai-quant-20260816
      - name: Validate exact tree
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Reuse rendered segments
        uses: actions/download-artifact@v4
        with:
          name: china-ai-token-supply-20260816-final
          path: runs/byosan_money/2026-08-16-china-ai-quant
          github-token: ${{ github.token }}
          run-id: 31925238296
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Compose and run production audit
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Record YouTube blocker
        if: success()
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          printf '%s\n' '{"status":"BLOCKED_MISSING_YOUTUBE_SECRETS","channel":"秒算マネー"}' > "runs/$RUN_ID/publish/automation_status.json"
      - name: Upload audited production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-token-supply-20260816-audited
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
