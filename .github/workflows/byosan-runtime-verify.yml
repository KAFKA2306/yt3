name: Byosan Runtime Verification

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Byosan production date (YYYY-MM-DD)"
        required: true
        type: string
      period:
        description: "Digest period"
        required: true
        default: "week"
        type: choice
        options:
          - week
          - month
      analytics:
        description: "Refresh authorized YouTube Analytics"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  runtime-verify:
    if: github.repository == 'KAFKA2306/yt3' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, byosan]
    timeout-minutes: 120
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies from lockfile
        run: bun ci

      - name: Verify local Byosan runtime without publishing
        run: bun src/scripts/verify_byosan_runtime.ts
        env:
          BYOSAN_RUNTIME_MODE: full
          BYOSAN_DATE: ${{ inputs.date }}
          PERIOD: ${{ inputs.period }}
          WITH_ANALYTICS: ${{ inputs.analytics }}

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: byosan-runtime-evidence-${{ inputs.date }}
          path: runs/byosan_money/${{ inputs.date }}-runtime-verification/audit/
          if-no-files-found: error
