name: China AI feature production

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
      ENV_FILE: config/.env.byosan
      YOUTUBE_CHANNEL_PROFILE: byosan
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Canonical format
        run: |
          bun x biome format --write "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$SPEC"
          if ! git diff --cached --quiet; then
            git commit -m "style: format China AI production spec"
            git push origin HEAD:feat/china-ai-quant-20260816
          fi
      - name: Static validation
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Produce and audit video
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Publish when channel credentials exist
        id: publish
        shell: bash
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          if [[ -z "$YOUTUBE_CLIENT_ID" || -z "$YOUTUBE_CLIENT_SECRET" || -z "$YOUTUBE_REFRESH_TOKEN" ]]; then
            printf '{"status":"BLOCKED_MISSING_YOUTUBE_SECRETS"}\n' > "runs/$RUN_ID/publish/automation_status.json"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          umask 077
          cat > "$ENV_FILE" <<EOF
          ENV_FILE=$ENV_FILE
          YOUTUBE_CHANNEL_PROFILE=byosan
          YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID
          YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET
          YOUTUBE_REFRESH_TOKEN=$YOUTUBE_REFRESH_TOKEN
          EOF
          bun src/scripts/publish_youtube.ts "$RUN_ID"
          bun src/scripts/public_visibility_audit.ts
          printf '{"status":"PUBLISH_COMMAND_COMPLETED"}\n' > "runs/$RUN_ID/publish/automation_status.json"
          echo "published=true" >> "$GITHUB_OUTPUT"
          rm -f "$ENV_FILE"
      - name: Upload audited production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-quant-20260816
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
