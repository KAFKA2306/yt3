name: Finalize China AI scene pacing

on:
  push:
    branches: [feat/china-ai-quant-20260816]

permissions:
  contents: write

jobs:
  produce:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SPEC: config/productions/china_ai_quant_20260816.json
      RUN_ID: byosan_money/2026-08-16-china-ai-quant
      ENV_FILE: config/.env.byosan
      YOUTUBE_CHANNEL_PROFILE: byosan
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/china-ai-quant-20260816
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Tighten five remaining scenes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('config/productions/china_ai_quant_20260816.json')
          spec = json.loads(p.read_text())
          replacements = {
              1: '見るのはToken、価格、算力、国産chip、AI売上。公開値は120兆、2185、56万、88億元です。',
              5: 'V4-Flashは100万tokens当たり、cache miss入力0.14ドル、出力0.28ドルです。',
              10: 'Alibaba Cloud Intelligence Groupの四半期売上は416.26億元です。',
              15: 'Atlas 950は1024 cards。FP8 1 EFLOPS、FP4 2 EFLOPS、メモリ256TBです。',
              16: 'Baidu Q1 2026のAI Cloud Infraは88億元、前年比79%増。Core AI事業は136億元です。',
          }
          for index, value in replacements.items():
              spec['segments'][index]['text'] = value
          p.write_text(json.dumps(spec, ensure_ascii=False, indent=2) + '\n')

          producer = Path('src/scripts/produce_byosan_feature.ts')
          text = producer.read_text()
          text = text.replace('"medium",\n\t\t\t"-crf",', '"veryfast",\n\t\t\t"-profile:v",\n\t\t\t"high",\n\t\t\t"-crf",', 1)
          producer.write_text(text)
          PY
          bun x biome format --write src/scripts/produce_byosan_feature.ts "$SPEC"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/china-ai-final-quality.yml
          git add src/scripts/produce_byosan_feature.ts "$SPEC"
          git commit -m "fix(byosan): keep every China AI scene under 16 seconds"
          git push origin HEAD:feat/china-ai-quant-20260816
      - name: Validate exact tree
        run: |
          bun run typecheck
          bun run lint
          SKIP_LLM=true DRY_RUN=true bun test
      - name: Install media runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk curl
          docker run -d --name voicevox -p 50121:50021 voicevox/voicevox_engine:cpu-ubuntu20.04-latest
          for i in {1..60}; do curl -fsS http://127.0.0.1:50121/version && exit 0; sleep 2; done
          docker logs voicevox
          exit 1
      - name: Produce and audit video
        run: bun src/scripts/produce_byosan_feature.ts "$SPEC"
      - name: Publish when Byosan credentials exist
        shell: bash
        run: |
          mkdir -p "runs/$RUN_ID/publish"
          if [[ -z "$YOUTUBE_CLIENT_ID" || -z "$YOUTUBE_CLIENT_SECRET" || -z "$YOUTUBE_REFRESH_TOKEN" ]]; then
            printf '%s\n' '{"status":"BLOCKED_MISSING_YOUTUBE_SECRETS","channel":"秒算マネー"}' > "runs/$RUN_ID/publish/automation_status.json"
            exit 0
          fi
          umask 077
          cat > "$ENV_FILE" <<EOF
          ENV_FILE=$ENV_FILE
          YOUTUBE_CHANNEL_PROFILE=byosan
          YOUTUBE_CLIENT_ID=$YOUTUBE_CLIENT_ID
          YOUTUBE_CLIENT_SECRET=$YOUTUBE_CLIENT_SECRET
          YOUTUBE_REFRESH_TOKEN=$YOUTUBE_REFRESH_TOKEN
          EOF
          bun src/scripts/audit_publish_routing.ts
          bun src/scripts/publish_youtube.ts "$RUN_ID"
          bun src/scripts/public_visibility_audit.ts
          rm -f "$ENV_FILE"
      - name: Upload audited production
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: china-ai-token-supply-20260816-final-audited
          path: runs/byosan_money/2026-08-16-china-ai-quant
          if-no-files-found: error
          retention-days: 30
