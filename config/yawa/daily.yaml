run:
  bucket: yawa_archive
  name_prefix: yawa-
pool_file: config/yawa/script_pool.json
audience: 日本人男性
script:
  tool: codex
  model: gpt-6.1-terra
  sandbox: read-only
  min_segments: 64
  max_segments: 90
  max_segment_chars: 90
  max_attempts: 3
  variation_rules:
    - 各章で状況を一歩進める。場面固有の動作、物、音、発見、反応を入れ、意味のない慰め文で尺を埋めない。
    - 同じ一文や文型を繰り返さない。「ゆっくり息を吐いて」「ここで休んで」などの汎用句は各1回まで。
    - 選ばれた場所・小道具・時間・音のうち最低3つを、具体的な行動や出来事に結びつける。
    - 章ごとに会話の目的を変える。説明、質問、観察、軽い冗談、回想、決断、余韻を組み合わせる。
    - 一文の長さと語尾を散らす。全編を囁きや睡眠誘導の定型句に固定しない。
tts:
  # backend と device を明示する。自動の代替はしない（失敗は失敗として止める）。
  backend: irodori-v4.1-small
  device: cpu
  backends:
    irodori-v4.1-small:
      kind: irodori
      dir: /home/kafka/2511youtuber/v3/yt3/sandbox/Irodori-TTS-v4.1
      hf_checkpoint: Aratako/Irodori-TTS-v4.1-Small
      num_steps: 40
    irodori-v4-large:
      kind: irodori
      dir: /home/kafka/2511youtuber/v3/yt3/sandbox/Irodori-TTS-v4.1
      hf_checkpoint: Aratako/Irodori-TTS-v4-Large
      num_steps: 40
  hf_home: /home/kafka/.cache/hf-yawa
  min_free_vram_mib: 6000
arc:
  beats:
    導入:
      share: 0.14
      brief: 場面と関係を静かに示し、聞き手を迎える。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: 0
    打ち明け:
      share: 0.17
      brief: 語り手が聞き手に近づき、ひとつだけ本音や秘密を打ち明ける。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -1
    山場:
      share: 0.25
      brief: この台本でいちばん感情が動く場面。語りかけがいちばん具体的で、最も長い。
      style: 少し感情が高ぶり、声に抑揚がある。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 4.0
      gap_seconds: [0.3, 0.3]
      gain_db: 1
    静止:
      share: 0.1
      brief: 語り手が言葉を探して黙り、短い言葉と長い間で場面を止める。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -4
    回想:
      share: 0.16
      brief: 語り手が過去の出来事をひとつ思い出して、静かに語る。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -2
    ほどき:
      share: 0.18
      brief: 山場の緊張がほどけ、安心が広がる。
      style: 安堵して、ゆっくり落ち着いていく。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -2
    沈み:
      share: 0.165
      brief: 言葉数と音量を少しずつ減らす。毎回別の具体的な感覚や場面を一つずつ置き、沈黙を使って終幕へ進める。
      style: とてもゆっくり、一語ずつ区切って話す。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -5
    締め:
      share: 0.1
      brief: 短く、おやすみの言葉で終える。
      style: ほとんど囁きに近く、語尾を長くのばして静かに終わる。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -8
    相談:
      share: 0.13
      brief: 聞き手が望むケアや休息を確かめ、今夜の過ごし方を一緒に決める。
      style: 質問と返答の間を取り、聞き取りやすい自然な話し声で確認する。
      duration_scale: [0.95, 1.05]
      cfg_scale_caption: 3.0
      gap_seconds: [0.25, 0.55]
      gain_db: 0
    施術:
      share: 0.2
      brief: 道具や手順を一つずつ変え、音と触覚を具体的に想像できるよう描写する。
      style: 手順は明瞭に、道具ごとの違いが伝わるようテンポと間を変える。
      duration_scale: [0.95, 1.1]
      cfg_scale_caption: 3.2
      gap_seconds: [0.3, 0.7]
      gain_db: 0
    案内:
      share: 0.16
      brief: 一緒に移動し、左右や遠近の音、景色の変化を順番に案内する。
      style: 発見を促す明るい語り口で、短い方向案内をはっきり発音する。
      duration_scale: [0.95, 1.1]
      cfg_scale_caption: 3.2
      gap_seconds: [0.25, 0.6]
      gain_db: 0
    発見:
      share: 0.14
      brief: 小さな音、道具、記憶のつながりなど、その場にある意外な発見を見つける。
      style: 少し好奇心を含め、気づいた瞬間に抑揚をつける。
      duration_scale: [0.95, 1.05]
      cfg_scale_caption: 3.3
      gap_seconds: [0.25, 0.6]
      gain_db: 1
    余談:
      share: 0.12
      brief: 二人の関係が見える軽い冗談や小さな失敗談を交わす。
      style: 少しテンポを上げ、笑みや軽いからかいを自然に表す。
      duration_scale: [0.9, 1.05]
      cfg_scale_caption: 3.4
      gap_seconds: [0.2, 0.5]
      gain_db: 1
    手紙:
      share: 0.18
      brief: 届いた便りや短いメッセージを読み、送り手の気持ちと今の会話を結びつける。
      style: 読み上げと自分の言葉を声色と間で分ける。
      duration_scale: [1.0, 1.1]
      cfg_scale_caption: 3.1
      gap_seconds: [0.35, 0.8]
      gain_db: -1
    準備:
      share: 0.13
      brief: 場所や道具を整え、音が変わる手順を聞き手と一緒に確かめる。
      style: 作業の手順は簡潔に、音に耳を向ける箇所では間を長く取る。
      duration_scale: [0.95, 1.05]
      cfg_scale_caption: 3.0
      gap_seconds: [0.25, 0.65]
      gain_db: 0
  shapes:
    単峰: [導入, 打ち明け, 山場, ほどき, 沈み, 締め]
    二峰: [導入, 山場, 静止, 山場, 沈み, 締め]
    回想型: [導入, 回想, 打ち明け, 山場, 沈み, 締め]
    後半の山: [導入, 打ち明け, 回想, 山場, ほどき, 沈み, 締め]
    施術と休息型: [導入, 相談, 施術, 静止, ほどき, 沈み, 締め]
    静かな作業型: [導入, 準備, 施術, 発見, ほどき, 沈み, 締め]
    日常会話型: [導入, 余談, 打ち明け, 静止, ほどき, 沈み, 締め]
    散策・音探し型: [導入, 案内, 発見, 回想, ほどき, 沈み, 締め]
    短い物語型: [導入, 回想, 発見, 山場, ほどき, 沈み, 締め]
    便り・ラジオ型: [導入, 手紙, 余談, 静止, ほどき, 沈み, 締め]
  # Keyword families and weights are discovery priors from public product tags, not sales shares.
  # Each selected pattern is recorded in selection.json; shape choices are limited to compatible arcs.
situation_patterns:
  - id: whispered_ear_care
    weight: 5
    market_keywords: [ささやき, 耳かき, 睡眠導入]
    premise: 成人の施術者が成人の客の希望を聞き、素材や道具を変えながら耳のケアをする。
    shapes: [施術と休息型, 静かな作業型]
  - id: comfort_and_reassurance
    weight: 5
    market_keywords: [癒し, 慰め, 寄り添い・付き添い]
    premise: 成人の友人や同僚が、疲れの理由を少しずつ聞き、具体的な小さな助けを一緒に見つける。
    shapes: [日常会話型, 回想型, 単峰]
  - id: sleep_companion
    weight: 4
    market_keywords: [添い寝, 膝枕, 甘え・愛情]
    premise: 成人の恋人同士が一晩を過ごし、寝支度の会話や静かな環境音を共有して眠りにつく。
    shapes: [単峰, 回想型, 二峰]
  - id: ear_massage
    weight: 4
    market_keywords: [耳マッサージ, リラックス, 優しい声]
    premise: 成人の施術者が強さや順番を確認しながら耳まわりをケアし、聞き手の緊張をほどく。
    shapes: [施術と休息型, 静かな作業型]
  - id: massage_reset
    weight: 4
    market_keywords: [マッサージ, リラックス, 睡眠導入]
    premise: 成人のセラピストが肩や手を無理のない範囲でほぐし、仕事終わりの休息を手伝う。
    shapes: [施術と休息型, 静かな作業型]
  - id: hair_and_head_spa
    weight: 3
    market_keywords: [シャンプー, ヘッドマッサージ, 水音]
    premise: 成人の美容師が閉店後のヘッドスパで、湯音やタオル、髪を整える音を丁寧に聞かせる。
    shapes: [施術と休息型, 静かな作業型]
  - id: guided_sleep
    weight: 3
    market_keywords: [呼吸音, 子守唄, 寝かしつけ]
    premise: 成人の案内役が呼吸の数え方や短い歌を使い、聞き手が自分のペースで休めるよう導く。
    shapes: [単峰, 後半の山]
  - id: everyday_companionship
    weight: 3
    market_keywords: [日常, 親密, カジュアルな会話]
    premise: 成人の友人やパートナーと家で飲み物を用意し、日中の出来事を軽いやり取りで振り返る。
    shapes: [日常会話型, 回想型]
  - id: onsen_getaway
    weight: 2
    market_keywords: [温泉, 旅行, 添い寝]
    premise: 成人同士の小旅行で、宿への道中、湯上がり、就寝前の休息をひと続きに描く。
    shapes: [散策・音探し型, 後半の山]
  - id: nature_sound_walk
    weight: 2
    market_keywords: [自然音, 散策, 環境音]
    premise: 成人の案内人と夜明け前の散策をし、雨粒や風、足音などを聞き比べながら静けさを見つける。
    shapes: [散策・音探し型, 二峰]
  - id: late_night_radio
    weight: 2
    market_keywords: [ストーリーテリング, 手紙, 睡眠導入]
    premise: 成人の深夜ラジオパーソナリティが一通の便りを読み、短い雑談と余韻を一人の聞き手に届ける。
    shapes: [便り・ラジオ型, 回想型]
  - id: light_daily_comedy
    weight: 2
    market_keywords: [日常生活, からかい, コメディ]
    premise: 成人の友人や同僚が小さな失敗を笑いに変え、軽い冗談のあとに穏やかな休息へ移る。
    shapes: [日常会話型, 二峰]
  - id: reunion_memory
    weight: 2
    market_keywords: [懐かしさ, 友情, ロマンス]
    premise: 久しぶりに会った成人の友人や恋人が、昔の場所や音をきっかけに近況と記憶を交わす。
    shapes: [回想型, 後半の山]
  - id: quiet_fantasy_care
    weight: 1
    market_keywords: [ファンタジー, 癒し, 案内]
    premise: 成人の旅人が不思議な宿や庭を訪れ、案内人と静かな儀式や環境音を体験して休む。
    shapes: [散策・音探し型, 短い物語型]
  - id: gentle_sound_mystery
    weight: 1
    market_keywords: [小さな謎, 音探し, 物語]
    premise: 成人の二人が部屋に響く小さな音の正体を探し、見つけた品にまつわる穏やかな記憶を話す。
    shapes: [短い物語型, 散策・音探し型]
axes:
  place: [縁側, 夜の喫茶店, 耳ケア専門店, ヘッドスパ, 温泉宿, 夜行列車, 古書店, 小さなラジオ局, 温室, 港の待合室, 神社の参道, 海辺の遊歩道]
  prop: [竹の耳かき, 綿棒, やわらかいブラシ, タオル, 湯呑み, 古い時計, 手紙, 小さな鈴, 切符, 地図, ランプ, 木箱]
  time: [日付が変わる頃, 明け方前, 雨上がりの夜, 雪の降り始め, 閉店後, 夕暮れ, 雨の日の昼下がり]
  narrator_role: [耳ケアの施術者, ヘッドスパ担当, 夜ラジオの話し手, 成人の旅案内人, 旅館の女将, 同じ職場の先輩, 古い友人, 成人の恋人, 近所の店主, 図書館司書, 古道具の鑑定士, 夜間の博物館案内人, 修理工房の職人, 港の宿直係]
  narrator_personality: [好奇心旺盛, 乾いた冗談好き, 率直で面倒見がよい, 物静かで観察好き, 少し不器用, 几帳面, 茶目っ気がある, 落ち着いた専門家]
  story_goal: [閉店までに品物を修理する, 音の正体を突き止める, 届かなかった手紙を渡す, 旅の行き先を決める, 忘れ物を探す, 小さな展示を完成させる, 深夜放送の便りに答える, 古い約束を果たす, 道具の使い方を試す, 雨が止むまで過ごす]
  sound_world: [ささやき, 耳かきの音, マッサージ, 水音, 雨, 暖炉, 遠い列車, 波の音, 鈴の音, 紙をめくる音, 足音, 夜の虫の声]
  mood: [安らぎ, 懐かしさ, 静けさ, ぬくもり, 余韻, 好奇心, 軽い冗談, 再会の喜び, 仕事終わりの解放感, 穏やかな不思議]
  interaction: [ゆっくりした案内, 軽い掛け合い, 控えめな冗談, 聞き役と話し手, 手順の確認, 音を一緒に聞き比べる]
  emotional_turn: [緊張がほどける, 距離が少し縮まる, 小さな発見がある, 昔の記憶がつながる, 失敗を笑いに変える, 何気ない会話が安心に変わる]
diversity:
  recent_window: 10
# 声は動画ごとに変える。profile ごとに音域・共鳴・発声・抑揚を大きく離し、各動画内では一つの声像を保つ。
# reference 候補はASR類似度で可読性を選ぶ。音響値は記録だけに使い、ゲートにはしない。
voice:
  caption: "成人女性。中低音から中音域で、少しハスキーな乾いた響き。落ち着いた速さで、語尾は低く短く収める。"
  # caption はプロファイルが選ばれたrunで参照音声と全セグメントに使う。
  profiles:
    - id: high_bright
      axis: high_pitch
      caption: "成人女性。高い音域を中心に話し、F0中央値280〜300Hzを目安にする。明るく前方へ抜ける響き、軽快なテンポ、輪郭のはっきりした子音、短く落ちる語尾。"
    - id: nasal_clear
      axis: nasal_resonance
      caption: "成人女性。中高音域、F0中央値255〜275Hz。鼻にかかった前方共鳴を強く、明るく通る声。子音は明瞭、テンポは速め、句末の上げ下げを大きくつける。"
    - id: sweet_round
      axis: sweetness
      caption: "成人女性。低めの中音域、F0中央値205〜225Hz。丸く厚みのある温かな響き。母音を長めになめらかにつなぎ、息は少なく、語尾は柔らかく下げる。"
    - id: melodic_ending
      axis: intonation
      caption: "成人女性。中高音域、F0中央値245〜270Hz。音域を広く使い、句頭から句末まで旋律的に動く。語尾は上げる、下げる、伸ばすを文ごとに明確に変える。"
    - id: airy_soft
      axis: breathiness
      caption: "成人女性。中高音域、F0中央値230〜250Hz。息が混じる軽い声で、有声音と短い囁きを行き来する。子音の当たりは弱く、語尾に長い息の余韻を残す。"
    - id: expressive_dynamic
      axis: expressivity
      caption: "成人女性。F0中央値240〜270Hz。張りのある声で、音域・声量・話速を広く変化させる。語頭は明瞭、感情の反応は速く、重要な語を強く立てる。"
    - id: baseline_soft
      axis: control
      caption: "成人女性。低い中音域、F0中央値180〜205Hz。少しハスキーで乾いた胸寄りの響き。速度と音量は安定させ、抑揚は狭く、語尾を低く短く収める。"
    - id: low_smoky
      axis: low_register
      caption: "成人女性。低音域、F0中央値170〜195Hz。暗く落ち着いた胸寄りの共鳴と、かすかなざらつき。ゆっくり明瞭に話し、低い語尾を保つ。"
    - id: bell_high
      axis: bright_resonance
      caption: "成人女性。高音域、F0中央値285〜305Hz。澄んだ鈴のような明るい響きで、子音は軽く鋭く、母音は短め。話速は小気味よく、抑揚は明快。"
    - id: velvet_low
      axis: warm_resonance
      caption: "成人女性。中低音域、F0中央値195〜215Hz。息を抑えたベルベットのような密度と丸い母音。ゆったりした速度で音を滑らかにつなぐ。"
    - id: playful_crooked
      axis: playful_intonation
      caption: "成人女性。中高音域、F0中央値245〜270Hz。少し鼻にかかる明るい声で、話速は軽快。短い間、急な上昇、語尾の小さな跳ねを不規則に混ぜる。"
    - id: firm_storyteller
      axis: firm_delivery
      caption: "成人女性。中音域、F0中央値220〜245Hz。芯のある落ち着いた響きで、言葉を明瞭に区切る。低めの安定した語尾と、要点を伝える強い語頭を使う。"
reference:
  text: "こんばんは。今日は新しい店を見つけました。青い傘を閉じて、白い棚から薄い本と小さな鈴を選びます。これは少し不思議な形ですね。どれを先に試しましょうか。さあ、順番に確かめてみます。思ったより軽いです。駅まで歩きながら、続きを話しましょう。"
  candidates: 3
