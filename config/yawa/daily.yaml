voice:
  axes:
    register:
      - {id: upper_high, cue: "中高音から高音を中心にし、F0中央値270〜280Hzも探索の目安にするが、実際の響きを優先して固定しない", preference_weight: 4}
      - {id: upper_mid, cue: "明るい中高音を使い、台詞の感情に応じて自然に上下させる", preference_weight: 3}
      - {id: middle, cue: "中音を軸にしながら、抑揚で高音域へ抜ける", preference_weight: 1}
      - {id: low_contrast, cue: "低めの響きも比較用に試し、暗く平坦にならないよう表情を残す", preference_weight: 1}
    resonance:
      - {id: forward_nasal, cue: "鼻にかかる前方の明るい共鳴を感じさせる", preference_weight: 4}
      - {id: bright_open, cue: "明瞭で抜けのよい明るい響きにする", preference_weight: 3}
      - {id: rounded, cue: "丸くやわらかな響きにし、こもらせない", preference_weight: 2}
      - {id: mixed_resonance, cue: "前方の明るさと丸い響きを場面に応じて行き来する", preference_weight: 2}
    sweetness:
      - {id: sweet, cue: "甘さと幼さを感じる柔らかい音色にする。幼い役柄や年齢設定にはしない", preference_weight: 4}
      - {id: warm, cue: "温かく親しみのある音色にする", preference_weight: 2}
      - {id: playful, cue: "声にいたずらっぽい明るさを混ぜる", preference_weight: 2}
      - {id: neutral_contrast, cue: "甘さを控えた声も比較用に試し、他の軸との組み合わせを観察する", preference_weight: 1}
    phonation:
      - {id: soft_breath, cue: "柔らかい発声に自然な息を少量添える", preference_weight: 3}
      - {id: clear_voice, cue: "息を抑え、輪郭のある声にする", preference_weight: 2}
      - {id: airy_voice, cue: "息の混ざり方を増やし、声の明瞭さは保つ", preference_weight: 2}
      - {id: textured, cue: "わずかな声の質感を加える", preference_weight: 1}
    articulation:
      - {id: clear, cue: "子音を明瞭にし、音の輪郭を保つ", preference_weight: 3}
      - {id: blended, cue: "言葉を滑らかにつなぎ、聞き取りやすさを保つ", preference_weight: 2}
      - {id: crisp, cue: "子音を少し立て、反応の速さを出す", preference_weight: 2}
    prosody:
      - {id: expressive_endings, cue: "語尾を上げる、下げる、伸ばすなど、台詞ごとに表情豊かに変える", preference_weight: 4}
      - {id: melodic, cue: "音域の動きを豊かにし、旋律的な抑揚をつける", preference_weight: 3}
      - {id: quick_reaction, cue: "気づきや返答に素早い抑揚の変化をつける", preference_weight: 2}
      - {id: restrained_contrast, cue: "抑揚を控えめにした箇所も作り、変化を際立たせる", preference_weight: 1}
