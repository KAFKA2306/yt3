goal: 男性向けの日本語シチュエーションボイスを、一作ごとに固有の魅力で制作する。
audience: アニメ・オタク文化に親しみ、DLsite・BOOTHの音声作品を楽しむ聴き手。キャラクターと過ごす没入体験を大切にする。
voice_preference: 明るさ、甘さ、特徴的な共鳴、豊かな抑揚を好むが、声や演技の条件にはしない。
freedom: 人物、関係、状況、展開、構成、尺、話者、声、演技、音、画像は作品ごとにAIが設計する。登場人物は成人。
title_review: タイトル単独で内容・聴く価値・分かりにくさを批判し、指摘を本文と照合して改題する。専門用語、作業報告調、発見の見えにくさ、長すぎる説明に注意する。
