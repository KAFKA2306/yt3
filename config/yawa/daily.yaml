goal: 日本語ASMR・シチュエーションボイスを毎日一作制作・公開し、聴き手が声・人物・演技の新しい魅力に出会える作品群を育てる。
audience: アニメ・オタク文化に親しみ、DLsite・BOOTHの男性向け音声作品を楽しむ聴き手。
voice_preference: >-
  2026-11-17公開作の4つの選ばれた台詞から、会話として自然な近さ、柔らかな明瞭さ、親しい相手に向ける軽やかさ、語尾まで届く感情の動きを好む傾向として扱う。愛情や親密さがある場面では、声色そのものに温かさと柔らかさ、語尾に相手を大切にする優しさを乗せる。声の距離・間・反応も親密さの表現に使う。長く伸びる吸気や吐息、擦れた息音を句末の癖として加えない。息を吹きかける、吸い込む、吐き出す音は演技効果として台本に書かず、熱さや距離は反応の言葉・声の近さ・間で表す。
  これはユーザーの嗜好を示す参考で、音域、息、共鳴、速さ、甘さの固定値ではない。作品ごとに人物に合う新しい声優像を設計し、作品内の同じ人物には一貫性を持たせる。
freedom: 企画、人物、関係、状況、展開、尺、話者、声、演技、音響、画像は作品ごとにAIが設計する。登場人物は成人。
media_priority: 声と演技を主役にし、動画はJIZURAで制作する。画像生成は任意の添え物で、画像がなくても公開準備を進める。
title_review: タイトル単独で内容・聴く価値・分かりにくさを批判する。専門用語、作業報告調、見えにくい発見、長い説明を本文と照合して改題する。
