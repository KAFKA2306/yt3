run:
  bucket: yawa_archive
  name_prefix: yawa-
pool_file: config/yawa/script_pool.json
audience: 日本人男性
script:
  tool: codex
  model: gpt-6.1-terra
  sandbox: read-only
  max_segment_chars: 90
  max_attempts: 3
  variation_rules:
    - 今回の場面でしか起こらない行動、発見、判断、やり取りを中心に書く。
    - 状況の目的から台詞、間、声の演技、終わり方を組み立て、章名や終幕の型を使い回さない。
    - 安らぎや睡眠への誘導に自動で収束させず、場面に合う感情の動きと結末を選ぶ。
    - 既視感のある慰め文で尺を埋めず、具体的な出来事が完結したところで終える。
tts:
  # backend と device を明示する。自動の代替はしない（失敗は失敗として止める）。
  backend: irodori-v4.1-small
  device: cpu
  backends:
    irodori-v4.1-small:
      kind: irodori
      dir: /home/kafka/2511youtuber/v3/yt3/sandbox/Irodori-TTS-v4.1
      hf_checkpoint: Aratako/Irodori-TTS-v4.1-Small
      num_steps: 40
    irodori-v4-large:
      kind: irodori
      dir: /home/kafka/2511youtuber/v3/yt3/sandbox/Irodori-TTS-v4.1
      hf_checkpoint: Aratako/Irodori-TTS-v4-Large
      num_steps: 40
  hf_home: /home/kafka/.cache/hf-yawa
  min_free_vram_mib: 6000
nonverbal_experiment:
  enabled: true
  # One cue is chosen per run. The control/treatment pair shares text, reference,
  # caption, sampler settings, and seed; only the emoji token differs.
  cues:
    - id: sigh
      emoji: "😮‍💨"
      weight: 4
      chapters: [ほどき, 沈み, 締め]
      positions: [after_clause, suffix]
      repetitions: [1, 2]
    - id: chuckle
      emoji: "🤭"
      weight: 2
      chapters: [余談]
      positions: [after_clause, suffix]
      repetitions: [1, 2]
    - id: gasp
      emoji: "😮"
      weight: 1
      chapters: [発見, 山場]
      positions: [prefix, after_clause]
      repetitions: [1]
    - id: yawn
      emoji: "🥱"
      weight: 2
      chapters: [沈み, 締め]
      positions: [prefix, suffix]
      repetitions: [1, 2]
    - id: pause
      emoji: "⏸️"
      weight: 2
      chapters: [静止, 沈み]
      positions: [after_clause, suffix]
      repetitions: [1, 2]
    - id: humming
      emoji: "🎵"
      weight: 1
      chapters: [導入, 回想]
      positions: [prefix, suffix]
      repetitions: [1, 2]
arc:
  dynamic:
    duration_scale: [0.94, 1.10]
    cfg_scale_caption: [2.8, 3.6]
    gap_seconds: [0.18, 0.72]
    gain_db: [-2, 2]
  # The former beats/shapes below are legacy records; production uses dynamic ranges only.
  beats:
    導入:
      share: 0.14
      brief: 場面と関係を静かに示し、聞き手を迎える。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: 0
    打ち明け:
      share: 0.17
      brief: 語り手が聞き手に近づき、ひとつだけ本音や秘密を打ち明ける。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -1
    山場:
      share: 0.25
      brief: この台本でいちばん感情が動く場面。語りかけがいちばん具体的で、最も長い。
      style: 少し感情が高ぶり、声に抑揚がある。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 4.0
      gap_seconds: [0.3, 0.3]
      gain_db: 1
    静止:
      share: 0.1
      brief: 語り手が言葉を探して黙り、短い言葉と長い間で場面を止める。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -4
    回想:
      share: 0.16
      brief: 語り手が過去の出来事をひとつ思い出して、静かに語る。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -2
    ほどき:
      share: 0.18
      brief: 山場の緊張がほどけ、安心が広がる。
      style: 安堵して、ゆっくり落ち着いていく。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -2
    沈み:
      share: 0.165
      brief: 言葉数と音量を少しずつ減らす。毎回別の具体的な感覚や場面を一つずつ置き、沈黙を使って終幕へ進める。
      style: とてもゆっくり、一語ずつ区切って話す。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -5
    締め:
      share: 0.1
      brief: 短く、おやすみの言葉で終える。
      style: ほとんど囁きに近く、語尾を長くのばして静かに終わる。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -8
    相談:
      share: 0.13
      brief: 聞き手が望むケアや休息を確かめ、今夜の過ごし方を一緒に決める。
      style: 質問と返答の間を取り、聞き取りやすい自然な話し声で確認する。
      duration_scale: [0.95, 1.05]
      cfg_scale_caption: 3.0
      gap_seconds: [0.25, 0.55]
      gain_db: 0
    施術:
      share: 0.2
      brief: 道具や手順を一つずつ変え、音と触覚を具体的に想像できるよう描写する。
      style: 手順は明瞭に、道具ごとの違いが伝わるようテンポと間を変える。
      duration_scale: [0.95, 1.1]
      cfg_scale_caption: 3.2
      gap_seconds: [0.3, 0.7]
      gain_db: 0
    案内:
      share: 0.16
      brief: 一緒に移動し、左右や遠近の音、景色の変化を順番に案内する。
      style: 発見を促す明るい語り口で、短い方向案内をはっきり発音する。
      duration_scale: [0.95, 1.1]
      cfg_scale_caption: 3.2
      gap_seconds: [0.25, 0.6]
      gain_db: 0
    発見:
      share: 0.14
      brief: 小さな音、道具、記憶のつながりなど、その場にある意外な発見を見つける。
      style: 少し好奇心を含め、気づいた瞬間に抑揚をつける。
      duration_scale: [0.95, 1.05]
      cfg_scale_caption: 3.3
      gap_seconds: [0.25, 0.6]
      gain_db: 1
    余談:
      share: 0.12
      brief: 二人の関係が見える軽い冗談や小さな失敗談を交わす。
      style: 少しテンポを上げ、笑みや軽いからかいを自然に表す。
      duration_scale: [0.9, 1.05]
      cfg_scale_caption: 3.4
      gap_seconds: [0.2, 0.5]
      gain_db: 1
    手紙:
      share: 0.18
      brief: 届いた便りや短いメッセージを読み、送り手の気持ちと今の会話を結びつける。
      style: 読み上げと自分の言葉を声色と間で分ける。
      duration_scale: [1.0, 1.1]
      cfg_scale_caption: 3.1
      gap_seconds: [0.35, 0.8]
      gain_db: -1
    準備:
      share: 0.13
      brief: 場所や道具を整え、音が変わる手順を聞き手と一緒に確かめる。
      style: 作業の手順は簡潔に、音に耳を向ける箇所では間を長く取る。
      duration_scale: [0.95, 1.05]
      cfg_scale_caption: 3.0
      gap_seconds: [0.25, 0.65]
      gain_db: 0
# Historical patterns are retained only to interpret older selection records; production no longer picks them.
situation_patterns:
  - id: whispered_ear_care
    weight: 1
    market_keywords: [ささやき, 耳かき, 睡眠導入]
    premise: 成人の施術者が成人の客の希望を聞き、素材や道具を変えながら耳のケアをする。
    shapes: [施術と休息型, 静かな作業型]
    axis_options:
      place: [耳ケア専門店, 小さな施術室]
      prop: [竹の耳かき, 綿棒, やわらかいブラシ]
      time: [日付が変わる頃, 閉店後]
      narrator_role: [耳ケアの施術者]
      narrator_personality: [几帳面, 落ち着いた専門家, 率直で面倒見がよい]
      story_goal: [道具の使い方を試す, 施術の順番を決める]
      sound_world: [ささやき, 耳かきの音, 水音]
      mood: [安らぎ, 静けさ, ぬくもり]
      interaction: [手順の確認, 音を一緒に聞き比べる]
      emotional_turn: [緊張がほどける, 小さな発見がある]
