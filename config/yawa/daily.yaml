goal: 日本語ASMR・シチュエーションボイスを毎日一作制作・公開し、聴き手が声・人物・演技の新しい魅力に出会える作品群を育てる。
audience: アニメ・オタク文化に親しみ、DLsite・BOOTHの男性向け音声作品を楽しむ聴き手。
voice_preference: 明るさ、甘さ、特徴的な共鳴、豊かな抑揚を好む。固定条件にはしない。
freedom: 企画、人物、関係、状況、展開、尺、話者、声、演技、音響、画像は作品ごとにAIが設計する。登場人物は成人。
media_priority: 声と演技を主役にする。画像生成は任意の添え物で、通常の公開経路では省く。画像がなくても音声波形の動画で公開準備を進める。
title_review: タイトル単独で内容・聴く価値・分かりにくさを批判する。専門用語、作業報告調、見えにくい発見、長い説明を本文と照合して改題する。
