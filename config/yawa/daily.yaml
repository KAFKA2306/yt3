run:
  bucket: yawa_archive
  name_prefix: yawa-
pool_file: config/yawa/script_pool.json
audience: 日本人男性
script:
  tool: codex
  model: gpt-6.1-terra
  sandbox: read-only
  min_segments: 64
  max_segments: 90
  max_segment_chars: 90
  max_attempts: 3
tts:
  # Irodori-TTS は ComfyUI（ローカル API）経由で生成する。ComfyUI が起動していなければ preflight で止まる。
  backend: comfyui-irodori
  backends:
    comfyui-irodori:
      kind: comfyui
      base_url: http://127.0.0.1:8188
      input_dir: /home/kafka/projects/comfyui/ComfyUI/input
      output_dir: /home/kafka/projects/comfyui/ComfyUI/output
      ckpt_name: Irodori-TTS-v4.1-Small.safetensors
      codec_repo: Aratako/Semantic-DACVAE-Japanese-32dim
      dtype: bf16
      num_steps: 40
  hf_home: /home/kafka/.cache/hf-yawa
  seed: 4242
  min_free_vram_mib: 6000
arc:
  beats:
    導入:
      share: 0.14
      brief: 場面と関係を静かに示し、聞き手を迎える。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: 0
    打ち明け:
      share: 0.17
      brief: 語り手が聞き手に近づき、ひとつだけ本音や秘密を打ち明ける。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -1
    山場:
      share: 0.25
      brief: この台本でいちばん感情が動く場面。語りかけがいちばん具体的で、最も長い。
      style: 少し感情が高ぶり、声に抑揚がある。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 4.0
      gap_seconds: [0.3, 0.3]
      gain_db: 1
    静止:
      share: 0.1
      brief: 語り手が言葉を探して黙り、短い言葉と長い間で場面を止める。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -4
    回想:
      share: 0.16
      brief: 語り手が過去の出来事をひとつ思い出して、静かに語る。
      style: ""
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -2
    ほどき:
      share: 0.18
      brief: 山場の緊張がほどけ、安心が広がる。
      style: 安堵して、ゆっくり落ち着いていく。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -2
    沈み:
      share: 0.165
      brief: 言葉数を減らし、同じ言い回しを静かに繰り返して眠りへ沈める。
      style: とてもゆっくり、一語ずつ区切って話す。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -5
    締め:
      share: 0.1
      brief: 短く、おやすみの言葉で終える。
      style: ほとんど囁きに近く、語尾を長くのばして静かに終わる。
      duration_scale: [1.0, 1.0]
      cfg_scale_caption: 3.0
      gap_seconds: [0.3, 0.3]
      gain_db: -8
  shapes:
    単峰: [導入, 打ち明け, 山場, ほどき, 沈み, 締め]
    二峰: [導入, 山場, 静止, 山場, 沈み, 締め]
    回想型: [導入, 回想, 打ち明け, 山場, 沈み, 締め]
    後半の山: [導入, 打ち明け, 回想, 山場, ほどき, 沈み, 締め]
axes:
  place: [縁側, 終電後の待合室, 山小屋, 古書店, 港の宿, 温室, 灯台の見張り室, 薬草園]
  prop: [湯たんぽ, 古い時計, 毛布, ランプ, 手紙, 湯呑み, 懐中電灯]
  time: [日付が変わる頃, 明け方前, 雨上がりの夜, 雪の降り始め]
  narrator_role: [同じ職場の先輩, 宿の女将, 司書, 看護師, 古い友人, 薬草師]
  sound_world: [雨, 暖炉, 遠い列車, 静寂, 波の音]
  mood: [安らぎ, 懐かしさ, 静けさ, ぬくもり, 余韻]
diversity:
  recent_window: 10
# 動画内の声を固定するための参照音声。候補を参照なしで作り、聞き取れて割れていないものを使う。
# 魅力の判定は行わない。動画間で同じ声にはしない（動画ごとに候補から選ぶ）。
# チャンネル全体で 1 つの声。動画ごとに変えない（人気チャンネルの「声の主を固定する」型に合わせる）。
# 年上の成人の女性。明るく柔らかい声。距離は近く、息は控えめ。
voice:
  caption: "年上の成人の女性の声。明るく柔らかい声で、耳元に近い距離から優しく語りかける。語尾は柔らかく、息は控えめ。幼さや学生らしさは出さない。"
reference:
  text: "おかえりなさい。今日も一日、よく頑張りましたね。ここからは、何も考えずに、ゆっくり力を抜いてくださいね。今夜は、雨の音を聞きながら、私がそばにいます。まぶたが重くなったら、そのまま目を閉じていいですよ。息を深く吸って、ゆっくり吐いてみましょう。急がなくて大丈夫です。あなたが眠るまで、ここで静かに見守っていますね。"
  seeds: [101, 202, 303]
mix:
  room_tone_db: -42
  target_lufs: -23
  loudness_range: 15
asr:
  model: small
cover:
  tool: codex-imagegen
  file: cover.png
  size: 1536x1024
video:
  file: video.mp4
  width: 1920
  height: 1080
  fps: 24
  crf: 28
  audio_bitrate: 192k
thumbnail:
  file: thumbnail.jpg
  width: 1280
  height: 720
  quality: 3
audit:
  tail_seconds: 1
  duration_tolerance_seconds: 1.5
safety:
  banned_terms: [未成年, 小学, 中学, 高校, 女子高生, JK, ロリ, 少女, 幼, 児童, 生徒, 制服, 性的, 性行為, 裸, エロ, 喘ぎ, 愛撫]
metadata:
  # 検索されやすい語をタイトルの前半に置く（SEO の on-page 手順）。台本の題名は後ろに残す。
  title_forms:
    - "【シチュボ／{narrator_role}】"
    - "【シチュボ／{mood}】"
    - "【シチュボ／{place}】"
    - "【添い寝／{sound_world}】"
  title_suffix: " | 夜話アーカイブ ASMR"
  tags_core: [シチュエーションボイス, シチュボ, ASMR, 睡眠導入, 癒し, 囁き, 年上, AI音声]
  tags_from_axes: [place, sound_world, mood]
  tags_max: 15
  description_lead: 年上の成人の女性が、耳元で優しく語りかける、癒しと安眠のシチュエーションボイスです。
  ai_disclosure: この作品の台本、音声、画像はAIで生成しています。
  rights_declaration: 台本は今回新たに生成した日本語の原作で、第三者の台本・音声・画像は転載していません。
