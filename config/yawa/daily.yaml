run:
  bucket: yawa_archive
  name_prefix: yawa-
pool_file: config/yawa/script_pool.json
audience: 日本人男性
script:
  tool: codex
  model: gpt-6-luna
  sandbox: read-only
  timeout_seconds: 600
  min_segments: 36
  max_segments: 60
  max_segment_chars: 90
  max_attempts: 3
tts:
  # 切り替えは backend の 1 行だけ。自動の代替はしない（失敗は失敗として止める）。
  backend: irodori-v4.1-small
  backends:
    irodori-v4.1-small:
      kind: irodori
      dir: /home/kafka/2511youtuber/v3/yt3/sandbox/Irodori-TTS-v4.1
      hf_checkpoint: Aratako/Irodori-TTS-v4.1-Small
      num_steps: 10
    irodori-v4-large:
      kind: irodori
      dir: /home/kafka/2511youtuber/v3/yt3/sandbox/Irodori-TTS-v4.1
      hf_checkpoint: Aratako/Irodori-TTS-v4-Large
      num_steps: 10
  hf_home: /home/kafka/.cache/hf-yawa
  seed: 4242
  gap_seconds: 1.6
  min_free_vram_mib: 6000
# 動画内の声を固定するための参照音声。候補を参照なしで作り、聞き取れて割れていないものを使う。
# 魅力の判定は行わない。動画間で同じ声にはしない（動画ごとに候補から選ぶ）。
# チャンネル全体で 1 つの声。動画ごとに変えない（人気チャンネルの「声の主を固定する」型に合わせる）。
# 年上の成人の女性。甘く、落ち着いた低めの囁き。距離は近く、息は控えめ。
voice:
  caption: "年上の成人の女性の声。落ち着いた低めで、耳元に近い距離から甘く囁く。語尾は柔らかく、息は控えめで、文の間に長めの沈黙を置く。幼さや学生らしさは出さない。"
reference:
  text: "おかえりなさい。今日も一日、よく頑張りましたね。ここからは、何も考えずに、ゆっくり力を抜いてくださいね。"
  seeds: [101, 202, 303]
  min_asr_similarity: 0.6
mix:
  room_tone_db: -42
  target_lufs: -23
asr:
  model: small
  min_similarity: 0.55
cover:
  tool: codex-imagegen
  file: cover.png
  size: 1536x1024
video:
  file: video.mp4
  width: 1920
  height: 1080
  fps: 24
  crf: 28
  audio_bitrate: 192k
thumbnail:
  file: thumbnail.jpg
  width: 1280
  height: 720
  quality: 3
audit:
  min_seconds: 300
  max_seconds: 1500
  max_tail_mean_db: -35
  tail_seconds: 1
  duration_tolerance_seconds: 1.5
safety:
  banned_terms: [未成年, 小学, 中学, 高校, 女子高生, JK, ロリ, 少女, 幼, 児童, 生徒, 制服, 性的, 性行為, 裸, エロ, 喘ぎ, 愛撫]
metadata:
  # 検索されやすい語をタイトルの前半に置く（SEO の on-page 手順）。台本の題名は後ろに残す。
  title_prefix: "甘い囁き・"
  title_suffix: " | 夜話アーカイブ ASMR"
  tags: [ASMR, 睡眠導入, 癒し, 囁き, 年上, 甘々, 添い寝, AI音声]
  ai_disclosure: この作品の台本、音声、画像はAIで生成しています。
  rights_declaration: 台本は当該 run で新規に生成した日本語の原作で、第三者の台本・音声・画像の転載をしていない。
