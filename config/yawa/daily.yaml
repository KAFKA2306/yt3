goal: 固定キャスト3名（docs/yawa/characters.json）の声・ビジュアル・関係性を積み上げ、推しと登録が育つ全年齢向けシチュエーションボイスを週4本ペースで届ける。
audience: アニメ・声優・DLsite/BOOTH文化に親しみ、仕事終わりや休日に好きなキャラクターとの会話劇・癒やしを楽しみたい聴き手。
cast_policy: >-
  docs/yawa/characters.json の看板キャスト（haruka / shizuku / nao）から毎回主役を1名選ぶ（必要なら2名掛け合いも可）。直近のエピソードと連続しないキャスト・ジャンルを優先する。
  選んだキャストの id を voices[].id と character_id に設定し、専用参照音声（data/state/yawa/references/<id>.wav）による声の一貫性を保つ。場面ごとの感情は acting で自然に動かす。
genre_rotation: >-
  「終電を逃した夜」「深夜に弱音をこぼして寝かしつける」パターンの反復を避ける。
  日常コメディ・軽快な掛け合い・共同作業・休日や仕事帰りの寄り道・古本喫茶の穏やかな夜話・温かな労いをバランスよく回す。目標尺は8〜15分程度。
advertiser_friendly: >-
  YouTubeの広告適合性（緑アイコン）を最優先で守る。登場人物は成人。性的興奮を目的とするロールプレイ、過度な密着・喘ぎ・耳元への息吹きかけ演出、18+系スラングや誤認を招くメタデータ（添い寝・耳舐め等）をタイトル・台本・説明文・タグに一切入れない。
voice_preference: >-
  会話として自然な近さ、柔らかな明瞭さ、親しい相手に向ける軽やかさ、語尾まで届く感情の動きを基準とする。親密さや優しさは声色の温度・間・反応の言葉で表し、長く伸びる吸気・吐息や擦れた息音を句末の癖として加えない。
media_priority: >-
  声と演技を主役にし、動画はJIZURA字幕で制作する。同時に、codex-imagegen が利用可能な場合は選んだキャストの visual_identity を生かした一貫性のあるアニメ調サムネイル画像を標準生成する。
title_review: >-
  タイトルだけで「誰との・どんな楽しい／心地よい時間か」がすぐ伝わるようにする。長すぎるあらすじ説明、作業報告調、性的連想ワード、直近作の言い回し反復を避ける。
