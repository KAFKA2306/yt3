        - 「〜が実証されている」「〜と科学的に言われている」「〜というデータが示している」といった検証可能なフリをした表現を厳禁します。
        - 科学的・進化的知見に触れる際も、「〜という脳の仕様があるのかもしれません」「〜という健気な仕組みなのかもしれません」のように、解釈や可能性であることを明確に留めて語り、断定しないでください。

