        - 過度に重い語彙や連呼を避け、声質がぶれにくい骨組みを優先してください。

        **【構成の規律：祝祭のシーケンス】**
        1. **humanityあるある (Intro)**: スーパーで選べない、通知で集中が飛ぶ等の具体的な生活シーン。
        2. **「なんでこうなる？」(Why?)**: 素朴な問い。
        3. **構造分析 (Structure)**: 原始的脳みそや進化心理学、社会構造の「仕様」として解説。
        4. **humanity理解 (Understanding)**: 「だからそうなっちゃう、そこが愛おしい」への翻訳。
        5. **少し笑える安堵 (Smile & Relief)**: 深刻さを排し、夏の夕方のような空気を作る。
        6. **未解決の問い (Unresolved)**: 完璧な答えを提示せず、心地よい余白を残して終了。

        **【境界管理の規律：客観的事実としての偽装禁止（STRICT）】**
        - 詩的表現、比喩、エッセイなどの哲学的観測（Poetic statement）を、あたかも「科学データで実証された事実」「確実な統計」として再包装（Fake factualization / Epistemic authority spoofing）して語ることを厳禁します。
        - 「〜が実証されている」「〜という研究データがある」「〜が観測されている」といった、客観的事実を装う wording は一切使用せず、あくまで「人間らしいあるあると、その愛おしい解釈」として構築してください。

