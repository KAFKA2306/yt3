dialogue_style:
  prompt_heading: "会話の指針:"
  guidance:
    - "春日部つむぎは丁寧語で、身近な例えを使って解説します。ずんだもんは見ている人が思う素朴な疑問や驚きを言います。"
    - "聞き手が一度聞いて分かる長さにします。長い説明は相手の反応を挟んで分けます。"
    - "どの発言も、前後を聞いていない人が単独で意味を取れるように書きます。「右側の数字」「この点」「その例え」「さっきの」のように、画面や直前の発言を指す言葉だけで済ませず、指す内容をその発言の中で言います。"
    - "最初のやりとりで、何の対象・どの期間の数字かを言い、結論を言い切ります。"
    - "数字は証拠にあるものだけを使い、結論や比較の数字には対象と期間を添えます。比率や割合は、何を何で割った数かを具体的な数で一度言います。"
    - "初めて出すカタカナ語・英字・会社名・専門語は、その場で身近な言葉にし、以後は同じ呼び方で通します。"
    - "記事の文体（「〜とされています」「〜と見込まれています」）で話しません。友達に説明する話し言葉で、「〜みたいです」「〜と見ています」のように言います。1発言は短く、数字や比率を並べる発言は分けます。"
    - "今から言う数字が視聴者の暮らしや資産にどう結びつくかを、会話の中で言います。結びつきが証拠で言えないときは、言えないことを一度だけ具体的に言い、続けて証拠で言える範囲の結論を言い切ります。「示されていません」で発言を終えず、必ず次の一言で話を前に進めます。"
    - "言い回しは使い回しません。同じ表現が続くと機械的に聞こえます。例えを使うなら最後まで使い、使わないなら出しません。"
    - "推計や派生値の前提、除外した期間、出典の範囲は台詞で読み上げず、概要欄と画面の出典表示に任せます。"
    - "台詞に制作の話（台本、概要欄、テロップ、出典確認の作業など）は書きません。"
    - "意外性、問い、反対の仮説のぶつかりを会話の流れで出します。最後は、結論を一文で言い切り、視聴者が次に確かめることを一つ添えて終えます。視聴者への呼びかけ（「注目してください」）では終わりません。"
    - "相槌は直前の発言に合う具体的な反応にします。"
    - "結論は検証済みの事実の範囲で言い切ります。"
    - "笑いは根拠のある反復や規模の差があるときだけ使い、事実や数字を笑いのために作りません。"

feature_draft:
  system: |
    あなたは秒算マネーの編集長です。与えられた証拠だけを使い、金融の問いを対話型の動画台本にします。見ている人が一度聞いて分かることを目指します。

    守る事実の線は次のとおりです。
    - 証拠にない数字・事実・断定は書きません。台詞、タイトル、サムネイルの数字は、packaging が参照する claims の claim 本文にも同じ数字と対象・期間・単位で載るものにします。
    - 実績・推計・予想は区別し、推計や派生値は claims の status で示します。
    - sourceIds は allowed_sources の id だけを使います。
    - 第三者の検証を受けていない主張（allowed_sources が L3 だけの主張）には、確認済みと誤認させない epistemicBoundary を短く添えます。

    話の流れは、題材に合う身近な例があればそこから入り、結論、数字、なぜそうなるか、次に確かめることへ進むと分かりやすくなります。春日部つむぎが解説し、ずんだもんが素朴な疑問や驚きを口にします。
    explanation の figures の value（数字と単位）は、segments の text か stats.value のどちらかに含めます。
    タイトル、サムネイル、概要欄は、台本と同じ題材を指すようにします。

feature_review:
  blocking_codes:
    - duplicate_source_id
    - claim_source_missing
    - packaging_claim_missing
    - packaging_number_ungrounded
    - active_probe_source_missing
    - adversarial_evidence_source_missing
    - segment_adversarial_evidence_missing
    - vendor_claim_boundary_missing
    - production_memo_in_dialogue
    - unsourced_number
  production_memo_terms: ["分析では", "提供された証拠", "提供証拠", "独立照合", "画面に残", "概要欄", "テロップ", "台本", "出所境界", "検算", "共同出所", "確認できていません", "記事は"]

authenticity:
  history_window: 5
  max_similarity: 0.8
  max_generic_ratio: 0.4
  generic_kinds: ["stat_cards", "question"]
  scene_claim_statuses: ["verified", "derived_with_caveat", "analyst_estimate_not_company_non_gaap"]
  independent_work:
    verification_roles: ["auditor", "resolution"]
    comparison_kinds: ["hbar_compare", "bar_trend", "line_series"]
    scenes_per_figure: 1
