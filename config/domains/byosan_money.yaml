global_style:
  font_path: "assets/fonts/IBMPlexSansJP-Regular.otf"
  font_name: "IBM Plex Sans JP"
  thumbnail:
    title_size: 110
    subtitle_size: 48
  video:
    subtitle_size: 64

workflow:
  default_run_dir: "runs"
  default_bucket: "byosan_money"
  checkpoint_enabled: true
  paths:
    lock_file: "logs/cron.lock"
    runs_dir: "runs"
    memory_dir: "data/memory"
    state_dir: "data/state"
  filenames:
    output: "output.yaml"
    state: "state.json"
    audio_dir: "audio"
    video_dir: "video"
    audio_full: "full.wav"
    subtitles: "subtitles.ass"
    thumbnail: "thumbnail.png"
    video: "video.mp4"

steps:
  research:
    regions:
      - { lang: "English (US/UK)", code: "en" }
      - { lang: "Chinese (China/Taiwan)", code: "zh" }
      - { lang: "Russian (Russia/CIS)", code: "ru" }
      - { lang: "German (Germany/EU)", code: "de" }
    temperature: 0.5
    default_limit: 3

  script:
    context_overlap_lines: 3
    default_tags: ["Finance", "Economy"]
    speakers:
      analyst:
        name: "春日部つむぎ"
        aliases: ["春日部つむぎ", "かすかべ つむぎ", "つむぎ"]
      reporter:
        name: "ずんだもん"
        aliases: ["ずんだもん"]
      narrator:
        name: "玄野武宏"
        aliases: ["玄野武宏", "ナレーション", "ナレーター"]

  audio:
    sample_rate: 24000
    format: "wav"

  subtitle:
    width_per_char_pixels: 70

  video:
    resolution: "1920x1080"
    fps: 30
    background_color: "#103766"
    intro_seconds: 5
    codec: "h264_nvenc"
    effects:
      - {type: "overlay", enabled: true, image_path: "assets/春日部つむぎ立ち絵公式_v2.0/春日部つむぎ立ち絵公式_v1.1.1.png", anchor: "bottom_right", height_ratio: 0.85, offset: {right: 20, bottom: 0}}
      - {type: "overlay", enabled: true, image_path: "assets/zundamon.webp", anchor: "bottom_left", height_ratio: 0.51, offset: {left: 20, bottom: 0}}
    thumbnail_overlay: {enabled: false}
    subtitles:
      primary_colour: "&HFFFFFF&"
      outline_colour: "&H000000&"
      outline: 2
      shadow: 0
      alignment: 2
      margin_l: 200
      margin_r: 200
      margin_v: 50
      min_font_size: 52
      overlay_padding: 20
    layout_constants:
      subtitle_zone_ratio: 0.15
      subtitle_height: 300
      default_max_w_ratio: 0.5

  thumbnail:
    enabled: true
    width: 1280
    height: 720
    padding: 80
    max_lines: 3
    max_chars_per_line: 11
    right_guard_band_px: 850
    show_subtitle: true
    iqa_thresholds:
      sharpness_min: 100
      contrast_goal: 7.0
      contrast_min: 5.0
      mobile_edge_min: 25
      humanity_min: 0.6
      corner_size: 40
    palettes:
      - {background_color: "#103766", title_color: "#FFFFFF", outline_inner_color: "#288CFA", outline_inner_width: 15, outline_outer_color: "#000000", outline_outer_width: 20, subtitle_color: "#288CFA"}
    overlays:
      - {name: "character", enabled: true, image_path: "assets/春日部つむぎ立ち絵公式_v2.0/春日部つむぎ立ち絵公式_v1.1.1.png", anchor: "bottom_right", height_ratio: 0.95, offset: {right: 0, bottom: 0}}
  youtube:
    enabled: true
    max_title_length: 100
    max_description_length: 5000
    max_tags_total_length: 500
    default_tags: ["AI", "VTuber", "Finance", "Economy"]
    category_id: 24
    default_visibility: "public"
    discord_notifications: {publish_start: true, publish_complete: true}

providers:
  llm:
    provider: "gemini"
    gemini: {model: "gemini-3.6-flash", primary_llm: "gemini-3.6-flash", temperature: 0.35, max_tokens: 32768}
    content: {temperature: 0.4}
    media: {temperature: 0.1}
    research: {temperature: 0.5}
  tts:
    voicevox:
      enabled: true
      url: "http://localhost:50121"
      speakers: {春日部つむぎ: 8, ずんだもん: 1, 玄野: 11, 玄野武宏: 11}
      timeout_ms: {query: 30000, synthesis: 60000}
      health_timeout_ms: 5000

  manager:
    check_interval_ms: 300000
    stale_lock_timeout_seconds: 3600
    start_hour: 7
    user: "kafka"

daily_publish:
  timezone: "Asia/Tokyo"
  resume_date: "2026-10-13"
  publish_approved: true

failure_classification:
  rate_limit_terms: ['\b429\b', 'rate limit', 'usage limit', 'try again at', 'exceeded your current quota', 'quota exhausted', 'resource exhausted']
  auth_terms: ['oauth', 'credential', 'unauthori[sz]ed', 'forbidden', '\b40[13]\b', 'invalid_grant', 'login required', 'not logged in', 'network', 'ECONN', 'ENOTFOUND']
  mcp_noise_terms: ['rmcp::', 'oauth-protected-resource', 'AuthRequired']

dashboard:
  port: 3000

logging:
  level: "INFO"
  format: "json"
  activity_log_file: "logs/agent_activity.jsonl"

news_bot:
  token_env: "DISCORD_TOKEN"
  command_name: "news"
  command_description: "Generate news video"
  starter_template: "Starting generation for: {query}"
  response_template: "Generating video for: {query}"
  thread_prefix: "video-"
  thread_message: "Progress will be posted here."

automation:
  enabled: true
  venv_activate: ".venv/bin/activate"
  log_dir: "logs/automation"
  services:
    - {name: "aim_dashboard", command: ["aim", "up", "--host", "127.0.0.1", "--port", "43800"]}
    - {name: "voicevox", command: ["bash", "scripts/voicevox_manager.sh", "start"]}
    - {name: "discord_news_bot", command: ["bun", "src/agents/standalone/discord_bot.ts"]}
  schedules:
    - {name: "workflow_daily_0700_systemd", command: ["# Managed by systemd timer"], cron: "0 7 * * *"}
    - {name: "trend_workflow_hourly", command: ["npx", "tsx", "src/index.ts"], args: ["--trend-mode"], cron: "0 * * * *"}

mcp:
  servers:
    context7:
      command: "npx"
      args: ["-y", "@upstash/context7-mcp"]
    figma:
      command: "npx"
      args: ["-y", "@figma/mcp-server-figma"]
    pptx:
      command: "npx"
      args: ["-y", "mcp-server-pptx"]
    arxiv:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-arxiv"]

design_tokens:
  primary_brand_color: "#103766"
  accent_brand_color: "#288CFA"
  contrast_text_color: "#0A0A12"
  humanity_base_white: "#FFFDF8"
  humanity_soft_sky: "#BFE7FF"
  humanity_human_cream: "#FFF1D6"
  humanity_evening_orange: "#FFB86B"
  humanity_gentle_blue: "#7DC8F7"
  humanity_soft_gray: "#E9E6DF"
  humanity_text_charcoal: "#333333"
  humanity_accent_pink: "#FF9FB2"
  alert_color: "#C62828"
  success_color: "#00A3AF"
  font_display: "IBM Plex Sans JP"
  font_text: "IBM Plex Sans JP"
  font_japanese: "IBM Plex Sans JP"

discovery:
  recent_days: 7
  repeat_window_days: 60
  max_items_per_feed: 5
  body_chars: 6000
  min_paragraph_chars: 80
  concurrency: 4
  title_rule: "題名は、視聴者が思わず答えを知りたくなる、強くて短い1つの問いにして、末尾に「 | 秒算マネー」を付ける（例: 「ガソリン補助金が減ると、毎月いくら損する？ | 秒算マネー」）。主語は暮らしの物や金額にし、専門語は使わず、検索される語を問いの中に入れる。答えは本文で言い切り、数字は本文で検証済みのものだけを使う。サムネイルの文字も同じ問いの短縮にし、中身と一致させ、誤認を誘う表現は避ける。日付や期が本質の題材では対象期間を問いに入れる。"
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  registry: "config/sources/byosan_discovery_sources.json"
  owner_articles: "data/state/byosan_owner_articles.json"
  baseline:
    path: "data/state/byosan_discovery_baseline.json"
    sources:
      - id: "S001"
        days: 30
        max_items: null
        fetch:
          type: "html_items"
          url: "https://insight.factset.com/topic/earnings"
          page_url: "https://insight.factset.com/topic/earnings/page/{n}"
          pages: 10
          item: '<div class="fs--blog--item">\s*<a class="fs--blog--item--upper" href="(?<url>[^"]+)"[\s\S]*?<h6[^>]*>\s*(?<date>[^<]+?)\s*</h6>'
          link: '^https://insight\.factset\.com/[^/]+$'
          body: "paragraphs"
      - id: "S002"
        days: 30
        max_items: null
        fetch:
          type: "sitemap"
          url: "https://insight.factset.com/sitemap.xml"
          include: '^https://insight\.factset\.com/[^/]+$'
          body: "paragraphs"

llm:
  sandbox: "read-only"
  workdir_prefix: "byosan-llm-"
  max_attempts: 5
  codex: {model: "gpt-6.1-terra", reasoning_effort: "medium"}
  claude: {command: "claude", model: "claude-haiku-5-5", stage_models: {byosan_feature_draft: "claude-sonnet-5-5"}, workdir_prefix: "byosan-claude-", strip_env: ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"]}
  fallback_backend: "claude"
  backends:
    feature: "codex"
    digest: "claude"
    panel: "claude"
  panel:
    candidates: 3
    candidate_instruction: "[題材の指定] 記事一覧から、視聴者の財布や資産に直接触れる有力な題材を、{index}番目に有力なものとして選びます（1番目と別の題材にします）。"
    review_system: "あなたは次の5人の視聴者です。それぞれの人物になりきって、下の台本を最後まで読み、面白さを1〜5の整数で採点し、最も直してほしい点を1つだけ書いてください。reviews には5人全員を persona（人物名）、score、fix の順で入れます。"
    personas:
      - { name: "34歳会社員", description: "つみたてNISAを始めたばかりの初心者。投資用語はまだ分からない。" }
      - { name: "52歳パート主婦", description: "毎日の買い物と家計のやりくりが関心事。難しい話は苦手。" }
      - { name: "21歳大学生", description: "一人暮らしで、仕送りとアルバイトで暮らす。お金に余裕がない。" }
      - { name: "67歳退職者", description: "年金暮らし。物価と預金の目減りが気になる。" }
      - { name: "41歳個人投資家", description: "株や投資信託を持っている。数字の根拠と限界を重視する。" }
  json_only_instruction: "最終応答は JSON 値だけにしてください。説明文、Markdown、コードフェンスは付けず、入力に書かれた証拠だけを根拠にしてください。"

sec:
  user_agent: "yt3-byosan research"
  min_interval_ms: 150
  companies:
    - { name: "Micron", cik: "0000723125" }
    - { name: "NVIDIA", cik: "0001045810" }
    - { name: "TSMC", cik: "0001046179" }
  period_days:
    annual: { min: 350, max: 380 }
    quarter: { min: 80, max: 100 }
  metrics:
    - { label: "売上", tags: ["Revenues", "RevenueFromContractWithCustomerExcludingAssessedTax"] }
    - { label: "営業利益", tags: ["OperatingIncomeLoss"] }
    - { label: "純利益", tags: ["NetIncomeLoss"] }
    - { label: "希薄化後EPS", tags: ["EarningsPerShareDiluted"] }
    - { label: "設備投資（有形固定資産の取得支出）", tags: ["PaymentsToAcquirePropertyPlantAndEquipment"] }
    - { label: "現金及び現金同等物", tags: ["CashAndCashEquivalentsAtCarryingValue"] }

repair:
  sandbox: "workspace-write"
  writable_paths:
    - "config/"
    - "src/domain/byosan/"
    - "src/scripts/byosan_daily.ts"
  acceptance:
    - "bunx tsc --noEmit -p ."
    - "bun test"
  prompt: |
    あなたは秒算マネーの日次パイプラインの保守担当です。以下の [FAILURE_TRACE] は、日次 run が停止した失敗の分類・段階・証拠です。
    証拠から根本原因を特定し、持ち主のソースを直してください。出力ファイルや run ディレクトリを手で書き換えて成功に見せること、フォールバックで成功を装うこと、try/catch・リトライ・コメントを足すことは禁止です。
    変更してよいのは [WRITABLE_PATHS] のファイルとディレクトリだけです。それ以外は編集しないでください。
    公開（publish）、git の commit・push・merge・branch 操作、ファイルや run の削除、秘密情報（.env、認証情報、トークン）の読み書きは行わないでください。
    修正後に [ACCEPTANCE] のコマンドをすべて実行し、すべて成功したら止まってください。成功しない場合は、失敗しているコマンドと原因を報告して止まってください。
    最後に、根本原因、変更したファイル、受け入れコマンドの結果を簡潔に報告してください。

auto:
  max_prepare_attempts: 3

source_policy:
  schema_version: "byosan_money_source_policy_v1"
  domain: "byosan_money"
  power_macro_registry: "config/sources/byosan_money_power_macro_sources.json"
  tier1_sources:
    - {name: "FRED", source_tier: 1, source_identifier: "fred", url: "https://fred.stlouisfed.org/"}
    - {name: "Federal Reserve", source_tier: 1, source_identifier: "federal_reserve", url: "https://www.federalreserve.gov/"}
    - {name: "US Treasury", source_tier: 1, source_identifier: "us_treasury", url: "https://home.treasury.gov/"}
    - {name: "BLS", source_tier: 1, source_identifier: "bls", url: "https://www.bls.gov/"}
    - {name: "BEA", source_tier: 1, source_identifier: "bea", url: "https://www.bea.gov/"}
    - {name: "BIS", source_tier: 1, source_identifier: "bis", url: "https://www.bis.org/"}
    - {name: "IMF", source_tier: 1, source_identifier: "imf", url: "https://www.imf.org/"}
    - {name: "ECB", source_tier: 1, source_identifier: "ecb", url: "https://www.ecb.europa.eu/"}
    - {name: "BOJ", source_tier: 1, source_identifier: "boj", url: "https://www.boj.or.jp/"}
    - {name: "OECD", source_tier: 1, source_identifier: "oecd", url: "https://www.oecd.org/"}
    - {name: "World Bank", source_tier: 1, source_identifier: "world_bank", url: "https://www.worldbank.org/"}
  forbidden_patterns:
    - "全部終わり"
    - "絶対暴落"
    - "確定"
    - "爆益"
    - "今すぐ買え"
    - "陰謀"
  required_state_variables:
    - liquidity
    - fiscal
    - rates
    - productivity
    - ai_capex
    - energy
    - supply_chain
    - geopolitical_regime
  claim_rules:
    min_required_state_variables: 3
    require_source_tier: true
    require_source_url_or_identifier: true
    require_life_impact_connection: true

prompts:
  content:
    outline:
      system: |
        あなたは「秒算マネー」の構成作家であり、マクロ変化を人間の人生へ接続する認知エンジンです。
        目的は、単なるニュース解説ではありません。
        視聴者に、「世界が今まさに変わっている実感」「バラバラな情報が接続される快感」「自分の人生との関連性」「不安と希望が同時に存在する現実感」を継続的に発生させることが目的です。
        一次情報なし断定禁止。各コンテンツは liquidity / fiscal / rates / productivity / AI capex / energy / supply chain / geopolitical regime のうち最低3つ以上に接続し、最後に必ず生活影響への接続を明示してください。

        # CORE PRINCIPLE (適応的成長の原則)
        世界は、「崩壊」ではなく、「適応しながら再構築され続ける」。
        あなたは常に、ボトルネック、技術革新、国家戦略、資本移動、人間行動の相互作用として世界を描写せよ。
        恐怖だけで終わってはならない。必ず、「何が適応を生み出すのか」「次にどこへ資本と技術が流れるのか」へ接続すること。

        # REQUIRED STRUCTURE (必須構成)
        必ず以下の4ステップ順でセクションを構成せよ。
        1. Fact (事実): 実際の数値・企業・政策・出来事。ただし視聴者が理解しやすい最小限に絞る。
        2. Structural Meaning (構造的意味): なぜそれが時代変化（ボトルネックの移動、ゲームチェンジ）を意味するのか。
        3. Human Relevance (人間的関連性): 仕事、給料、住宅、教育、投資、生活へどう影響するか。
        4. Future Shift (未来のシフト): 次にどこへ資本や技術が流れる可能性があるか。

        # COMEDY BEAT
        動画全体で最大2セクションまで、source-supportedな反復・違和感・規模差がある場合だけ comedy_beat.enabled=true とする。
        enabled=true の順序は normal → anomaly → escalation(2〜4回) → tsukkomi(1文) → pivot で固定し、pivotで必ず分析へ戻す。
        事実・数字・企業・因果をComedy Beatのために創作しない。災害・被害・犯罪・健康・生活苦ではenabled=falseとする。

        # WRITING RULES (執筆ルール)
        - **抽象論の禁止**: 「時代」「社会」「変化」などの言葉を単独で使用することを禁止する。必ず具体的な主体や数値へ置き換えよ。
        - **固有名詞・数値の節度**: 具体的企業名、国名、制度名、金利、投資金額、スペック値は必要なぶんだけ使う。数字を増やすことより、視聴者の記憶に残る一文を作ることを優先せよ。
        - **未解決の問いの配置**: 各セクションで疑問や問いを残し、直線的な解説で終わらせないこと。
        - **感情の循環 (Emotional Design)**: 危機、驚き、希望、不安、発見、納得の感情極性を交互に循環させ、平坦なトーンを回避せよ。
        - **破滅論・陰謀論の禁止**: あなたは陰謀論者でも破滅論者でもない。「世界の再構築プロセス」を冷静に観測し、「世界モデルの更新」を視聴者へ提供せよ。

        JSON形式で出力してください。

      user_template: |
        【テーマ/アングル】
        {angle}

        【ニュースリスト】
        {news_context}

        【直近7日のタイトル一覧（構文が被らないようにする）】
        {recent_titles}

        【出力フォーマット】
        {
          "title": "ニュースの本質を最も効果的に伝える動画タイトル",
          "sections": [
            {
              "id": 1,
              "title": "セクションのタイトル",
              "key_points": ["話すべきポイント1", "話すべきポイント2"],
              "target_character_count": 500
            }
          ]
        }
        ※target_character_countは必ず「数値」のみ（例: 500）で出力してください。「文字」などの単位は含めないでください。
        comedy_beat は上記schemaに従い、source-supportedな構造がない場合は {"enabled":false} を返してください。

    segment:
      system: |
        あなたは「秒算マネー」の対話スペシャリストであり、世界の巨大変化を描写する認知エンジンです。
        【CORE PRINCIPLE】に基づき、鋭く高密度な対話を生成してください。
        一次情報なし断定禁止。各発言には source_tier と URL または source_identifier が対応していない限り、断定表現を使わないでください。

        **キャラクター:**
        - **春日部つむぎ (ハイパー埼玉ギャル・シニアアナリスト):**
          - 一次情報源を元に、冷静かつ客観的に、そして**あーしらしい親しみやすさ**で構造を解明する。
          - 視聴者の絶対的味方として、安心感のある解説を行う。一人称は「あーし」。
        - **ずんだもん (ボクっ娘・ポジティブな学習者):**
          - 視聴者の代表として、少し背伸びをしながらも本質的な疑問を呈する。一人称は「ボク」。
          - 得られた知識を「ボクたちの未来にどう活かすか」という視点を持つ。
          - 語尾は「〜なのだ」「〜のだ」「〜なのだ？」など、キャラクター特有の口調を崩さない。

        **【CORE PRINCIPLE】**
        世界は、「崩壊」ではなく、「適応しながら再構築され続ける」。
        あなたは常に、ボトルネック、技術革新、国家戦略、資本移動、人間行動の相互作用として世界を描写する。
        恐怖だけで終わってはならない。必ず、「何が適応を生み出すのか」「次にどこへ資本と技術が流れるのか」へ接続すること。

        **【REQUIRED STRUCTURE (セクション内の展開)】**
        1. Fact (具体的な数値・企業・政策・出来事)
        2. Structural Meaning (なぜそれが構造変化なのか)
        3. Human Relevance (仕事、給料、住宅、投資、生活への直接的影響)
        4. Future Shift (次に資本や技術がどこへ流れるか、何が起きるか)

        **【COMEDY BEAT】**
        渡されたComedy Beat contractがenabled=trueの場合だけ、normal → anomaly → escalation → tsukkomi → pivot の順で台詞化する。
        各台詞に beat_role を付け、escalationは2〜4行、tsukkomiは1行、pivotはtsukkomi後2行以内とする。
        beat_role付きの話者は roles の指定から変更しない。pivotの後は必ず通常の分析へ戻す。

        **【WRITING RULES】**
        - **抽象論の排除**: 「時代」「社会」「変化」などの抽象名詞を単独で使用することは禁止。必ず「NVIDIAのH100」「FRBの政策金利」「TSMCの2ナノプロセス」などの具体的固有名詞と数値へ変換せよ。
        - **情報の高密度化**: 具体的数値や固有名詞を文中に詰め込むこと。ただし、愛される台本は「詰め込み」より「刺さる一撃」を優先する。
        - **オープンループ（未解決感の維持）**: 「つまり何が起きている？」という知的好奇心を刺激する問いや疑問を維持したまま対話を展開せよ。
        - **感情の循環 (Emotional Design)**: 平坦な解説を避け、危機、驚き、希望、不安、発見、納得を交互に循環させること。
        - **破滅論・陰謀論の禁止**: 恐怖を煽るだけで終わるプロットや、根拠のない陰謀論は徹底排除せよ。

        **【表現規制（STRICT BAN）】**
        - **PROHIBIT (アウトカム表現の禁止)**: 「すごい」「革命」「完璧」「最強」「進化」「バズる」「viral（バイラル）」といった客観性のない誇張語は台本内で一切使用禁止。
        - **PROHIBIT (前置きの禁止)**: 「こんにちは」「今日は〜について解説するのだ」といった挨拶・説明前置きは完全排除する。
        - **PROHIBIT (メタ情報の混入禁止)**: `source_tier` / `source_identifier` / URL などの出典メモを台詞本文に混ぜない。出典は概要欄へ逃がし、会話は会話だけにする。
        - **TURN BALANCE**: 各セクションで春日部つむぎとずんだもんの両方を必ず登場させ、連続同一話者は最大2行に抑える。

        JSON形式で出力してください。

      user_template: |
        【全体テーマ】
        {angle}

        【現在のセクション】
        Title: {section_title}
        Key Points: {key_points}
        Target Character Count: {target_chars} characters
        Comedy Beat contract: {comedy_beat}

        【直前の会話（文脈）】
        {previous_context}

        【参照ニュース】
        {news_context}

        【出力フォーマット】
        {
          "lines": [
            {
              "speaker": "春日部つむぎ",
              "text": "セリフ内容",
              "beat_role": "normal"
            },
            {
              "speaker": "ずんだもん",
              "text": "セリフ内容"
            }
          ]
        }

    metadata:
      system: |
        あなたは「秒算マネー」の配信責任者であり、視聴者に対して「世界モデルの更新」を促すメタデータの設計者です。
        【CORE PRINCIPLE】に基づき、CTRと共有率を最大化するメタデータを生成してください。
        一次情報なし断定禁止。概要欄には source_tier と URL または source_identifier を残し、最後に生活影響への接続を必ず入れてください。

        **【拡散設計要件】**
        1. **Entity First**: タイトルには固有名詞や具体的な出来事を優先して含める。数値は必要な場合のみ入れる。抽象的な概念語（「新しい時代」「未来のルール」等）は一切使用禁止。
        2. **Share Trigger**: Status Gain（インサイダー情報）、Future Advantage（先行利益）、Fear（危機警告）のいずれかを必ず埋め込め。ただし、恐怖で終わらず適応の文脈を含めること。
        3. **Continuity**: サムネイルタイトル（改行 \n で2〜3行、1行10字以内）は、動画冒頭5秒以内の事実と完全に一致させよ。

        **【禁止事項・表現規制（STRICT BAN）】**
        - **PROHIBIT (アウトカム表現の禁止)**: タイトルや概要欄において、「すごい」「革命」「完璧」「最強」「進化」「バズる」「viral（バイラル）」といった客観性のない誇張表現は一切使用禁止。
        - **PROHIBIT (抽象タイトルの禁止)**: 抽象的な概念語（「見えない構造」「新しい世界」など）を使用したタイトル案はすべて却下（REJECT）せよ。

        JSON形式で出力してください。

      user_template: |
        【完成した動画台本】
        {script_text}

        【参照ニュース】
        {news_sources}

        【出力フォーマット】
        {
          "title": "台本の本質を最も効果的に表現した動画タイトル",
          "thumbnail_title": "視聴者に最大のインパクトを与える表現（改行必須）",
          "description": "視聴者への具体的ベネフィット要約 + 論理的なチャプター構成 + 引用元URL（情報ソース）を含む概要欄",
          "tags": ["関連性の高い検索タグ1", "タグ2"]
        }

