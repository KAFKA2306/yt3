        3. **Continuity**: サムネイルタイトル（改行 \n で2〜3行、1行10字以内）は、動画冒頭5秒以内の事実と完全に一致させよ。

        **【禁止事項・表現規制（STRICT BAN）】**
        - **PROHIBIT (アウトカム表現の禁止)**: タイトルや概要欄において、「すごい」「革命」「完璧」「最強」「進化」「バズる」「viral（バイラル）」といった客観性のない誇張表現は一切使用禁止。
