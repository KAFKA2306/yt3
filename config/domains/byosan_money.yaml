global_style:
  font_path: "assets/fonts/IBMPlexSansJP-Regular.otf"
  font_name: "IBM Plex Sans JP"
  thumbnail:
    title_size: 110
    subtitle_size: 48
  video:
    subtitle_size: 64

workflow:
  default_run_dir: "runs"
  default_bucket: "byosan_money"
  checkpoint_enabled: true
  paths:
    lock_file: "logs/cron.lock"
    runs_dir: "runs"
    memory_dir: "data/memory"
    state_dir: "data/state"
  filenames:
    output: "output.yaml"
    state: "state.json"
    audio_dir: "audio"
    video_dir: "video"
    audio_full: "full.wav"
    subtitles: "subtitles.ass"
    thumbnail: "thumbnail.png"
    video: "video.mp4"

steps:
  research:
    regions:
      - { lang: "English (US/UK)", code: "en" }
      - { lang: "Chinese (China/Taiwan)", code: "zh" }
      - { lang: "Russian (Russia/CIS)", code: "ru" }
      - { lang: "German (Germany/EU)", code: "de" }
    temperature: 0.5
    default_limit: 3

  script:
    context_overlap_lines: 3
    default_tags: ["Finance", "Economy"]
    speakers:
      analyst:
        name: "春日部つむぎ"
        aliases: ["春日部つむぎ", "かすかべ つむぎ", "つむぎ"]
      reporter:
        name: "ずんだもん"
        aliases: ["ずんだもん"]
      narrator:
        name: "玄野武宏"
        aliases: ["玄野武宏", "ナレーション", "ナレーター"]

  audio:
    sample_rate: 24000
    format: "wav"

  subtitle:
    width_per_char_pixels: 70

  video:
    resolution: "1920x1080"
    fps: 30
    background_color: "#F7F5EF"
    intro_seconds: 5
    codec: "h264_nvenc"
    effects:
      - {type: "overlay", enabled: true, image_path: "assets/春日部つむぎ立ち絵公式_v2.0/春日部つむぎ立ち絵公式_v1.1.1.png", anchor: "bottom_right", height_ratio: 0.85, offset: {right: 20, bottom: 0}}
      - {type: "overlay", enabled: true, image_path: "assets/zundamon.webp", anchor: "bottom_left", height_ratio: 0.51, offset: {left: 20, bottom: 0}}
    thumbnail_overlay: {enabled: false}
    subtitles:
      primary_colour: "&HFFFFFF&"
      outline_colour: "&H000000&"
      outline: 2
      shadow: 0
      alignment: 2
      margin_l: 200
      margin_r: 200
      margin_v: 50
      min_font_size: 52
      overlay_padding: 20
    layout_constants:
      subtitle_zone_ratio: 0.15
      subtitle_height: 300
      default_max_w_ratio: 0.5

  thumbnail:
    enabled: true
    width: 1280
    height: 720
    padding: 80
    max_lines: 3
    max_chars_per_line: 11
    right_guard_band_px: 850
    show_subtitle: true
    iqa_thresholds:
      sharpness_min: 100
      contrast_goal: 7.0
      contrast_min: 5.0
      mobile_edge_min: 25
      humanity_min: 0.6
      corner_size: 40
    palettes:
      - {background_color: "#F7F5EF", title_color: "#17233F", outline_inner_color: "#7BA7E1", outline_inner_width: 15, outline_outer_color: "#FFFFFF", outline_outer_width: 20, subtitle_color: "#17233F"}
    overlays:
      - {name: "character", enabled: true, image_path: "assets/春日部つむぎ立ち絵公式_v2.0/春日部つむぎ立ち絵公式_v1.1.1.png", anchor: "bottom_right", height_ratio: 0.95, offset: {right: 0, bottom: 0}}
  youtube:
    enabled: true
    max_title_length: 100
    max_description_length: 5000
    max_tags_total_length: 500
    default_tags: ["AI", "VTuber", "Finance", "Economy"]
    category_id: 24
    default_visibility: "public"
    discord_notifications: {publish_start: true, publish_complete: true}

providers:
  llm:
    provider: "gemini"
    gemini: {model: "gemini-3.6-flash", primary_llm: "gemini-3.6-flash", temperature: 0.35, max_tokens: 32768}
    content: {temperature: 0.4}
    media: {temperature: 0.1}
    research: {temperature: 0.5}
  tts:
    voicevox:
      enabled: true
      url: "http://localhost:50121"
      speakers: {春日部つむぎ: 8, ずんだもん: 1, 玄野: 11, 玄野武宏: 11}
      timeout_ms: {query: 30000, synthesis: 60000}
      health_timeout_ms: 5000

  manager:
    check_interval_ms: 300000
    stale_lock_timeout_seconds: 3600
    start_hour: 7
    user: "kafka"

daily_publish:
  timezone: "Asia/Tokyo"
  resume_date: "2026-10-13"
  publish_approved: true

failure_classification:
  rate_limit_terms: ['\b429\b', 'rate limit', 'usage limit', 'try again at', 'exceeded your current quota', 'quota exhausted', 'resource exhausted']
  auth_terms: ['oauth', 'credential', 'unauthori[sz]ed', 'forbidden', '\b40[13]\b', 'invalid_grant', 'login required', 'not logged in', 'network', 'ECONN', 'ENOTFOUND']
  mcp_noise_terms: ['rmcp::', 'oauth-protected-resource', 'AuthRequired']

dashboard:
  port: 3000

logging:
  level: "INFO"
  format: "json"
  activity_log_file: "logs/agent_activity.jsonl"

news_bot:
  token_env: "DISCORD_TOKEN"
  command_name: "news"
  command_description: "Generate news video"
  starter_template: "Starting generation for: {query}"
  response_template: "Generating video for: {query}"
  thread_prefix: "video-"
  thread_message: "Progress will be posted here."

automation:
  enabled: true
  venv_activate: ".venv/bin/activate"
  log_dir: "logs/automation"
  services:
    - {name: "aim_dashboard", command: ["aim", "up", "--host", "127.0.0.1", "--port", "43800"]}
    - {name: "voicevox", command: ["bash", "scripts/voicevox_manager.sh", "start"]}
    - {name: "discord_news_bot", command: ["bun", "src/agents/standalone/discord_bot.ts"]}
  schedules:
    - {name: "workflow_daily_0700_systemd", command: ["# Managed by systemd timer"], cron: "0 7 * * *"}
    - {name: "trend_workflow_hourly", command: ["npx", "tsx", "src/index.ts"], args: ["--trend-mode"], cron: "0 * * * *"}

mcp:
  servers:
    context7:
      command: "npx"
      args: ["-y", "@upstash/context7-mcp"]
    figma:
      command: "npx"
      args: ["-y", "@figma/mcp-server-figma"]
    pptx:
      command: "npx"
      args: ["-y", "mcp-server-pptx"]
    arxiv:
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-arxiv"]

design_tokens:
  primary_brand_color: "#7BA7E1"
  accent_brand_color: "#B8A7E6"
  contrast_text_color: "#17233F"
  humanity_base_white: "#F7F5EF"
  humanity_soft_sky: "#7BA7E1"
  humanity_human_cream: "#FFD8A8"
  humanity_evening_orange: "#FFD8A8"
  humanity_gentle_blue: "#7BA7E1"
  humanity_soft_gray: "#8FA1B3"
  humanity_text_charcoal: "#17233F"
  humanity_accent_pink: "#F7B7C1"
  alert_color: "#B91C1C"
  success_color: "#A8D5BA"
  font_display: "IBM Plex Sans JP"
  font_text: "IBM Plex Sans JP"
  font_japanese: "IBM Plex Sans JP"

discovery:
  recent_days: 7
  repeat_window_days: 60
  max_items_per_feed: 5
  body_chars: 6000
  min_paragraph_chars: 80
  concurrency: 4
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
  registry: "config/sources/byosan_discovery_sources.json"
  owner_articles: "data/state/byosan_owner_articles.json"
  baseline:
    path: "data/state/byosan_discovery_baseline.json"
    sources:
      - id: "S001"
        days: 30
        max_items: null
        fetch:
          type: "html_items"
          url: "https://insight.factset.com/topic/earnings"
          page_url: "https://insight.factset.com/topic/earnings/page/{n}"
          pages: 10
          item: '<div class="fs--blog--item">\s*<a class="fs--blog--item--upper" href="(?<url>[^"]+)"[\s\S]*?<h6[^>]*>\s*(?<date>[^<]+?)\s*</h6>'
          link: '^https://insight\.factset\.com/[^/]+$'
          body: "paragraphs"
      - id: "S002"
        days: 30
        max_items: null
        fetch:
          type: "sitemap"
          url: "https://insight.factset.com/sitemap.xml"
          include: '^https://insight\.factset\.com/[^/]+$'
          body: "paragraphs"

llm:
  sandbox: "read-only"
  workdir_prefix: "byosan-llm-"
  max_attempts: 5
  codex: {model: "gpt-6.1-terra", reasoning_effort: "medium"}
  claude: {command: "claude", model: "claude-haiku-5-5", stage_models: {byosan_feature_draft: "claude-sonnet-5-5"}, workdir_prefix: "byosan-claude-", strip_env: ["ANTHROPIC_API_KEY", "ANTHROPIC_AUTH_TOKEN"]}
  fallback_backend: "claude"
  backends:
    digest: "claude"
  json_only_instruction: "最終応答は JSON 値だけにしてください。説明文、Markdown、コードフェンスは付けず、入力に書かれた証拠だけを根拠にしてください。"

sec:
  user_agent: "yt3-byosan research"
  min_interval_ms: 150
  companies:
    - { name: "Micron", cik: "0000723125" }
    - { name: "NVIDIA", cik: "0001045810" }
    - { name: "TSMC", cik: "0001046179" }
  period_days:
    annual: { min: 350, max: 380 }
    quarter: { min: 80, max: 100 }
  metrics:
    - { label: "売上", tags: ["Revenues", "RevenueFromContractWithCustomerExcludingAssessedTax"] }
    - { label: "営業利益", tags: ["OperatingIncomeLoss"] }
    - { label: "純利益", tags: ["NetIncomeLoss"] }
    - { label: "希薄化後EPS", tags: ["EarningsPerShareDiluted"] }
    - { label: "設備投資（有形固定資産の取得支出）", tags: ["PaymentsToAcquirePropertyPlantAndEquipment"] }
    - { label: "現金及び現金同等物", tags: ["CashAndCashEquivalentsAtCarryingValue"] }

source_policy:
  schema_version: "byosan_money_source_policy_v1"
  domain: "byosan_money"
  power_macro_registry: "config/sources/byosan_money_power_macro_sources.json"
  tier1_sources:
    - {name: "FRED", source_tier: 1, source_identifier: "fred", url: "https://fred.stlouisfed.org/"}
    - {name: "Federal Reserve", source_tier: 1, source_identifier: "federal_reserve", url: "https://www.federalreserve.gov/"}
    - {name: "US Treasury", source_tier: 1, source_identifier: "us_treasury", url: "https://home.treasury.gov/"}
    - {name: "BLS", source_tier: 1, source_identifier: "bls", url: "https://www.bls.gov/"}
    - {name: "BEA", source_tier: 1, source_identifier: "bea", url: "https://www.bea.gov/"}
    - {name: "BIS", source_tier: 1, source_identifier: "bis", url: "https://www.bis.org/"}
    - {name: "IMF", source_tier: 1, source_identifier: "imf", url: "https://www.imf.org/"}
    - {name: "ECB", source_tier: 1, source_identifier: "ecb", url: "https://www.ecb.europa.eu/"}
    - {name: "BOJ", source_tier: 1, source_identifier: "boj", url: "https://www.boj.or.jp/"}
    - {name: "OECD", source_tier: 1, source_identifier: "oecd", url: "https://www.oecd.org/"}
    - {name: "World Bank", source_tier: 1, source_identifier: "world_bank", url: "https://www.worldbank.org/"}
  forbidden_patterns:
    - "全部終わり"
    - "絶対暴落"
    - "確定"
    - "爆益"
    - "今すぐ買え"
    - "陰謀"
  required_state_variables:
    - liquidity
    - fiscal
    - rates
    - productivity
    - ai_capex
    - energy
    - supply_chain
    - geopolitical_regime
  claim_rules:
    min_required_state_variables: 3
    require_source_tier: true
    require_source_url_or_identifier: true
    require_life_impact_connection: true

feature_production:
  default_spec: "config/productions/sp500_anthropic_2026q2.json"
  hero_source_name: "hero_imagegen_source.png"
  brand_label: "秒算マネー"
  yaml_line_width: 110
  publish_intent:
    profile: "byosan"
    visibility: "public"
    requires_receipt: true
    requires_visibility_attestation: true
  run_layout:
    source_dir: "source"
    explanation: "explanation.json"
    content_dir: "content"
    content_output: "output.yaml"
    metadata: "metadata.json"
    research: "research.json"
    media_dir: "media"
    media_output: "output.yaml"
    audio_dir: "media/audio"
    audio_manifest: "manifest.json"
    video_dir: "media/video"
    audio_concat_list: "media/audio/segments.ffconcat"
    thumbnail_jpg: "thumbnail_youtube.jpg"
    visual_master: "visual_master.mp4"
    openmontage_props: "openmontage_props.json"
    video_concat_list: "media/video/segments.ffconcat"
    publish_video: "publish_video.mp4"
    audit_dir: "audit"
    production_report: "production_quality_report.json"
    audit_report: "report.json"
    publish_dir: "publish"
    publish_input: "input.yaml"
  tts:
    manifest_preview_chars: 60
    narration_replacements:
      - {from: "S&P 500", to: "エスアンドピー・ファイブハンドレッド"}
      - {from: "S&P500", to: "エスアンドピー・ファイブハンドレッド"}
      - {from: "Alphabet", to: "アルファベット"}
      - {from: "Amazon", to: "アマゾン"}
      - {from: "Anthropic", to: "アンソロピック"}
      - {from: "FactSet", to: "ファクトセット"}
      - {from: "SpaceX", to: "スペースエックス"}
      - {from: "AWS", to: "エーダブリューエス"}
      - {from: "EPS", to: "イーピーエス"}
      - {from: "IPO", to: "アイピーオー"}
      - {from: "GAAP", to: "ギャップ"}
      - {from: "OI&E", to: "その他損益"}
      - {from: "Level 3", to: "レベルスリー"}
      - {from: "Q2", to: "第2四半期"}
      - {from: "%", to: "パーセント"}
      - {from: "$", to: ""}
    voice_presets:
      shock: {speedScale: 1.12, pitchScale: 0.025, intonationScale: 1.32, volumeScale: 1.0, prePhonemeLength: 0.08, postPhonemeLength: 0.24, pauseLengthScale: 1.08, outputSamplingRate: 48000}
      reveal: {speedScale: 1.04, pitchScale: 0.005, intonationScale: 1.22, volumeScale: 1.0, prePhonemeLength: 0.08, postPhonemeLength: 0.3, pauseLengthScale: 1.15, outputSamplingRate: 48000}
      curious: {speedScale: 1.1, pitchScale: 0.035, intonationScale: 1.28, volumeScale: 0.98, prePhonemeLength: 0.08, postPhonemeLength: 0.22, pauseLengthScale: 1.05, outputSamplingRate: 48000}
      analytical: {speedScale: 1.06, pitchScale: -0.005, intonationScale: 1.1, volumeScale: 0.98, prePhonemeLength: 0.08, postPhonemeLength: 0.25, pauseLengthScale: 1.04, outputSamplingRate: 48000}
      caution: {speedScale: 0.99, pitchScale: -0.02, intonationScale: 1.16, volumeScale: 0.98, prePhonemeLength: 0.09, postPhonemeLength: 0.34, pauseLengthScale: 1.2, outputSamplingRate: 48000}
      confident: {speedScale: 1.08, pitchScale: 0.0, intonationScale: 1.2, volumeScale: 1.0, prePhonemeLength: 0.08, postPhonemeLength: 0.26, pauseLengthScale: 1.05, outputSamplingRate: 48000}
      warm: {speedScale: 1.02, pitchScale: 0.015, intonationScale: 1.18, volumeScale: 0.98, prePhonemeLength: 0.09, postPhonemeLength: 0.32, pauseLengthScale: 1.12, outputSamplingRate: 48000}
      relieved: {speedScale: 1.05, pitchScale: 0.02, intonationScale: 1.2, volumeScale: 0.98, prePhonemeLength: 0.08, postPhonemeLength: 0.28, pauseLengthScale: 1.08, outputSamplingRate: 48000}
      serious: {speedScale: 0.98, pitchScale: -0.025, intonationScale: 1.12, volumeScale: 0.99, prePhonemeLength: 0.09, postPhonemeLength: 0.36, pauseLengthScale: 1.18, outputSamplingRate: 48000}
      joy: {speedScale: 1.08, pitchScale: 0.025, intonationScale: 1.26, volumeScale: 0.99, prePhonemeLength: 0.08, postPhonemeLength: 0.38, pauseLengthScale: 1.12, outputSamplingRate: 48000}
    speaker_caps:
      春日部つむぎ: {}
      ずんだもん: {pitchScale: 0.0, intonationScale: 1.1}
  emotion_labels:
    shock: "驚き"
    reveal: "核心"
    curious: "疑問"
    analytical: "分析"
    caution: "注意"
    confident: "確信"
    warm: "納得"
    relieved: "理解"
    serious: "警戒"
    joy: "次へ"
  characters:
    zundamon_image: "assets/zundamon.webp"
    tsumugi_image: "assets/春日部つむぎ立ち絵公式_v2.0/春日部つむぎ立ち絵公式_v2.0.png"
  image:
    png_compression_level: 8
    hero_channels: 3
    trim_background: {r: 255, g: 255, b: 255, alpha: 0}
  audio:
    sample_rate: 48000
    narration_codec: "pcm_s24le"
    narration_channels: 1
    final_codec: "aac"
    final_channels: 2
    final_bitrate: "384k"
    narration_filter: "highpass=f=70,lowpass=f=16000,acompressor=threshold=-20dB:ratio=2:attack=8:release=110,pan=stereo|c0=c0|c1=c0"
    bed_filter: "lowpass=f=950,highpass=f=35,pan=stereo|c0=c0|c1=c0"
    mix_filter: "amix=inputs=2:duration=first:dropout_transition=0:normalize=0,loudnorm=I=-14.5:TP=-1.0:LRA=7"
    bed_tones:
      - {frequency_hz: 55, amplitude: 0.006, lfo_hz: 0.10, lfo_offset: 0.72, lfo_depth: 0.28}
      - {frequency_hz: 82.41, amplitude: 0.0035, lfo_hz: 0.067, lfo_offset: 0.62, lfo_depth: 0.38}
  video:
    openmontage: {dir: "/home/kafka/OpenMontage", repo: "https://github.com/calesthio/OpenMontage.git", ref: "d21f5d4eaa08422b09c7091757a05affcbabb35b", composition: "Explainer", crf: 14}
    scale_flags: "lanczos"
    gop: 15
    b_frames: 2
    h264_profile: "high"
    pixel_format: "yuv420p"
    color_standard: "bt709"
    encoder_probe_source: "color=c=black:s=1280x720:d=0.05"
    nvenc:
      codec: "h264_nvenc"
      args: ["-preset", "p5", "-rc", "vbr", "-cq", "15", "-b:v", "16M", "-maxrate", "24M", "-bufsize", "32M"]
    libx264:
      codec: "libx264"
      args: ["-preset", "fast", "-b:v", "10M", "-minrate", "10M", "-maxrate", "10M", "-bufsize", "20M", "-x264-params", "nal-hrd=cbr:force-cfr=1:filler=1"]
  captions:
    max_lines: 2
    max_line_units: 19
    tolerance_units: 0.5
    half_width_units: 0.58
    overflow_penalty: 100
    min_split_units: 4
    protected_number_pattern: "[0-9.億万兆]+(?:ドル|パーセント|ポイント|セント)?"
    no_break_terms: ["S&P 500", "ブレンデッド", "パーセント", "ポイント", "非議決権優先株", "推定公正価値", "経済的エクスポージャー", "利益成長率", "株式評価益", "純利益", "未発表企業", "稼いだ", "ではない", "比較用", "権利差", "来年", "から", "引き上げ", "あります", "なります", "推定します", "構造です", "どう動く", "のだ", "FactSet", "Alphabet", "Amazon", "Anthropic", "SpaceX", "AWS", "EPS", "IPO"]
    lead_in_seconds: 0.08
    tail_seconds: 0.18
    min_usable_seconds: 0.8
    min_cue_seconds: 0.84
    fade_in_ms: 80
    fade_out_ms: 100
  ass_style:
    font_size: 68
    bold: -1
    outline: 5
    shadow: 0
    alignment: 2
    margin_l: 180
    margin_r: 180
    margin_v: 52
  scene:
    headline_wrap_units: 21
    min_font_px: 22
    statement: {headline_baseline_y: 470, headline_font_size: 132, headline_line_height: 150, subheadline_baseline_y: 700, subheadline_font_size: 44, rule_y: 300, rule_width: 240, rule_height: 10}
    headline_compact_threshold_units: 18
    stat_value_compact_threshold_units: 12
    stat_value_medium_threshold_units: 8
    stat_value_compact_wrap_units: 16
    stat_value_wrap_units: 20
    stat_value_max_lines: 2
    stat_value_letter_spacing_px: -1
    source_label: "SOURCE"
  thumbnail:
    jpeg_quality: 92
    jpeg_chroma_subsampling: "4:4:4"
    imagegen:
      size: "2048x1152"
      prompt: "YouTube thumbnail art, 16:9. Build a distinct composition from {topic}; choose the viewpoint, setting, people, and visual metaphor for this episode. Reference characters may appear when they fit; neither is required. Keep a calm area at left for the title overlay. No text, letters, numbers, logos, or watermarks."
    text: {x: 0.04, y: 0.1, width: 0.5, height: 0.8, max_font_ratio: 0.2, line_height: 1.18, max_lines: 3, fill: "#FFFFFF", stroke: "#17233F", stroke_ratio: 0.16, break_penalty: 4}
    brand: {x: 0.04, y: 0.95, font_ratio: 0.06}
    art_scale: 0.78
    scrim: {width: 0.62, opacity: 0.55, color: "#17233F"}
  audit:
    video_codec: "h264"
    audio_codec: "aac"
    min_output_bitrate_bps: 7500000
    max_scene_seconds: 16
    duration_tolerance_seconds: 0.5
    black_min_seconds: 1.0
    black_pixel_threshold: 0.03
    freeze_noise_db: -50
    freeze_min_seconds: 4.0
    defect_log_max_lines: 40
    ffmpeg_max_buffer_bytes: 104857600
    voice_register:
      frame_length: 2048
      hop_length: 256
      fmin_hz: 60
      fmax_hz: 1000
      reference_percentile: 90
      loud_relative_db: -25
      loud_percentile: 95
      max_loud_f0_percentile_hz: 520
      jump_window_seconds: 0.032
      jump_ratio: 1.6
      clip_threshold: 0.99

chapters:
  min_chapter_seconds: 10
  headings:
    key_points: "この動画の要点"
    evidence: "根拠と限界"
    chapters: "チャプター"
