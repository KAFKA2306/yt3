use_case_playlists:
  q1_action_boost:
    title: "家事・運動・ドライブで動き出す | 雨晴はうの人類観測所"
    description: "家事や運動、ドライブを始めたいときに。勢いのあるリズムと印象的なフックで、体を動かすきっかけになるオリジナル曲を集めています。"
    sound_hint: "A clear forward pulse, lively energy, and a memorable hook that makes movement feel inviting; choose tempo and genre for the song, not a fixed BPM range."
  q2_focus_boost:
    title: "作業・勉強に集中して続ける | 雨晴はうの人類観測所"
    description: "作業や勉強に気持ちを切り替えたいときに。一定のグルーヴや推進力が、ひとつのことを続ける時間に寄り添うオリジナル曲を集めています。"
    sound_hint: "A steady groove and clear forward motion suited to returning attention to one task; judge the finished song's vocal and arrangement fit, not BPM alone."
  q3_daily_flow:
    title: "支度・散歩・移動のペースに乗る | 雨晴はうの人類観測所"
    description: "朝の支度や散歩、通勤通学など、いつもの時間を自分のペースで過ごしたいときに。軽やかに流れるオリジナル曲を集めています。"
    sound_hint: "An easy, buoyant groove for everyday movement; prefer a natural fit with the scene over a fixed tempo or genre."
  q4_night_reset:
    title: "夜・休憩に気持ちをほどく | 雨晴はうの人類観測所"
    description: "一日の終わりや休憩に、気持ちをゆるめたいときに。静けさや余韻のあるオリジナル曲を集めています。"
    sound_hint: "Room for reflection and emotional release through tone, space, and phrasing; tempo and genre follow each song's own concept."
