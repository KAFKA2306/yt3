yue:
  dir: /home/kafka/YuE
  hf_home: /home/kafka/.cache/hf-kafka
  python: .venv/bin/python
  script: examples/generate.py
  license_file: /home/kafka/YuE/MODEL_LICENSE
  license_clause: Individual creators and output monetization
  min_free_vram_mib: 9000
  snapshot_dir: /home/kafka/.cache/hf-kafka/hub/models--m-a-p--YuE2-3B/snapshots
output_dir: runs/humanity_music
style_template: "{genre}, {tempo}, {key}, {lead}, {rhythm}, {vocal}"
temperature: 0.9
playlist:
  file: playlist.m3u8
  audio_file: audio.mp3
  bitrate: 256k
rating:
  min: 1
  max: 5
axes:
  genre: [Japanese technopop, electro house, electropop, future pop, dance pop, eurobeat influenced rave pop, eurobeat]
  tempo: ["124 BPM", "128 BPM", "130 BPM", "132 BPM", "134 BPM", "140 BPM", "150 BPM"]
  key: [C major, A minor, D major, F# minor, E minor, G major, Eb major]
  lead: [detuned supersaw lead, bright saw arpeggios, staccato synth stabs, punchy FM bass lead, glassy digital bell lead, bright saw lead with brass stabs]
  rhythm: [sidechained pumping bass with four on the floor kick, filter sweeps with crisp digital hi-hats, sidechained chords with tight kick, glitchy percussion with rolling bass, sequenced octave bass with tight drums]
  vocal: [cute bright synthetic female vocal, robotic autotuned female vocal, vocoder female vocal, bright pitch-corrected female vocal, processed female vocal with unison doubling, stuttered vocal chops female]
structure: [Verse, Chorus, Verse, Chorus, Bridge, Chorus]
lines_per_section: 4
trend_rule: 作詞の前にウェブ検索で、今日の日本で話題の出来事・流行語・ヒット作・SNSの空気を調べ、その中から1つを題材の核にする。固有名詞や他者の作品の歌詞は使わず、そこに暮らす人の不器用さと愛おしさを書く。
lyrics_rule: 題材は音楽ジャンル以外すべて自由。過去のタイトルと題材・主要な名詞が重ならない新しい題材を選ぶ。人類の不器用さを愛おしむ温度で、専門用語で威張らず、既存曲の歌詞や固有の言い回しを使わない。日本語で書く。Chorusは毎回同じ歌詞、VerseとBridgeは毎回違う歌詞にする。
run:
  bucket: humanity_observatory
  name_prefix: music-
cover:
  file: cover.png
  size: 1536x1024
  prompt: 人類観測所の曲のカバー絵。やわらかい水彩風。配色は白(#FFFDF8)、空色(#BFE7FF)、夕焼けオレンジ(#FFB86B)。文字は入れない。16:9の構図。場面は{scene}。
video:
  file: video.mp4
  width: 1920
  height: 1080
  fps: 24
  crf: 28
  audio_bitrate: 256k
  fade_seconds: 5
thumbnail:
  file: thumbnail.jpg
  width: 1280
  height: 720
  quality: 3
audit:
  duration_tolerance_seconds: 1.5
  max_song_attempts: 3
metadata:
  title_suffix: " | 人類観測所の音楽"
  tags: [YuE2, AI音楽, テクノポップ, 人類観測所]
  description: "{title}\n\n場面: {scene}\n\n{lyrics}\n\n{ai_disclosure}\n{credit}"
  credit: "Music: YuE2-3B (m-a-p) #YuE2 / Cover image: gpt-image-2 via Codex CLI"
  ai_disclosure: この曲の音楽、歌詞、映像はAIで生成しています。
rights_declaration: 個人の立場の運営者として、歌詞は当該 run で新規に生成し、第三者の歌詞と音源を使っていない。
youtube_playlist:
  title: 人類観測所の音楽
  description: 人類の不器用さを愛おしむ曲を、少しずつ増やしています。すべてAIで生成しています。
  privacy: public
  ready_attempts: 20
  ready_interval_ms: 6000
  target_minutes: 120
