# YT3 Project-Specific Model Routing & GPU Policy
# Host hardware, CLI versions, and general model catalog live in ~/.gemini/config/workstation.md.
schema_version: 2
updated_at: "2026-11-20"
workstation_profile: "~/.gemini/config/workstation.md"

gpu_policy:
  shared_lock_file: "~/.cache/yt3-gpu.lock"
  execution_mode: oneshot_load_and_release
  resident_gpu_daemons: forbidden

routes:
  creative_draft_default:
    provider: agy
    model: gemini-4-hydrogen-medium
    vram_mb: 0
    source_of_truth: "config/creative_authoring.yaml"

  creative_title_default:
    provider: codex
    model: gpt-6-luna
    reasoning_effort: low
    vram_mb: 0
    source_of_truth: "config/creative_authoring.yaml"

  byosan_non_creative:
    provider: codex
    model: gpt-6.1-terra
    reasoning_effort: medium
    vram_mb: 0
    source_of_truth: "config/domains/byosan_money.yaml"

  benchmark_l2_judge:
    provider: agy
    model: gemini-4-argon-high
    vram_mb: 0
    source_of_truth: "src/scripts/benchmark_judge.ts"

  humanity_music_gpu:
    provider: local_gpu
    model: yue2
    gpu_exclusive: true
    source_of_truth: "config/music/humanity.yaml"

  yawa_voice_gpu:
    provider: local_gpu
    model: irodori_tts
    gpu_exclusive: true
    source_of_truth: "config/yawa/runtime.yaml"

  byosan_narration_cpu:
    provider: local_cpu
    model: voicevox_nemo
    vram_mb: 0
    source_of_truth: "config/domains/byosan_money.yaml"
