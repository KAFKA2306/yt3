root:
  files:
    - package.json
    - bun.lock
    - bunfig.toml
    - pyproject.toml
    - uv.lock
    - tsconfig.json
    - biome.json
    - Taskfile.yml
    - agr.toml
    - README.md
    - AGENTS.md
    - GEMINI.md
    - .env.example
    - .pre-commit-config.yaml
    - .gitignore
  directories:
    - src
    - config
    - docs
    - tests
    - scripts
    - systemd
    - .github
    - .claude
    - .serena
    - hooks
    - runs
    - db
    - logs
    - artifacts
    - audits
    - assets
    - asmr
    - data
    - sbg-nav-audit
    - research
adr:
  directory: docs/adr
  index: docs/adr/README.md
  accepted_status_prefixes:
    - Accepted
    - 採用
docs:
  scanned:
    - README.md
    - AGENTS.md
    - docs/
  excluded_prefixes:
    - docs/archive/
  path_placeholders:
    - "<"
    - ">"
    - "*"
    - "{"
    - "}"
    - "$"
    - NNNN
    - YYYY
